*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:#1b2433;background:var(--bgimg) center/cover fixed no-repeat,#13203b}
.app{display:flex;min-height:100vh}nav{width:210px;background:rgba(13,22,45,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:15px;margin:4px 8px 14px;line-height:1.25}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cdd6ea;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}

.card,.dlg{background:rgba(255,255,255,.72);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.5);box-shadow:0 8px 28px rgba(0,0,0,.18);border-radius:var(--rd);padding:14px}
#clock{position:sticky;top:8px;z-index:5}

.btn{border:1px solid var(--bd);background:rgba(255,255,255,.75);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}.btn:hover{background:#eef2fa}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.d{color:#b42318;border-color:#f0b9b3}

.chb{display:block;width:100%;text-align:left;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.sp{margin-bottom:12px}
.bar{height:10px;background:#e8ecf4;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;transition:width .25s}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.lg{display:flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:20px;padding:3px 10px;background:rgba(255,255,255,.75);cursor:pointer;font-size:13px}.lg.on{outline:2px solid var(--ac)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}

.badge{font-size:12px;border-radius:10px;padding:2px 8px;background:#e8eefc;color:var(--ac)}.badge.opp{background:#fdeceb;color:#b42318}
.banner{padding:10px 14px;border-radius:10px;margin:10px 0;background:rgba(238,246,238,.8);border:1px solid #bfdcbf}.banner.warn{background:rgba(255,246,224,.85);border-color:#ecd08a}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.ov[hidden]{display:none}
.dlg{background:rgba(255,255,255,.92);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}.dlg.wide{max-width:560px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:10px;padding:2px 9px;margin-bottom:6px}
.story{line-height:1.55;background:rgba(255,255,255,.7);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px}
.adv{background:rgba(255,246,224,.95);border:1px solid #ecd08a;border-radius:8px;padding:8px 10px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin-top:3px;background:rgba(255,255,255,.8)}input[type=color]{height:38px;padding:2px}input[type=range]{padding:0}
.err{color:#b42318;font-size:13px;min-height:16px;margin:8px 0 0}#toast{position:fixed;bottom:16px;right:16px;z-index:30}#toast div{background:#13203b;color:#fff;padding:9px 14px;border-radius:8px;margin-top:6px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}.cols .card{background:rgba(255,255,255,.6)}.item{background:rgba(255,255,255,.75);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px}
#tip{position:fixed;display:none;z-index:40;pointer-events:none;background:rgba(13,22,45,.92);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;max-width:240px}#tip .mu{color:#b9c4dd}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:8px}nav h1{width:100%;margin:2px 6px}nav button{width:auto;padding:7px 10px}nav .lang{margin:0}.cols{grid-template-columns:1fr}main{padding:12px}}

E("flood","env",["Floods hit the interior","Banjir melanda pedalaman"],
["Three days of heavy rain have pushed the rivers over their banks. Several longhouses are cut off, boats are the only transport, and community leaders are asking for food, medicine and temporary shelter. Local radio warns that some bridges may not hold.","Hujan lebat tiga hari menyebabkan sungai melimpah. Beberapa rumah panjang terputus hubungan, bot jadi satu-satunya pengangkutan, dan ketua komuniti meminta makanan, ubat dan tempat perlindungan sementara. Radio tempatan memberi amaran sesetengah jambatan mungkin tidak tahan."],
[[["Release emergency funds and deploy relief teams","Lepaskan dana kecemasan dan hantar pasukan bantuan"],["Relief boats reach the longhouses within two days. Residents praise the speed, though the treasury takes a visible hit.","Bot bantuan sampai ke rumah panjang dalam dua hari. Penduduk memuji kepantasan, walaupun kewangan negeri terasa tekanannya."],{a:6,mo:-40,u:-2,pol:"Flood relief fund|Disaster"}],
 [["Leave it to the district agencies","Serahkan kepada agensi daerah"],["The agencies cope, but slowly. Footage of stranded families spreads and the opposition calls the response careless.","Agensi menguruskannya, tetapi perlahan. Rakaman keluarga terkandas tersebar dan pembangkang menggelar respons ini cuai."],{a:-3,u:4}],
 [["Blame federal agencies for late warnings","Salahkan agensi Persekutuan kerana amaran lewat"],["The statement rallies some supporters behind the autonomy cause, but it does nothing for the victims and looks like deflection.","Kenyataan ini menyatukan sebahagian penyokong di sebalik isu autonomi, tetapi tidak membantu mangsa dan nampak seperti mengelak tanggungjawab."],{a:1,m:4,u:3}]],{adv:"inf",rec:0}),
E("road","eco",["Highway repairs stall","Pembaikan lebuh raya tergendala"],

[[["Ask the federal government for an allocation","Minta peruntukan daripada Persekutuan"],["Putrajaya agrees to share the cost, but only after weeks of paperwork and some quiet concessions.","Putrajaya bersetuju berkongsi kos, tetapi selepas berminggu-minggu urusan dan beberapa kompromi senyap."],{e:4,a:2,m:-3}],
 [["Pay the contractors from state funds","Bayar kontraktor daripada dana negeri"],["The road reopens ahead of schedule and traders are relieved. The state account looks noticeably thinner.","Jalan dibuka semula lebih awal dan peniaga lega. Akaun negeri nampak jelas lebih tipis."],{mo:-60,a:4,m:3,e:2,pol:"State road upgrade|Infrastructure"}],

E("net","soc",["Rural internet gap","Jurang internet luar bandar"],

[[["Build community towers with state funds","Bina menara komuniti guna dana negeri"],["Signal reaches dozens of villages within months. Parents are grateful and small traders start accepting digital payments.","Isyarat sampai ke berpuluh kampung dalam beberapa bulan. Ibu bapa berterima kasih dan peniaga kecil mula menerima bayaran digital."],{a:5,mo:-35,e:2,pol:"Rural connectivity programme|Digital"}],

E("ma63","fed",["Autonomy talks with Putrajaya","Rundingan autonomi dengan Putrajaya"],
["A new round of talks with the federal government on state rights is due. Supporters want a firm public stand, but federal ministers hint that funding for state projects depends on a cooperative tone. Your advisers are split on whether open pressure or quiet diplomacy works better.","Pusingan rundingan baharu dengan kerajaan Persekutuan tentang hak negeri akan bermula. Penyokong mahu pendirian awam yang tegas, tetapi menteri Persekutuan mengisyaratkan dana projek negeri bergantung kepada nada kerjasama. Penasihat anda berpecah sama ada tekanan terbuka atau diplomasi senyap lebih berkesan."],
[[["Take a firm stand in public","Bersikap tegas secara terbuka"],["Crowds cheer and the autonomy issue dominates the news. Relations with the federal side cool, and some partners worry about the risks.","Orang ramai bersorak dan isu autonomi menguasai berita. Hubungan dengan pihak Persekutuan menjadi dingin dan sesetengah rakan risau tentang risikonya."],{m:6,u:3,l:2,w:1}],
 [["Negotiate quietly through officials","Berunding secara senyap melalui pegawai"],["Small gains are agreed without drama. Few notice, but the process stays calm.","Beberapa kemajuan kecil dipersetujui tanpa drama. Ramai tidak perasan, tetapi prosesnya kekal tenang."],{m:2,u:-1}],
 [["Concede some rights in exchange for funding","Beralah atas beberapa hak demi peruntukan"],["Cash arrives quickly and projects restart. Critics say the state traded long-term rights for short-term money.","Wang tiba cepat dan projek bermula semula. Pengkritik berkata negeri menukar hak jangka panjang dengan wang jangka pendek."],{m:-4,mo:60,l:-2}]]),
E("coal","pol",["Coalition seat dispute","Pertelingkahan kerusi dalam gabungan"],
["Two parties in your coalition are fighting over who deserves the stronger positions and more local projects. One threatens to withhold support in a budget vote; the other says it carries more seats and deserves priority. The press is already reporting a rift.","Dua parti dalam gabungan anda bertelagah tentang siapa yang layak mendapat jawatan lebih kuat dan lebih banyak projek tempatan. Satu mengugut menahan sokongan dalam undi bajet; satu lagi berkata ia membawa lebih banyak kerusi dan patut diutamakan. Media sudah melaporkan keretakan."],
[[["Mediate personally and split the posts","Menjadi pengantara dan bahagikan jawatan"],["Both parties grumble, but a deal is signed. The coalition looks steadier, although the talks ate up a lot of your time.","Kedua-dua parti merungut, tetapi perjanjian ditandatangani. Gabungan nampak lebih stabil, walaupun rundingan memakan banyak masa anda."],{l:5,u:-2,a:-1}],
 [["Favour the bigger party","Menyebelahi parti yang lebih besar"],["The bigger party is delighted. The smaller one leaks complaints to the press and talks about leaving.","Parti lebih besar gembira. Yang lebih kecil membocorkan rungutan kepada media dan bercakap tentang keluar."],{l:-4,u:2,w:1}],
 [["Stay out of it","Tidak campur tangan"],["The dispute drags on and trust inside the coalition erodes. Observers say the leadership looks absent.","Pertikaian berlarutan dan kepercayaan dalam gabungan terhakis. Pemerhati berkata kepimpinan nampak tiada."],{l:-6,w:-1}]]),
E("defect","pol",["Rumours of a defection","Khabar wakil rakyat melompat"],
["Rumours say a government assemblyman is unhappy over a stalled project in his area and is talking to the other side. He denies it, but his attendance has dropped. If he leaves, the margin in the chamber gets thinner.","Khabar angin mengatakan seorang wakil rakyat kerajaan tidak puas hati dengan projek tergendala di kawasannya dan sedang berbincang dengan pihak lain. Beliau menafikan, tetapi kehadirannya menurun. Jika beliau keluar, margin dalam dewan menjadi lebih nipis."],
[[["Offer him a senior post and the project","Tawarkan jawatan kanan dan projek itu"],["He stays and the project gets a groundbreaking date. Others in the bloc notice that complaining pays.","Beliau kekal dan projek itu dapat tarikh pecah tanah. Yang lain dalam blok perasan bahawa mengadu memberi hasil."],{l:-2,mo:-15,u:-1}],
 [["Let him go","Biarkan beliau pergi"],["He crosses over a week later with a press conference. The bloc loses a seat and the story runs for days.","Beliau menyeberang seminggu kemudian dengan sidang media. Blok kehilangan satu kerusi dan cerita ini berlarutan beberapa hari."],{f:"g",a:-1,u:3}],
 [["Discipline him publicly","Ambil tindakan disiplin secara terbuka"],["The message is clear and other members fall in line. But the move looks harsh and he becomes a martyr for critics.","Mesejnya jelas dan ahli lain akur. Tetapi langkah ini nampak keras dan beliau menjadi wira bagi pengkritik."],{l:3,u:2,a:-2}]]),
E("price","eco",["Commodity prices fall","Harga komoditi jatuh"],
["World prices for palm oil and pepper have dropped sharply and smallholders say they can no longer cover costs. Farmer associations are gathering in the district towns. The finance team warns that subsidies for everyone would be expensive.","Harga dunia minyak sawit dan lada hitam jatuh mendadak dan pekebun kecil berkata mereka tidak lagi mampu menampung kos. Persatuan petani berkumpul di pekan daerah. Pasukan kewangan memberi amaran subsidi untuk semua akan mahal."],
[[["Pay direct subsidies to all smallholders","Beri subsidi terus kepada semua pekebun kecil"],["Payments arrive within weeks and the protests fade. The bill is large and critics ask who will pay next year.","Bayaran tiba dalam beberapa minggu dan protes reda. Bilnya besar dan pengkritik bertanya siapa akan membayar tahun depan."],{mo:-50,a:5,l:2}],
 [["Targeted aid for the poorest only","Bantuan tersasar untuk yang paling miskin sahaja"],["Help reaches those who need it most at a lower cost. Mid-sized farmers feel overlooked.","Bantuan sampai kepada yang paling memerlukan dengan kos lebih rendah. Pekebun sederhana rasa diabaikan."],{mo:-25,a:3,u:1}],
 [["Let the market adjust","Biarkan pasaran menyesuaikan diri"],["Some farms close and rural unemployment rises. Economists applaud the discipline; farmers do not.","Beberapa ladang ditutup dan pengangguran luar bandar meningkat. Ahli ekonomi memuji disiplin; petani tidak."],{e:-3,a:-5,u:4}]],{adv:"fin",rec:1}),
E("rally","pol",["Opposition rally draws crowds","Ceramah pembangkang tarik ramai"],
["Opposition parties have filled a stadium with supporters who are angry about living costs. The speeches are shared widely online and some of your own members say the government should respond directly. A counter-event would be expensive, but silence may look weak.","Parti pembangkang memenuhi sebuah stadium dengan penyokong yang marah tentang kos sara hidup. Ucapan dikongsi meluas dalam talian dan sebahagian ahli anda berkata kerajaan patut bertindak balas secara langsung. Program tandingan mahal, tetapi berdiam diri mungkin nampak lemah."],
[[["Hold a counter-rally","Adakan ceramah tandingan"],["Your supporters turn up in numbers and the mood lifts. The event costs money and the rhetoric heats up the street.","Penyokong anda hadir ramai dan semangat meningkat. Program itu menelan belanja dan retorik memanaskan suasana."],{mo:-10,a:2,u:2,w:1}],
 [["Ignore it","Buat tidak endah"],["The story fades in a few days, but opponents claim you are afraid to face them.","Cerita itu pudar dalam beberapa hari, tetapi lawan mendakwa anda takut berdepan mereka."],{a:-2,w:-1,u:-1}],
 [["Open a public dialogue on living costs","Buka dialog awam tentang kos sara hidup"],["The sessions are tense but productive. People appreciate being heard and tensions drop.","Sesi itu tegang tetapi membuahkan hasil. Rakyat menghargai didengari dan ketegangan menurun."],{u:-3,a:1,l:1}]]),
E("scandal","pol",["Scandal in a ministry","Skandal di sebuah kementerian"],
["A report alleges that a ministry awarded contracts without a proper tender. The press is asking for answers and an opposition member has called for resignations. Some in your party say the matter should be handled quietly to avoid damage.","Satu laporan mendakwa sebuah kementerian menganugerahkan kontrak tanpa tender yang betul. Media meminta jawapan dan seorang ahli pembangkang menggesa peletakan jawatan. Sebahagian dalam parti anda berkata perkara ini patut ditangani secara senyap bagi mengelakkan kerosakan."],
[[["Sack the minister immediately","Pecat menteri serta-merta"],["The decisive move earns respect, though the minister's allies in the party are furious.","Langkah tegas ini meraih penghormatan, walaupun sekutu menteri itu dalam parti berang."],{a:3,l:-3,u:-1}],
 [["Keep it quiet","Senyapkan perkara ini"],["The story dies down for now, but a journalist keeps digging. This may not be over.","Cerita reda buat masa ini, tetapi seorang wartawan terus menyiasat. Ini mungkin belum berakhir."],{a:-3,l:2,nx:["leak",25]}],
 [["Order an independent probe","Arahkan siasatan bebas"],["The probe buys time and credibility, and a transparency reform is announced. It costs money and nobody can predict the findings.","Siasatan memberi masa dan kredibiliti, dan pembaharuan ketelusan diumumkan. Ia mahal dan tiada siapa dapat meramal hasilnya."],{a:1,u:-1,mo:-10,w:1,pol:"Transparency reform|Governance"}]]),
E("cross","pol",["Opposition figure wants to cross over","Tokoh pembangkang mahu menyertai kerajaan"],
["An opposition assemblyman has signalled that he is ready to join the government, citing frustration with his own party. Some of your members welcome the extra seat; others warn that opportunists rarely stay loyal and that voters dislike party-hopping.","Seorang wakil rakyat pembangkang memberi isyarat bersedia menyertai kerajaan kerana kecewa dengan partinya sendiri. Sebahagian ahli anda mengalu-alukan kerusi tambahan; yang lain memberi amaran oportunis jarang setia dan pengundi tidak suka lompat parti."],
[[["Welcome him with a post","Sambut beliau dengan satu jawatan"],["The bloc gains a seat and a headline. Some supporters grumble about rewarding opportunism.","Blok mendapat satu kerusi dan satu tajuk berita. Sebahagian penyokong merungut tentang ganjaran kepada oportunisme."],{f:"o",l:-3,a:-1,mo:-10}],
 [["Decline and stay principled","Menolak dan kekal berprinsip"],["You earn respect for consistency, though the seat count stays the same.","Anda meraih penghormatan kerana konsisten, walaupun bilangan kerusi kekal."],{a:2,l:2}],
 [["Keep him waiting","Biarkan beliau menunggu"],["He stays in limbo, which keeps the opposition nervous and the story alive.","Beliau tergantung, menjadikan pembangkang resah dan cerita ini hidup."],{u:1,w:1}]]),
E("budget","eco",["Revenue falls short","Hasil kurang daripada sasaran"],
["Revenue is below target and the cash balance is running low. Suppliers are asking when they will be paid, and the finance team warns that salaries could be delayed within weeks if nothing is done. Every option has a political price.","Hasil kurang daripada sasaran dan baki tunai semakin rendah. Pembekal bertanya bila mereka akan dibayar, dan pasukan kewangan memberi amaran gaji boleh lewat dalam beberapa minggu jika tiada tindakan. Setiap pilihan ada harga politik."],
[[["Borrow to cover the gap","Berhutang untuk menampung"],["Cash arrives quickly and the crisis passes. The debt grows and so does the interest bill.","Wang tiba cepat dan krisis berlalu. Hutang membesar dan bil faedah juga."],{db:150,mo:150}],
 [["Cut public spending","Potong perbelanjaan awam"],["Accounts stabilise, but cancelled projects and slower services upset residents.","Akaun stabil, tetapi projek dibatalkan dan perkhidmatan lebih perlahan menjengkelkan penduduk."],{mo:60,a:-4,u:4,e:-2}],
 [["Raise fees and levies","Naikkan fi dan levi"],["Revenue improves, but small businesses complain loudly and some call it a hidden tax.","Hasil bertambah baik, tetapi perniagaan kecil mengadu kuat dan ada yang menyebutnya cukai tersembunyi."],{mo:80,a:-6,u:3}]],{when:s=>s.lv.money<200,adv:"fin",rec:1}),
E("youth","soc",["Youth protest over jobs","Protes belia mengenai pekerjaan"],
["Hundreds of graduates have gathered downtown demanding jobs and lower living costs. The mood is tense but peaceful so far. Police ask for instructions, and organisers say they will return every weekend until someone listens.","Ratusan graduan berhimpun di tengah bandar menuntut pekerjaan dan kos sara hidup lebih rendah. Suasana tegang tetapi aman setakat ini. Polis meminta arahan, dan penganjur berkata mereka akan kembali setiap hujung minggu sehingga ada yang mendengar."],
[[["Launch a youth jobs scheme","Lancarkan skim pekerjaan belia"],["Applications flood in within days and the protests thin out. The scheme will cost money every month.","Permohonan membanjir dalam beberapa hari dan protes beransur kurang. Skim ini akan memakan belanja setiap bulan."],{mo:-45,u:-5,a:3,pol:"Youth jobs scheme|Social"}],
 [["Disperse the crowd","Bubarkan orang ramai"],["The street clears quickly, but photos of the dispersal spread online and anger deepens.","Jalan lengang dengan cepat, tetapi gambar pembubaran tersebar dalam talian dan kemarahan bertambah."],{u:-3,a:-6,w:-1,nx:["backlash",20]}],
 [["Hold a dialogue with the organisers","Adakan dialog dengan penganjur"],["Both sides talk for hours. Nothing is solved overnight, but the next march is cancelled.","Kedua-dua pihak berbincang berjam-jam. Tiada apa selesai semalaman, tetapi perarakan seterusnya dibatalkan."],{u:-2,a:1,mo:-5}]],{when:s=>s.lv.unrest>40,adv:"sec",rec:2}),
E("royalty","fed",["Resource revenue dispute","Pertikaian hasil sumber"],
["Talks on the state's share of resource revenue have reopened. The federal side offers an increase, but smaller than your negotiators hoped. Some legal advisers say the claim is strong enough for court; others say a court case would take years and sour relations.","Rundingan tentang bahagian negeri daripada hasil sumber dibuka semula. Pihak Persekutuan menawarkan kenaikan, tetapi lebih kecil daripada yang diharapkan perunding anda. Sebahagian penasihat undang-undang berkata tuntutan cukup kuat untuk ke mahkamah; yang lain berkata kes mahkamah akan mengambil bertahun-tahun dan merosakkan hubungan."],
[[["Demand a bigger share","Tuntut bahagian lebih besar"],["The tough line plays well at home. The federal side digs in and talks drag on.","Pendirian keras mendapat sambutan di dalam negeri. Pihak Persekutuan bertahan dan rundingan berlarutan."],{m:5,u:2,l:1}],
 [["Accept the offer","Terima tawaran"],["Money flows in soon after. Commentators say the state could have pushed harder.","Wang masuk tidak lama kemudian. Pengulas berkata negeri sepatutnya mendesak lebih keras."],{mo:80,m:-3}],
 [["Take the case to court","Bawa kes ke mahkamah"],["The filing makes headlines and shows resolve, though legal fees begin to pile up.","Pemfailan menjadi berita utama dan menunjukkan azam, walaupun yuran guaman mula bertimbun."],{m:3,mo:-20,a:1}]]),
E("invest","eco",["Investor wants land","Pelabur mahu tanah"],
["A large investor proposes a plantation and processing hub that would create jobs and tax revenue. Part of the land is claimed under native customary rights. The investor wants a fast decision and hints that it will look at other states otherwise.","Seorang pelabur besar mencadangkan pusat ladang dan pemprosesan yang akan mewujudkan pekerjaan dan hasil cukai. Sebahagian tanah dituntut di bawah hak adat bumiputera. Pelabur mahukan keputusan cepat dan mengisyaratkan akan melihat negeri lain jika tidak."],
[[["Approve quickly","Luluskan segera"],["Construction begins within months and the economy gets a boost. Community leaders say they were not properly consulted.","Pembinaan bermula dalam beberapa bulan dan ekonomi mendapat dorongan. Pemimpin komuniti berkata mereka tidak dirunding dengan sempurna."],{e:6,mo:40,a:-1,nx:["landprot",30]}],
 [["Decline the project","Tolak projek"],["Native rights groups applaud, but business groups say the state is turning away investment.","Kumpulan hak adat memuji, tetapi kumpulan perniagaan berkata negeri menolak pelaburan."],{e:-1,a:2}],
 [["Negotiate with the community first","Berunding dengan komuniti dahulu"],["Talks take longer and the investor reduces the scale, but both sides accept the compromise.","Rundingan mengambil masa lebih lama dan pelabur mengecilkan skala, tetapi kedua-dua pihak menerima kompromi."],{e:3,mo:10}]],{adv:"land",rec:2}),
E("health","soc",["Dengue outbreak","Wabak denggi"],
["Dengue cases have jumped in several towns and clinics are running short of staff and supplies. Parents are worried about schools. Health officers say a quick campaign of fogging, clean-ups and public notices could slow the spread, but it costs money.","Kes denggi melonjak di beberapa pekan dan klinik kekurangan kakitangan dan bekalan. Ibu bapa risau tentang sekolah. Pegawai kesihatan berkata kempen pantas pengasapan, gotong-royong dan notis awam boleh melambatkan penularan, tetapi ia memerlukan belanja."],
[[["Launch an emergency clean-up campaign","Lancarkan kempen pembersihan kecemasan"],["Cases peak within two weeks and then fall. Volunteers join in and people feel looked after.","Kes memuncak dalam dua minggu dan kemudian menurun. Sukarelawan menyertai dan rakyat rasa dijaga."],{a:4,mo:-30,u:-1}],
 [["Issue a public advisory only","Keluarkan nasihat awam sahaja"],["A few cases fall, but many do not, and some clinics are overwhelmed.","Beberapa kes berkurang, tetapi ramai tidak, dan sebahagian klinik terbeban."],{a:-1,mo:-5,nx:["dengue2",20]}],
 [["Blame residents for poor hygiene","Salahkan penduduk kerana kebersihan lemah"],["The comment goes viral for the wrong reasons, and health workers privately say it made their job harder.","Komen itu tular atas sebab yang salah dan pekerja kesihatan secara peribadi berkata ia menyukarkan kerja mereka."],{a:-6,u:3}]],{adv:"hlt",rec:0}),
E("tourism","eco",["Rainforest festival proposal","Cadangan festival hutan hujan"],
["A proposal has landed for a large rainforest music and culture festival that could attract international visitors and sponsors. Hotels and craft sellers are enthusiastic. Critics worry about costs, crowds and the pressure on the local communities who would host it.","Satu cadangan tiba untuk festival muzik dan budaya hutan hujan berskala besar yang boleh menarik pelawat antarabangsa dan penaja. Hotel dan penjual kraf bersemangat. Pengkritik risau tentang kos, kesesakan dan tekanan ke atas komuniti tempatan yang menjadi tuan rumah."],
[[["Go big with international promotion","Teruskan secara besar dengan promosi antarabangsa"],["Tickets sell well and hotels fill up. The cost is high and the crowds strain local services.","Tiket laris dan hotel penuh. Kosnya tinggi dan kesesakan menekan perkhidmatan tempatan."],{e:5,mo:-25,a:3,u:1}],
 [["Keep it community-run and modest","Kekalkan secara kecil dan dikendalikan komuniti"],["Villagers take pride in hosting and craft sales rise. The event stays small and less profitable.","Penduduk kampung berbangga menjadi tuan rumah dan jualan kraf meningkat. Acara kekal kecil dan kurang menguntungkan."],{e:2,mo:10,a:2}],
 [["Cancel to save money","Batalkan untuk jimat"],["The budget is saved, but sellers and hotels feel let down.","Bajet dijimatkan, tetapi penjual dan hotel rasa dikecewakan."],{mo:15,a:-3,e:-2}]],{adv:"dig",rec:1}),
E("timber","env",["Timber licence controversy","Kontroversi lesen balak"],
["Environmental groups say timber licences have been granted near native villages and a watershed. A leaked map seems to support their claim. The industry says the licences are legal and thousands of jobs depend on them.","Kumpulan alam sekitar berkata lesen balak diberikan berhampiran kampung bumiputera dan kawasan tadahan air. Satu peta bocor seolah-olah menyokong dakwaan mereka. Industri berkata lesen itu sah dan beribu pekerjaan bergantung kepadanya."],
[[["Review the licences openly","Semak semula lesen secara terbuka"],["The review pauses some operations and annoys companies, but villagers and conservation groups praise the openness.","Semakan menghentikan sebahagian operasi dan menjengkelkan syarikat, tetapi penduduk kampung dan kumpulan pemuliharaan memuji keterbukaan."],{a:3,e:-3,u:-2,mo:-5}],
 [["Defend the licences","Pertahankan lesen"],["Industry is pleased, but protests start in the affected area and the issue sticks to your name.","Industri gembira, tetapi protes bermula di kawasan terjejas dan isu ini melekat pada nama anda."],{e:2,a:-4,u:4}],
 [["Freeze new licences quietly","Bekukan lesen baharu secara senyap"],["The freeze reduces tension without a public fight. Nobody feels fully satisfied.","Pembekuan mengurangkan ketegangan tanpa pertengkaran awam. Tiada siapa rasa sepenuhnya puas."],{u:-1,e:-1,a:1}]],{adv:"land",rec:0}),
E("civil","eco",["Civil servants ask for a bonus","Penjawat awam minta bonus"],
["The civil servants' union asks for a one-off bonus and better allowances, noting that prices have gone up. Government workers are an important base of support. Finance officers warn that a generous package would strain the budget.","Kesatuan penjawat awam meminta bonus sekali bayar dan elaun lebih baik kerana harga barang naik. Pekerja kerajaan ialah asas sokongan penting. Pegawai kewangan memberi amaran pakej murah hati akan membebankan bajet."],
[[["Grant the full request","Luluskan permintaan penuh"],["Morale jumps and the union praises you. The accounts feel the weight a few weeks later.","Moral melonjak dan kesatuan memuji anda. Akaun terasa bebannya beberapa minggu kemudian."],{mo:-60,a:4,l:2,u:-2}],
 [["Offer a smaller package","Tawarkan pakej lebih kecil"],["A compromise is reached after tense talks. Few are fully happy, but the budget survives.","Kompromi dicapai selepas rundingan tegang. Sedikit yang sepenuhnya gembira, tetapi bajet bertahan."],{mo:-25,a:1}],
 [["Refuse","Tolak"],["The refusal saves money, but union leaders warn of slow work and protest at the next meeting.","Penolakan menjimatkan wang, tetapi pemimpin kesatuan memberi amaran kerja perlahan dan protes pada mesyuarat seterusnya."],{a:-5,u:3,l:-2}]],{adv:"fin",rec:1}),
E("haze","env",["Haze over the state","Jerebu menyelubungi negeri"],
["Smoke from open burning across the region has pushed the air quality index into unhealthy levels. Schools are asking whether to close and hospitals report more breathing complaints. Enforcement against open burning would upset farmers who say it is their cheapest way to clear land.","Asap pembakaran terbuka di seluruh rantau telah menolak indeks kualiti udara ke tahap tidak sihat. Sekolah bertanya sama ada perlu ditutup dan hospital melaporkan lebih banyak aduan pernafasan. Penguatkuasaan terhadap pembakaran terbuka akan menyakitkan hati petani yang berkata ia kaedah paling murah membersihkan tanah."],
[[["Enforce a ban on open burning","Kuatkuasakan larangan pembakaran terbuka"],["Air quality improves within days. Some farmers are fined and complain they were singled out.","Kualiti udara bertambah baik dalam beberapa hari. Sebahagian petani didenda dan mengadu mereka disasarkan."],{a:3,u:1,e:-1}],
 [["Hand out masks and advisories only","Edar pelitup muka dan nasihat sahaja"],["It costs little and looks caring, but the smoke stays and so do the complaints.","Kosnya kecil dan nampak prihatin, tetapi asap kekal dan begitu juga aduan."],{a:-1,mo:-10}],
 [["Wait for the weather to change","Tunggu cuaca berubah"],["Rain eventually helps, but not before parents and doctors lose patience.","Hujan akhirnya membantu, tetapi bukan sebelum ibu bapa dan doktor kehilangan kesabaran."],{a:-5,u:2}]],{adv:"hlt",rec:0}),
/* ----- chain events (only appear as a result of earlier choices) ----- */
E("leak","pol",["The cover-up leaks","Pembohongan terbongkar"],
["The press has obtained documents showing that the earlier ministry matter was buried on purpose. Photos of the paperwork are spreading and the opposition is demanding a debate. Your own members want to know whether they were misled.","Media memperoleh dokumen yang menunjukkan perkara kementerian tadi sengaja disembunyikan. Gambar dokumen tersebar dan pembangkang menuntut perbahasan. Ahli anda sendiri mahu tahu sama ada mereka diperdaya."],
[[["Apologise publicly","Memohon maaf secara terbuka"],["The apology is accepted by some and mocked by others. Anger cools down slowly.","Permohonan maaf diterima sebahagian dan dicemuh yang lain. Kemarahan reda perlahan-lahan."],{a:-6,u:2,l:-1}],
 [["Deny everything","Nafikan semuanya"],["The denial collapses when more documents appear. Credibility takes a serious hit.","Penafian runtuh apabila lebih banyak dokumen muncul. Kredibiliti terjejas teruk."],{a:-10,u:3,l:2}],
 [["Accept resignations","Terima peletakan jawatan"],["Two officials step down and the matter finally calms. Some in the party say you waited too long.","Dua pegawai meletak jawatan dan perkara akhirnya reda. Sebahagian dalam parti berkata anda menunggu terlalu lama."],{a:-3,l:-4,w:-1}]],{ch:1}),
E("backlash","soc",["Backlash after the crackdown","Tindak balas selepas tindakan keras"],
["Images of the earlier crackdown are circulating online, and civil society groups, lawyers and some of your own supporters are calling it excessive. A larger march is being planned and foreign media have started to ask questions.","Gambar tindakan keras tadi beredar dalam talian dan kumpulan masyarakat sivil, peguam dan sebahagian penyokong anda sendiri menyebutnya keterlaluan. Perarakan lebih besar sedang dirancang dan media asing mula bertanya soalan."],
[[["Release those detained and review the case","Bebaskan yang ditahan dan semak kes"],["Releasing them cools the mood. Some of your hardliners think you showed weakness.","Pembebasan mereka menyejukkan suasana. Sebahagian garis keras menganggap anda menunjukkan kelemahan."],{a:2,u:-3,mo:-10}],
 [["Stand firm","Berpegang pada pendirian"],["The march goes ahead and is much larger than expected. Tension in the capital rises.","Perarakan diteruskan dan jauh lebih besar daripada dijangka. Ketegangan di ibu negeri meningkat."],{u:5,a:-4}],

 const ln=`<line x1="${(300+105*cx).toFixed(1)}" y1="${(300-105*sy).toFixed(1)}" x2="${(300+298*cx).toFixed(1)}" y2="${(300-298*sy).toFixed(1)}" stroke="#111" stroke-width="2" stroke-dasharray="6 4" opacity=".75" pointer-events="none"/><text x="${(300+298*cx).toFixed(1)}" y="${(300-298*sy-8).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#111">${t("majLine")}: ${m}</text>`;

document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest(".seat"))hl(null)});
const loaded=load();render();
if(loaded&&S.game.pend!==null&&!S.game.over)showEvent();else if(!loaded)showHow();
</script></body></html>
