<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarawak Political Simulator</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1b2433;--mu:#667085;--bd:#e0e5ee;--ac:#1f4fb2;--rd:12px}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:flex;min-height:100vh}nav{width:210px;background:#13203b;color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:15px;margin:4px 8px 14px;line-height:1.25}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cdd6ea;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}
nav button.on,nav button:hover{background:#24396b;color:#fff}nav .lang{margin-top:14px;border:1px solid #3b5086;text-align:center}
main{flex:1;padding:20px;min-width:0;max-width:1100px}h2{margin:0 0 14px}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.stat b{display:block;font-size:26px}.stat span,.mu{color:var(--mu);font-size:13px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}.btn:hover{background:#eef2fa}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.d{color:#b42318;border-color:#f0b9b3}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.sp{margin-bottom:12px}
.bar{height:10px;background:#e8ecf4;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;transition:width .25s}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.lg{display:flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:20px;padding:3px 10px;background:#fff;cursor:pointer;font-size:13px}.lg.on{outline:2px solid var(--ac)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
svg.ch{width:100%;max-width:760px;display:block;margin:auto}.seat{cursor:pointer;transition:opacity .15s}.seat:hover,.seat:focus{stroke:#000;stroke-width:2;outline:none}
.badge{font-size:12px;border-radius:10px;padding:2px 8px;background:#e8eefc;color:var(--ac)}.badge.opp{background:#fdeceb;color:#b42318}
.banner{padding:10px 14px;border-radius:10px;margin:10px 0;background:#eef6ee;border:1px solid #bfdcbf}.banner.warn{background:#fff6e0;border-color:#ecd08a}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.ov[hidden]{display:none}
.dlg{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin-top:3px}input[type=color]{height:38px;padding:2px}input[type=range]{padding:0}
.err{color:#b42318;font-size:13px;min-height:16px;margin:8px 0 0}#toast{position:fixed;bottom:16px;right:16px;z-index:30}#toast div{background:#13203b;color:#fff;padding:9px 14px;border-radius:8px;margin-top:6px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}.cols .card{background:#f8f9fc}.item{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:8px}nav h1{width:100%;margin:2px 6px}nav button{width:auto;padding:7px 10px}nav .lang{margin:0}.cols{grid-template-columns:1fr}main{padding:12px}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<div class="ov" id="modal" hidden></div><div id="toast" aria-live="polite"></div>
<script>
"use strict";
const TOTAL=82;
/* ---------- i18n ---------- */
const D={en:{title:"Sarawak Political Simulator",dash:"Dashboard",dun:"DUN",parties:"Parties",election:"Election",cabinet:"Cabinet",policies:"Policies",total:"Total DUN seats",maj:"Seats for majority",govS:"Government seats",act:"Active parties",dist:"Party seat distribution",chart:"DUN seating chart",all:"Show all",save:"Save",cancel:"Cancel",del:"Delete",edit:"Edit",add:"Add",close:"Close",yes:"Yes, delete",name:"Name",abbr:"Abbreviation",leader:"Leader",color:"Colour",coal:"Coalition",ideo:"Ideology / platform",gov:"Government",opp:"Opposition",rep:"Representative",cons:"Constituency",party:"Party",minister:"Minister",port:"Portfolio",ptitle:"Title",cat:"Category",desc:"Description",status:"Status",st0:"Proposed",st1:"In Progress",st2:"Completed",req:"Required field missing",saved:"Saved",deleted:"Deleted",confirm:"Delete this item? This cannot be undone.",base:"Baseline data: 82 DUN seats as at the Oct 2026 dissolution (GPS-aligned 80, DAP 2). Representative names are left blank/unverified. Edit anything freely.",sim:"Simulated / edited data differs from baseline (dashed outline = changed seat).",swing:"Swing (%)",simBtn:"Run election",reset:"Restore baseline",restored:"Baseline restored",hung:"Hung DUN: no side has a majority",govMaj:"Government majority",oppMaj:"Opposition majority",seats:"Seats",chg:"Change",addParty:"Add party",addMin:"Add minister",addPol:"Add policy",toGov:"Move to government",toOpp:"Move to opposition",ph:"No items yet.",inuse:"Seats of this party move to Independent.",quick:"Quick navigation",lang:"Bahasa Melayu",unv:"(unverified)",simDone:"Election simulated",noP:"No party selected",ptl:"registered",edSeat:"Edit seat",levels:"Government standing",approval:"Public Approval",loyalty:"Party Loyalty",economy:"Economy",stability:"Stability",autonomy:"Sarawak Autonomy",gameNote:"Game values (fictional), not real-world data.",loyNote:"Auto: seat-weighted average of government parties.",ploy:"Loyalty (0-100)",loyL:"Loyalty"},
ms:{title:"Simulator Politik Sarawak",dash:"Papan Pemuka",dun:"DUN",parties:"Parti",election:"Pilihan Raya",cabinet:"Kabinet",policies:"Dasar",total:"Jumlah kerusi DUN",maj:"Kerusi majoriti",govS:"Kerusi kerajaan",act:"Parti aktif",dist:"Agihan kerusi parti",chart:"Carta tempat duduk DUN",all:"Papar semua",save:"Simpan",cancel:"Batal",del:"Padam",edit:"Sunting",add:"Tambah",close:"Tutup",yes:"Ya, padam",name:"Nama",abbr:"Singkatan",leader:"Pemimpin",color:"Warna",coal:"Gabungan",ideo:"Ideologi / platform",gov:"Kerajaan",opp:"Pembangkang",rep:"Wakil rakyat",cons:"Kawasan",party:"Parti",minister:"Menteri",port:"Portfolio",ptitle:"Tajuk",cat:"Kategori",desc:"Penerangan",status:"Status",st0:"Dicadangkan",st1:"Sedang Dilaksana",st2:"Selesai",req:"Ruangan wajib belum diisi",saved:"Disimpan",deleted:"Dipadam",confirm:"Padam item ini? Tindakan ini tidak boleh dibatalkan.",base:"Data asas: 82 kerusi DUN ketika pembubaran Okt 2026 (GPS dan sekutu 80, DAP 2). Nama wakil rakyat dikosongkan/belum disahkan. Sunting bebas.",sim:"Data simulasi / suntingan berbeza daripada data asas (garis putus-putus = kerusi berubah).",swing:"Ayunan (%)",simBtn:"Jalankan pilihan raya",reset:"Pulihkan data asas",restored:"Data asas dipulihkan",hung:"DUN tergantung: tiada majoriti",govMaj:"Majoriti kerajaan",oppMaj:"Majoriti pembangkang",seats:"Kerusi",chg:"Perubahan",addParty:"Tambah parti",addMin:"Tambah menteri",addPol:"Tambah dasar",toGov:"Pindah ke kerajaan",toOpp:"Pindah ke pembangkang",ph:"Tiada item lagi.",inuse:"Kerusi parti ini dipindahkan kepada Bebas.",quick:"Pautan pantas",lang:"English",unv:"(belum disahkan)",simDone:"Pilihan raya disimulasi",noP:"Tiada parti dipilih",ptl:"berdaftar",edSeat:"Sunting kerusi",levels:"Kedudukan kerajaan",approval:"Sokongan Rakyat",loyalty:"Kesetiaan Parti",economy:"Ekonomi",stability:"Kestabilan",autonomy:"Autonomi Sarawak",gameNote:"Nilai permainan (fiksyen), bukan data sebenar.",loyNote:"Auto: purata berwajaran kerusi parti kerajaan.",ploy:"Kesetiaan (0-100)",loyL:"Kesetiaan"}};
let lang="en",cur="dash",flt=null;
const t=k=>(D[lang][k]||D.en[k]||k);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);const uid=()=>Math.random().toString(36).slice(2,8);
const clamp=x=>Math.max(0,Math.min(100,Math.round(x)));
/* ---------- data (editable) ---------- */
const NAMES="Opar,Tasik Biru,Tanjong Datu,Pantai Damai,Demak Laut,Tupong,Samariang,Satok,Padungan,Pending,Batu Lintang,Kota Sentosa,Batu Kitang,Batu Kawah,Asajaya,Muara Tuang,Stakan,Serembu,Mambong,Tarat,Tebedu,Kedup,Bukit Semuja,Sadong Jaya,Simunjan,Gedong,Sebuyau,Lingga,Beting Maro,Balai Ringin,Bukit Begunan,Simanggang,Engkilili,Batang Ai,Saribas,Layar,Bukit Saban,Kalaka,Krian,Kabong,Kuala Rajang,Semop,Daro,Jemoreng,Repok,Meradong,Pakan,Meluan,Ngemah,Machan,Bukit Assek,Dudong,Bawang Assan,Pelawan,Nangka,Dalat,Tellian,Balingian,Tamin,Kakus,Pelagus,Katibas,Baleh,Belaga,Murum,Jepak,Tanjong Batu,Kemena,Samalaju,Bekenu,Lambir,Piasau,Pujut,Senadin,Marudi,Telang Usan,Mulu,Bukit Kota,Batu Danau,Ba'kelalan,Bukit Sari,Kidurong".split(",");
while(NAMES.length<TOTAL)NAMES.push("N."+(NAMES.length+1));NAMES.length=TOTAL;
function mk(){
 const parties=[
  {id:"gps",name:"Gabungan Parti Sarawak",abbr:"GPS",leader:"Abang Johari Openg",color:"#1f4fb2",coal:"gov",ideo:"Sarawak regionalism, state autonomy, development",loy:85},
  {id:"dap",name:"Democratic Action Party (Sarawak)",abbr:"DAP",leader:"",color:"#d62839",coal:"opp",ideo:"Social democracy, multiracial politics",loy:60},
  {id:"ind",name:"Independent (govt-aligned)",abbr:"IND",leader:"",color:"#8a8f98",coal:"gov",ideo:"Independent",loy:60},
  {id:"psb",name:"Parti Sarawak Bersatu",abbr:"PSB",leader:"",color:"#e8a317",coal:"opp",ideo:"Sarawak-based opposition",loy:55},
  {id:"pkr",name:"Parti Keadilan Rakyat (Sarawak)",abbr:"PKR",leader:"",color:"#2aa7c9",coal:"opp",ideo:"Reformasi, social justice",loy:55}];
 const seats=NAMES.map((n,i)=>({id:i+1,name:n,rep:"",party:i==8||i==9?"dap":i==10?"ind":"gps"}));
 return {parties,seats,cabinet:[],policies:[],lv:{approval:70,economy:65,stability:75,autonomy:60}};
}
let BASE=mk(),S=mk();
const P=id=>S.parties.find(p=>p.id===id);
const cnt=()=>{const c={};S.parties.forEach(p=>c[p.id]=0);S.seats.forEach(s=>{if(c[s.party]!=null)c[s.party]++});return c};
const maj=()=>Math.floor(S.seats.length/2)+1;
const side=k=>S.seats.filter(s=>P(s.party)&&P(s.party).coal===k).length;
const dirty=()=>S.seats.some((s,i)=>s.party!==BASE.seats[i].party||s.name!==BASE.seats[i].name||s.rep!==BASE.seats[i].rep);
function loyalty(){const c=cnt();let w=0,n=0;S.parties.forEach(p=>{if(p.coal==="gov"){w+=(p.loy||0)*c[p.id];n+=c[p.id]}});return n?clamp(w/n):0}
/* ---------- UI helpers ---------- */
function toast(m){const d=document.createElement("div");d.textContent=m;$("#toast").appendChild(d);setTimeout(()=>d.remove(),2200)}
function closeM(){$("#modal").hidden=true;$("#modal").innerHTML=""}
function modal(title,fields,save){
 const o=$("#modal");o.hidden=false;
 const fh=f=>{const v=esc(f.v==null?"":f.v),id="f_"+f.k,l=`<label for="${id}">${esc(t(f.l))}${f.r?" *":""}</label>`;
  if(f.o)return l+`<select id="${id}">${f.o.map(x=>`<option value="${esc(x[0])}"${x[0]===f.v?" selected":""}>${esc(x[1])}</option>`).join("")}</select>`;
  if(f.ta)return l+`<textarea id="${id}" rows="3">${v}</textarea>`;
  return l+`<input id="${id}" type="${f.c?"color":f.n?"number":"text"}" ${f.n?'min="0" max="100"':""} value="${v}">`};
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><form id="mf" novalidate>${fields.map(fh).join("")}<p class="err" id="me" role="alert"></p><div class="row"><button class="btn p" type="submit">${t("save")}</button><button class="btn" type="button" id="mc">${t("cancel")}</button></div></form></div>`;
 $("#mc").onclick=closeM;
 $("#mf").onsubmit=e=>{e.preventDefault();const v={};
  for(const f of fields){v[f.k]=$("#f_"+f.k).value.trim();if(f.r&&!v[f.k]){$("#me").textContent=t("req")+": "+t(f.l);$("#f_"+f.k).focus();return}}
  save(v);closeM();toast(t("saved"));render()};
 const i=o.querySelector("input,select,textarea");if(i)i.focus();
}
function ask(msg,fn){const o=$("#modal");o.hidden=false;
 o.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn d" id="cy">${t("yes")}</button><button class="btn" id="cn">${t("cancel")}</button></div></div>`;
 $("#cn").onclick=closeM;$("#cy").onclick=()=>{closeM();fn();toast(t("deleted"));render()};$("#cn").focus()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
$("#modal").addEventListener("mousedown",e=>{if(e.target.id==="modal")closeM()});
const popts=()=>S.parties.map(p=>[p.id,p.abbr+" – "+p.name]);
/* ---------- chart ---------- */
function chart(){
 const radii=[130,166,202,238,274],sum=radii.reduce((a,b)=>a+b,0),n=S.seats.length;
 const c=radii.map(r=>Math.round(n*r/sum));c[4]+=n-c.reduce((a,b)=>a+b,0);
 const pos=[];radii.forEach((r,i)=>{for(let j=0;j<c[i];j++){const a=Math.PI-Math.PI*j/(c[i]-1);pos.push({a,x:300+r*Math.cos(a),y:300-r*Math.sin(a)})}});
 pos.sort((p,q)=>q.a-p.a);
 const pi={};S.parties.forEach((p,i)=>pi[p.id]=i);
 const ord=S.seats.map((s,i)=>({s,i})).sort((a,b)=>(pi[a.s.party]??99)-(pi[b.s.party]??99)||a.i-b.i);
 const cs=ord.map((o,k)=>{const s=o.s,p=P(s.party),ch=s.party!==BASE.seats[o.i].party;
  return `<circle class="seat" data-i="${o.i}" cx="${pos[k].x.toFixed(1)}" cy="${pos[k].y.toFixed(1)}" r="13" fill="${p?p.color:"#ccc"}" opacity="${flt&&s.party!==flt?.15:1}" ${ch?'stroke="#000" stroke-dasharray="3 2" stroke-width="2"':""} tabindex="0" role="button" aria-label="${esc(s.name)} ${p?esc(p.abbr):""}"><title>${esc(s.name)} – ${p?esc(p.abbr):""}</title></circle>`}).join("");
 return `<svg class="ch" viewBox="0 0 600 320" role="group" aria-label="${t("chart")}">${cs}<text x="300" y="285" text-anchor="middle" font-size="40" font-weight="700" fill="#1b2433">${n}</text><text x="300" y="305" text-anchor="middle" font-size="13" fill="#667085">${t("seats")}</text></svg>`;
}
function legend(){const c=cnt();return `<div class="legend">${S.parties.map(p=>`<span class="lg${flt===p.id?" on":""}" data-f="${p.id}" tabindex="0" role="button"><i class="dot" style="background:${esc(p.color)}"></i>${esc(p.abbr)} <b>${c[p.id]}</b></span>`).join("")}<span class="lg" data-f="">${t("all")}</span></div>`}
function meters(){const L=S.lv,m=[["approval",L.approval,1],["loyalty",loyalty(),0],["economy",L.economy,1],["stability",L.stability,1],["autonomy",L.autonomy,1]];
 return `<div class="card sp"><h3>${t("levels")}</h3><div class="grid">${m.map(([k,v,e])=>`<div><div class="row" style="margin:0;justify-content:space-between"><b>${t(k)}</b><span>${v}/100</span></div><div class="bar" role="progressbar" aria-label="${t(k)}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v}%;background:${v>=66?"#1a9d57":v>=40?"#e8a317":"#d62839"}"></i></div>${e?`<div class="row" style="margin-top:6px"><button class="btn" data-lv="${k}" data-d="-5">−5</button><button class="btn" data-lv="${k}" data-d="5">+5</button></div>`:`<span class="mu">${t("loyNote")}</span>`}</div>`).join("")}</div><p class="mu" style="margin-bottom:0">${t("gameNote")}</p></div>`}
function seatModal(i){const s=S.seats[i];
 modal(t("edSeat")+" #"+s.id,[{k:"name",l:"cons",v:s.name,r:1},{k:"rep",l:"rep",v:s.rep},{k:"party",l:"party",v:s.party,o:popts()}],v=>{s.name=v.name;s.rep=v.rep;s.party=v.party});
 if(!s.rep){const m=document.createElement("p");m.className="mu";m.textContent=t("rep")+": "+t("unv");$("#mf").prepend(m)}}
/* ---------- views ---------- */
function banner(){return `<div class="banner${dirty()?" warn":""}">${dirty()?t("sim"):t("base")}</div>`}
const V={
 dash(){const c=cnt(),act=S.parties.filter(p=>c[p.id]>0).length;
  return `<h2>${t("dash")}</h2>${banner()}<div class="grid sp">
  <div class="card stat"><b>${S.seats.length}</b><span>${t("total")}</span></div>
  <div class="card stat"><b>${maj()}</b><span>${t("maj")}</span></div>
  <div class="card stat"><b>${side("gov")}</b><span>${t("govS")}</span></div>
  <div class="card stat"><b>${act}</b><span>${t("act")} (${S.parties.length} ${t("ptl")})</span></div></div>
  ${meters()}
  <div class="card sp"><h3>${t("dist")}</h3>${legend()}${chart()}</div>
  <div class="card"><h3>${t("quick")}</h3><div class="row">${["dun","parties","election","cabinet","policies"].map(k=>`<button class="btn" data-go="${k}">${t(k)}</button>`).join("")}</div></div>`},
 dun(){return `<h2>${t("dun")}</h2>${banner()}<div class="card">${legend()}${chart()}</div>`},
 parties(){const c=cnt();
  return `<h2>${t("parties")}</h2><div class="row sp"><button class="btn p" id="addP">${t("addParty")}</button></div><div class="grid">${S.parties.map(p=>`<div class="card"><div class="row" style="margin:0"><i class="dot" style="background:${esc(p.color)}"></i><b>${esc(p.abbr)}</b><span class="badge ${p.coal==="opp"?"opp":""}">${t(p.coal)}</span></div><p style="margin:6px 0"><b>${esc(p.name)}</b><br><span class="mu">${t("leader")}: ${esc(p.leader)||"—"}</span><br><span class="mu">${esc(p.ideo)}</span></p><b>${c[p.id]}</b> ${t("seats")} · ${t("loyL")}: <b>${p.loy||0}</b><div class="bar"><i style="width:${p.loy||0}%;background:${esc(p.color)}"></i></div><div class="row"><button class="btn" data-pe="${p.id}">${t("edit")}</button><button class="btn" data-pc="${p.id}">${p.coal==="gov"?t("toOpp"):t("toGov")}</button><button class="btn d" data-pd="${p.id}">${t("del")}</button></div></div>`).join("")}</div>`},
 election(){const c=cnt(),b={};BASE.parties.forEach(p=>b[p.id]=0);BASE.seats.forEach(s=>b[s.party]=(b[s.party]||0)+1);
  const g=side("gov"),o=side("opp"),m=maj(),res=g>=m?t("govMaj"):o>=m?t("oppMaj"):t("hung");
  return `<h2>${t("election")}</h2>${banner()}<div class="card sp"><label for="ep">${t("party")}</label><select id="ep">${popts().map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join("")}</select><label for="es">${t("swing")}: <b id="ev">0</b></label><input type="range" id="es" min="-20" max="20" value="0"><div class="row"><button class="btn p" id="sim">${t("simBtn")}</button><button class="btn" id="rst">${t("reset")}</button></div></div>
  <div class="card"><div class="banner ${g>=m||o>=m?"":"warn"}"><b>${res}</b> — ${t("gov")} ${g} / ${t("opp")} ${o} (${t("maj")}: ${m})</div><table><tr><th>${t("party")}</th><th>${t("seats")}</th><th>${t("chg")}</th></tr>${S.parties.map(p=>{const d=c[p.id]-(b[p.id]||0);return `<tr><td><i class="dot" style="background:${esc(p.color)}"></i> ${esc(p.abbr)}</td><td>${c[p.id]}</td><td>${d>0?"+":""}${d}</td></tr>`}).join("")}</table></div>`},
 cabinet(){return `<h2>${t("cabinet")}</h2><div class="row sp"><button class="btn p" id="addM">${t("addMin")}</button></div><div class="grid">${S.cabinet.map(m=>{const p=P(m.party);return `<div class="card"><b>${esc(m.name)}</b><br><span class="mu">${esc(m.port)}</span><br>${p?`<span class="badge"><i class="dot" style="background:${esc(p.color)};width:8px;height:8px"></i> ${esc(p.abbr)}</span>`:""}<div class="row"><button class="btn" data-me="${m.id}">${t("edit")}</button><button class="btn d" data-md="${m.id}">${t("del")}</button></div></div>`}).join("")||`<p class="mu">${t("ph")}</p>`}</div>`},
 policies(){return `<h2>${t("policies")}</h2><div class="row sp"><button class="btn p" id="addL">${t("addPol")}</button></div><div class="cols">${[0,1,2].map(k=>`<div class="card"><h3>${t("st"+k)}</h3>${S.policies.filter(p=>p.status==k).map(p=>`<div class="item"><b>${esc(p.title)}</b><br><span class="badge">${esc(p.cat)}</span><p style="margin:6px 0">${esc(p.desc)}</p><div class="row" style="margin:0"><button class="btn" data-le="${p.id}">${t("edit")}</button><button class="btn d" data-ld="${p.id}">${t("del")}</button></div></div>`).join("")||`<p class="mu">${t("ph")}</p>`}</div>`).join("")}</div>`}
};
function render(){
 document.documentElement.lang=lang==="ms"?"ms":"en";document.title=t("title");
 $("#nav").innerHTML=`<h1>${t("title")}</h1>`+["dash","dun","parties","election","cabinet","policies"].map(k=>`<button data-go="${k}" class="${cur===k?"on":""}" ${cur===k?'aria-current="page"':""}>${t(k)}</button>`).join("")+`<button class="lang" id="lg">🌐 ${t("lang")}</button>`;
 $("#main").innerHTML=V[cur]();
 const s=$("#es");if(s)s.oninput=()=>{$("#ev").textContent=(s.value>0?"+":"")+s.value};
}
/* ---------- actions ---------- */
function partyForm(p){const n=!p;p=p||{name:"",abbr:"",leader:"",color:"#7a4fd1",coal:"opp",ideo:"",loy:50};
 modal(t(n?"addParty":"edit"),[{k:"name",l:"name",v:p.name,r:1},{k:"abbr",l:"abbr",v:p.abbr,r:1},{k:"leader",l:"leader",v:p.leader},{k:"color",l:"color",v:p.color,c:1},{k:"coal",l:"coal",v:p.coal,o:[["gov",t("gov")],["opp",t("opp")]]},{k:"loy",l:"ploy",v:p.loy,n:1},{k:"ideo",l:"ideo",v:p.ideo,ta:1}],v=>{v.loy=clamp(parseInt(v.loy)||0);if(n)S.parties.push({id:uid(),...v});else Object.assign(p,v)})}
function delParty(id){const has=S.seats.some(s=>s.party===id);
 ask(t("confirm")+(has?" "+t("inuse"):""),()=>{
  if(has){let fb=S.parties.find(x=>x.id==="ind"&&x.id!==id);
   if(!fb&&id!=="ind"){fb={id:"ind",name:"Independent",abbr:"IND",leader:"",color:"#8a8f98",coal:"opp",ideo:"Independent",loy:50};S.parties.push(fb)}
   if(!fb)fb=S.parties.find(x=>x.id!==id);
   if(!fb)return;
   S.seats.forEach(s=>{if(s.party===id)s.party=fb.id})}
  S.parties=S.parties.filter(x=>x.id!==id);S.cabinet.forEach(m=>{if(m.party===id)m.party=""});if(flt===id)flt=null})}
function simulate(pid,sw){
 const others=S.parties.filter(p=>p.id!==pid);if(!others.length)return;
 S.seats.forEach(s=>{
  if(sw<0&&s.party===pid&&Math.random()<Math.min(.95,-sw/20*.9)){
   const pool=others.filter(p=>S.seats.some(x=>x.party===p.id));const l=pool.length?pool:others;s.party=l[Math.floor(Math.random()*l.length)].id}
  else if(sw>0&&s.party!==pid&&Math.random()<Math.min(.9,sw/20*.6))s.party=pid});
 const g=P(pid).coal==="gov";
 S.lv.approval=clamp(S.lv.approval+(g?sw*.8:-sw*.4));
 S.lv.stability=clamp(S.lv.stability+(g?sw*.3:-sw*.2))}
function cabForm(m){const n=!m;m=m||{name:"",port:"",party:S.parties[0]?S.parties[0].id:""};
 modal(t(n?"addMin":"edit"),[{k:"name",l:"minister",v:m.name,r:1},{k:"port",l:"port",v:m.port,r:1},{k:"party",l:"party",v:m.party,o:popts()}],v=>{if(n)S.cabinet.push({id:uid(),...v});else Object.assign(m,v)})}
function polForm(p){const n=!p;p=p||{title:"",cat:"",desc:"",status:"0"};const was=String(p.status);
 modal(t(n?"addPol":"edit"),[{k:"title",l:"ptitle",v:p.title,r:1},{k:"cat",l:"cat",v:p.cat,r:1},{k:"desc",l:"desc",v:p.desc,ta:1},{k:"status",l:"status",v:was,o:[["0",t("st0")],["1",t("st1")],["2",t("st2")]]}],v=>{
  if(v.status==="2"&&(n||was!=="2"))S.lv.approval=clamp(S.lv.approval+3);
  if(n)S.policies.push({id:uid(),...v});else Object.assign(p,v)})}
const byId=(a,id)=>a.find(x=>x.id===id);
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-go],[data-f],[data-lv],[data-pe],[data-pc],[data-pd],[data-me],[data-md],[data-le],[data-ld],.seat,button[id]");if(!el)return;const d=el.dataset;
 if(d.go){cur=d.go;render();return}
 if(el.id==="lg"){lang=lang==="en"?"ms":"en";render();return}
 if(d.lv){S.lv[d.lv]=clamp(S.lv[d.lv]+Number(d.d));render();return}
 if(el.classList.contains("seat")){seatModal(+d.i);return}
 if(d.f!==undefined&&el.classList.contains("lg")){flt=d.f&&flt!==d.f?d.f:null;render();return}
 if(d.pe)partyForm(P(d.pe));else if(d.pc){const p=P(d.pc);p.coal=p.coal==="gov"?"opp":"gov";toast(t("saved"));render()}else if(d.pd)delParty(d.pd);
 else if(d.me)cabForm(byId(S.cabinet,d.me));else if(d.md)ask(t("confirm"),()=>{S.cabinet=S.cabinet.filter(x=>x.id!==d.md)});
 else if(d.le)polForm(byId(S.policies,d.le));else if(d.ld)ask(t("confirm"),()=>{S.policies=S.policies.filter(x=>x.id!==d.ld)});
 else if(el.id==="addP")partyForm();else if(el.id==="addM")cabForm();else if(el.id==="addL")polForm();
 else if(el.id==="sim"){const pid=$("#ep").value;if(!pid){toast(t("noP"));return}simulate(pid,+$("#es").value);toast(t("simDone"));render()}
 else if(el.id==="rst"){S=JSON.parse(JSON.stringify({...BASE,cabinet:S.cabinet,policies:S.policies}));flt=null;toast(t("restored"));render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const el=e.target.closest(".seat,.lg");if(el){e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}))}}});
render();
</script></body></html>
