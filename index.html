<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarawak Political Simulator</title>

  <style>
    :root {
      --bg: #0b1120;
      --panel: #111a2d;
      --panel-light: #17233a;
      --border: #26344d;
      --text: #e8eef8;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --sidebar-width: 230px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand { padding: 0 10px; }
    .brand h1 { margin: 0; font-size: 17px; line-height: 1.4; }
    .brand p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }

    .nav { display: grid; gap: 7px; }

    .nav button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .nav button:hover { background: var(--panel-light); color: var(--text); }

    .nav button.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.22);
    }

    .main { min-width: 0; padding: 28px 32px; }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-heading h2 { margin: 0; font-size: 25px; }
    .page-heading p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

    .language-toggle {
      flex-shrink: 0;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }

    .language-toggle:hover { border-color: var(--accent); background: var(--panel-light); }
    .content { padding-top: 28px; }

    .dashboard-intro { margin-bottom: 22px; }
    .dashboard-intro h3 { margin: 0 0 8px; font-size: 19px; }
    .dashboard-intro p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card, .treasury-card, .placeholder, .dun-panel {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
    }

    .stat-card { min-width: 0; padding: 20px; }
    .stat-label { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .stat-value { margin-top: 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .stat-note { margin-top: 8px; color: var(--muted); font-size: 12px; }

    .treasury-card {
      margin-top: 16px;
      padding: 22px;
      background: linear-gradient(135deg, var(--panel), var(--panel-light));
    }

    .treasury-card .stat-value { font-size: 30px; }
    .placeholder { min-height: 220px; padding: 28px; }
    .placeholder h3 { margin: 0 0 10px; font-size: 18px; }
    .placeholder p { margin: 0; color: var(--muted); line-height: 1.7; }

    /* DUN layout */
    .dun-panel { padding: 22px; }

    .dun-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .dun-heading h3 { margin: 0 0 7px; }
    .dun-heading p { margin: 0; color: var(--muted); font-size: 13px; }

    .dun-total {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      white-space: nowrap;
    }

    .seat-map-wrap {
      width: 100%;
      overflow: hidden;
      margin: 0 auto;
    }

    .seat-map {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .seat {
      cursor: pointer;
      stroke: rgba(255,255,255,0.18);
      stroke-width: 2;
      transition: opacity 120ms ease, stroke 120ms ease, stroke-width 120ms ease;
    }

    .seat:hover,
    .seat:focus {
      stroke: #ffffff;
      stroke-width: 4;
      outline: none;
    }

    .seat.selected {
      stroke: #ffffff;
      stroke-width: 5;
    }

    .seat.dimmed { opacity: 0.22; }

    .dun-bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
      gap: 18px;
      margin-top: 12px;
    }

    .legend, .seat-info {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel-light);
    }

    .legend h4, .seat-info h4 { margin: 0 0 12px; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 12px 18px; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .legend-item.active { color: var(--text); }

    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .seat-info p { margin: 6px 0; color: var(--muted); font-size: 13px; }
    .seat-info strong { color: var(--text); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 1000px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }

      .sidebar {
        position: static;
        height: auto;
        padding: 18px;
        gap: 18px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 22px 18px; }
      .topbar { align-items: flex-start; }
      .page-heading h2 { font-size: 21px; }
      .dun-bottom { grid-template-columns: 1fr; }
      .dun-panel { padding: 14px; }
    }

    @media (max-width: 480px) {
      .topbar { flex-direction: column; }
      .language-toggle { align-self: flex-start; }
      .nav, .stats-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1 data-i18n="brand">Sarawak Political Simulator</h1>
        <p data-i18n="subtitle">Political strategy game</p>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-page="dashboard" data-i18n="dashboard">Dashboard</button>
        <button data-page="dun" data-i18n="dun">DUN</button>
        <button data-page="parties" data-i18n="parties">Parties</button>
        <button data-page="election" data-i18n="election">Election</button>
        <button data-page="cabinet" data-i18n="cabinet">Cabinet</button>
        <button data-page="policies" data-i18n="policies">Policies</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Welcome to the Sarawak Political Simulator.</p>
        </div>
        <button class="language-toggle" id="languageToggle" type="button">BM</button>
      </header>

      <section class="content" id="pageContent"></section>
    </main>
  </div>

  <script>
    const translations = {
      en: {
        brand: "Sarawak Political Simulator",
        subtitle: "Political strategy game",
        dashboard: "Dashboard", dun: "DUN", parties: "Parties",
        election: "Election", cabinet: "Cabinet", policies: "Policies",
        pageSubtitle: "Welcome to the Sarawak Political Simulator.",
        dashboardIntro: "Political and economic overview",
        dashboardDescription: "Your administration's current status.",
        publicApproval: "Public Approval", economy: "Economy",
        partyLoyalty: "Party Loyalty", integrity: "Integrity",
        stability: "Political Stability", federalRelations: "Federal Relations",
        treasury: "Treasury", initialStatus: "Starting value",
        treasuryNote: "Available government funds",
        dunIntro: "Legislative Assembly seat map",
        dunDescription: "Hover over a party to highlight its seats. Select a seat for details.",
        seats: "82 seats", legend: "Demo party distribution",
        seat: "Seat", party: "Party", representative: "Representative",
        demoNote: "Demo data — party names and representatives are temporary.",
        placeholder: "This section is ready for the next development step."
      },
      bm: {
        brand: "Simulator Politik Sarawak",
        subtitle: "Permainan strategi politik",
        dashboard: "Dashboard", dun: "DUN", parties: "Parti",
        election: "Pilihan Raya", cabinet: "Kabinet", policies: "Dasar",
        pageSubtitle: "Selamat datang ke Simulator Politik Sarawak.",
        dashboardIntro: "Gambaran politik dan ekonomi",
        dashboardDescription: "Status semasa pentadbiran anda.",
        publicApproval: "Sokongan Awam", economy: "Ekonomi",
        partyLoyalty: "Kesetiaan Parti", integrity: "Integriti",
        stability: "Kestabilan Politik", federalRelations: "Hubungan Persekutuan",
        treasury: "Perbendaharaan", initialStatus: "Nilai permulaan",
        treasuryNote: "Dana kerajaan yang tersedia",
        dunIntro: "Peta kerusi Dewan Undangan Negeri",
        dunDescription: "Halakan tetikus pada parti untuk sorot kerusinya. Klik kerusi untuk maklumat.",
        seats: "82 kerusi", legend: "Agihan parti demo",
        seat: "Kerusi", party: "Parti", representative: "Wakil rakyat",
        demoNote: "Data demo — nama parti dan wakil adalah sementara.",
        placeholder: "Bahagian ini sedia untuk langkah pembangunan seterusnya."
      }
    };

    const parties = [
      { name: "Party A", color: "#38bdf8", count: 30 },
      { name: "Party B", color: "#f59e0b", count: 22 },
      { name: "Party C", color: "#22c55e", count: 15 },
      { name: "Party D", color: "#a78bfa", count: 10 },
      { name: "Party E", color: "#f87171", count: 5 }
    ];

    const stats = [
      ["publicApproval", "55%"], ["economy", "50/100"],
      ["partyLoyalty", "60%"], ["integrity", "70/100"],
      ["stability", "65/100"], ["federalRelations", "50/100"]
    ];

    // Row counts from the innermost arc to the outermost arc: total = 82.
    const seatRows = [10, 14, 18, 20, 20];
    const seatRadii = [105, 155, 205, 255, 305];

    let currentLanguage = "en";
    let currentPage = "dashboard";
    let selectedSeat = 1;
    let hoveredParty = null;

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const pageContent = document.getElementById("pageContent");
    const languageToggle = document.getElementById("languageToggle");
    const navButtons = document.querySelectorAll(".nav button");

    function getPartyForSeat(seatNumber) {
      let remaining = seatNumber;
      for (const party of parties) {
        if (remaining <= party.count) return party;
        remaining -= party.count;
      }
      return parties[0];
    }

    function renderDashboard(t) {
      const cards = stats.map(([key, value]) => `
        <article class="stat-card">
          <div class="stat-label">${t[key]}</div>
          <div class="stat-value">${value}</div>
          <div class="stat-note">${t.initialStatus}</div>
        </article>`).join("");

      pageContent.innerHTML = `
        <div class="dashboard-intro">
          <h3>${t.dashboardIntro}</h3>
          <p>${t.dashboardDescription}</p>
        </div>
        <div class="stats-grid">${cards}</div>
        <article class="treasury-card">
          <div class="stat-label">${t.treasury}</div>
          <div class="stat-value">RM 100,000,000</div>
          <div class="stat-note">${t.treasuryNote}</div>
        </article>`;
    }

    function renderDun(t) {
      pageContent.innerHTML = `
        <div class="dun-panel">
          <div class="dun-heading">
            <div>
              <h3>${t.dunIntro}</h3>
              <p>${t.dunDescription}</p>
            </div>
            <div class="dun-total">${t.seats}</div>
          </div>

          <div class="seat-map-wrap">
            <svg class="seat-map" id="seatMap" viewBox="0 0 1000 390"
                 role="group" aria-label="${t.dunIntro}">
              <line x1="155" y1="350" x2="845" y2="350"
                    stroke="#26344d" stroke-width="2" />
          </svg>
          </div>

          <div class="dun-bottom">
            <div class="legend">
              <h4>${t.legend}</h4>
              <div class="legend-items" id="partyLegend"></div>
            </div>
            <div class="seat-info" id="seatInfo"></div>
          </div>
          <p class="stat-note">${t.demoNote}</p>
        </div>`;

      const svg = document.getElementById("seatMap");
      const ns = "http://www.w3.org/2000/svg";
      let seatNumber = 1;

      seatRows.forEach((rowCount, rowIndex) => {
        const radius = seatRadii[rowIndex];

        for (let i = 0; i < rowCount; i++) {
          // Spread seats evenly along the upper semicircle, from left to right.
          const angle = Math.PI - (Math.PI * i / (rowCount - 1));
          const x = 500 + radius * Math.cos(angle);
          const y = 350 - radius * Math.sin(angle);
          const party = getPartyForSeat(seatNumber);

          const circle = document.createElementNS(ns, "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", y);
          circle.setAttribute("r", 12);
          circle.setAttribute("fill", party.color);
          circle.setAttribute("class", "seat");
          circle.setAttribute("tabindex", "0");
          circle.setAttribute("role", "button");
          circle.setAttribute("aria-label", `${t.seat} ${seatNumber}, ${party.name}`);
          circle.dataset.seat = seatNumber;
          circle.dataset.party = party.name;

          const title = document.createElementNS(ns, "title");
          title.textContent = `${t.seat} ${seatNumber} — ${party.name}`;
          circle.appendChild(title);

          circle.addEventListener("mouseenter", () => {
            hoveredParty = party.name;
            updatePartyHighlight();
          });

          circle.addEventListener("mouseleave", () => {
            hoveredParty = null;
            updatePartyHighlight();
          });

          circle.addEventListener("click", () => selectSeat(seatNumber));

          circle.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectSeat(seatNumber);
            }
          });

          svg.appendChild(circle);
          seatNumber++;
        }
      });

      renderLegend(t);
      selectSeat(selectedSeat);
    }

    function renderLegend(t) {
      const legend = document.getElementById("partyLegend");

      legend.innerHTML = parties.map(party => `
        <div class="legend-item" data-party="${party.name}" tabindex="0" role="button">
          <span class="legend-dot" style="background:${party.color}"></span>
          <span>${party.name} (${party.count})</span>
        </div>
      `).join("");

      legend.querySelectorAll(".legend-item").forEach(item => {
        const partyName = item.dataset.party;

        item.addEventListener("mouseenter", () => {
          hoveredParty = partyName;
          updatePartyHighlight();
        });

        item.addEventListener("mouseleave", () => {
          hoveredParty = null;
          updatePartyHighlight();
        });

        item.addEventListener("click", () => {
          hoveredParty = hoveredParty === partyName ? null : partyName;
          updatePartyHighlight();
        });

        item.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            hoveredParty = hoveredParty === partyName ? null : partyName;
            updatePartyHighlight();
          }
        });
      });
    }

    function updatePartyHighlight() {
      document.querySelectorAll(".seat").forEach(seat => {
        seat.classList.toggle(
          "dimmed",
          hoveredParty !== null && seat.dataset.party !== hoveredParty
        );
      });

      document.querySelectorAll(".legend-item").forEach(item => {
        item.classList.toggle("active", item.dataset.party === hoveredParty);
      });
    }

    function selectSeat(number) {
      selectedSeat = number;
      const party = getPartyForSeat(number);

      document.querySelectorAll(".seat").forEach(seat => {
        seat.classList.toggle("selected", Number(seat.dataset.seat) === number);
      });

      const info = document.getElementById("seatInfo");
      if (!info) return;

      info.innerHTML = `
        <h4>${translations[currentLanguage].seat} ${number}</h4>
        <p><strong>${translations[currentLanguage].party}:</strong> ${party.name}</p>
        <p><strong>${translations[currentLanguage].representative}:</strong> Demo Representative ${number}</p>`;
    }

    function renderPlaceholder(t, title) {
      pageContent.innerHTML = `
        <article class="placeholder">
          <h3>${title}</h3>
          <p>${t.placeholder}</p>
        </article>`;
    }

    function updatePage() {
      const t = translations[currentLanguage];

      pageTitle.textContent = t[currentPage];
      pageSubtitle.textContent = t.pageSubtitle;

      navButtons.forEach(button => {
        const active = button.dataset.page === currentPage;
        button.classList.toggle("active", active);
        button.setAttribute("aria-current", active ? "page" : "false");
      });

      if (currentPage === "dashboard") renderDashboard(t);
      else if (currentPage === "dun") renderDun(t);
      else renderPlaceholder(t, t[currentPage]);
    }

    function updateLanguage() {
      const t = translations[currentLanguage];
      document.documentElement.lang = currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        if (t[key]) element.textContent = t[key];
      });

      languageToggle.textContent = currentLanguage === "en" ? "BM" : "EN";
      updatePage();
    }

    navButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentPage = button.dataset.page;
        updatePage();
      });
    });

    languageToggle.addEventListener("click", () => {
      currentLanguage = currentLanguage === "en" ? "bm" : "en";
      updateLanguage();
    });

    updateLanguage();
  </script>
</body>
</html>
