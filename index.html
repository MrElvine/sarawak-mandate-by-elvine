<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarawak Political Simulator</title>

  <style>
    :root {
      --bg: #0b1120;
      --panel: #111a2d;
      --panel-light: #17233a;
      --border: #26344d;
      --text: #e8eef8;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --sidebar-width: 230px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand { padding: 0 10px; }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .nav { display: grid; gap: 7px; }

    .nav button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .nav button:hover {
      background: var(--panel-light);
      color: var(--text);
    }

    .nav button.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.22);
    }

    .main {
      min-width: 0;
      padding: 28px 32px;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 0 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-heading h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .page-heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .language-toggle {
      flex-shrink: 0;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .language-toggle:hover {
      border-color: var(--accent);
      background: var(--panel-light);
    }

    .content { padding-top: 28px; }

    .dashboard-intro {
      margin-bottom: 22px;
    }

    .dashboard-intro h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .dashboard-intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .stat-value {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .stat-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .treasury-card {
      margin-top: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: linear-gradient(135deg, var(--panel), var(--panel-light));
    }

    .treasury-card .stat-value {
      font-size: 30px;
    }

    .placeholder {
      min-height: 220px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .placeholder h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .placeholder p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 1000px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }

      .sidebar {
        position: static;
        height: auto;
        padding: 18px;
        gap: 18px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 22px 18px; }
      .topbar { align-items: flex-start; }
      .page-heading h2 { font-size: 21px; }
    }

    @media (max-width: 480px) {
      .topbar { flex-direction: column; }
      .language-toggle { align-self: flex-start; }
      .nav, .stats-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1 data-i18n="brand">Sarawak Political Simulator</h1>
        <p data-i18n="subtitle">Political strategy game</p>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-page="dashboard" data-i18n="dashboard">Dashboard</button>
        <button data-page="dun" data-i18n="dun">DUN</button>
        <button data-page="parties" data-i18n="parties">Parties</button>
        <button data-page="election" data-i18n="election">Election</button>
        <button data-page="cabinet" data-i18n="cabinet">Cabinet</button>
        <button data-page="policies" data-i18n="policies">Policies</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Welcome to the Sarawak Political Simulator.</p>
        </div>

        <button class="language-toggle" id="languageToggle" type="button">
          BM
        </button>
      </header>

      <section class="content" id="pageContent"></section>
    </main>
  </div>

  <script>
    const translations = {
      en: {
        brand: "Sarawak Political Simulator",
        subtitle: "Political strategy game",
        dashboard: "Dashboard",
        dun: "DUN",
        parties: "Parties",
        election: "Election",
        cabinet: "Cabinet",
        policies: "Policies",
        pageSubtitle: "Welcome to the Sarawak Political Simulator.",
        dashboardIntro: "Political and economic overview",
        dashboardDescription: "Your administration's current status.",
        publicApproval: "Public Approval",
        economy: "Economy",
        partyLoyalty: "Party Loyalty",
        integrity: "Integrity",
        stability: "Political Stability",
        federalRelations: "Federal Relations",
        treasury: "Treasury",
        initialStatus: "Starting value",
        treasuryNote: "Available government funds",
        placeholderDescription: "This section is ready for the next development step."
      },
      bm: {
        brand: "Simulator Politik Sarawak",
        subtitle: "Permainan strategi politik",
        dashboard: "Dashboard",
        dun: "DUN",
        parties: "Parti",
        election: "Pilihan Raya",
        cabinet: "Kabinet",
        policies: "Dasar",
        pageSubtitle: "Selamat datang ke Simulator Politik Sarawak.",
        dashboardIntro: "Gambaran politik dan ekonomi",
        dashboardDescription: "Status semasa pentadbiran anda.",
        publicApproval: "Sokongan Awam",
        economy: "Ekonomi",
        partyLoyalty: "Kesetiaan Parti",
        integrity: "Integriti",
        stability: "Kestabilan Politik",
        federalRelations: "Hubungan Persekutuan",
        treasury: "Perbendaharaan",
        initialStatus: "Nilai permulaan",
        treasuryNote: "Dana kerajaan yang tersedia",
        placeholderDescription: "Bahagian ini sedia untuk langkah pembangunan seterusnya."
      }
    };

    const stats = [
      { key: "publicApproval", value: "55%" },
      { key: "economy", value: "50/100" },
      { key: "partyLoyalty", value: "60%" },
      { key: "integrity", value: "70/100" },
      { key: "stability", value: "65/100" },
      { key: "federalRelations", value: "50/100" }
    ];

    let currentLanguage = "en";
    let currentPage = "dashboard";

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const pageContent = document.getElementById("pageContent");
    const languageToggle = document.getElementById("languageToggle");
    const navButtons = document.querySelectorAll(".nav button");

    function renderDashboard(language) {
      const cards = stats.map((stat) => `
        <article class="stat-card">
          <div class="stat-label">${language[stat.key]}</div>
          <div class="stat-value">${stat.value}</div>
          <div class="stat-note">${language.initialStatus}</div>
        </article>
      `).join("");

      pageContent.innerHTML = `
        <div class="dashboard-intro">
          <h3>${language.dashboardIntro}</h3>
          <p>${language.dashboardDescription}</p>
        </div>

        <div class="stats-grid">
          ${cards}
        </div>

        <article class="treasury-card">
          <div class="stat-label">${language.treasury}</div>
          <div class="stat-value">RM 100,000,000</div>
          <div class="stat-note">${language.treasuryNote}</div>
        </article>
      `;
    }

    function renderPlaceholder(language, title) {
      pageContent.innerHTML = `
        <article class="placeholder">
          <h3>${title}</h3>
          <p>${language.placeholderDescription}</p>
        </article>
      `;
    }

    function updatePage() {
      const language = translations[currentLanguage];
      const title = language[currentPage];

      pageTitle.textContent = title;
      pageSubtitle.textContent = language.pageSubtitle;

      navButtons.forEach((button) => {
        const isActive = button.dataset.page === currentPage;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-current", isActive ? "page" : "false");
      });

      if (currentPage === "dashboard") {
        renderDashboard(language);
      } else {
        renderPlaceholder(language, title);
      }
    }

    function updateLanguage() {
      const language = translations[currentLanguage];

      document.documentElement.lang = currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        if (language[key]) element.textContent = language[key];
      });

      languageToggle.textContent = currentLanguage === "en" ? "BM" : "EN";
      updatePage();
    }

    navButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentPage = button.dataset.page;
        updatePage();
      });
    });

    languageToggle.addEventListener("click", () => {
      currentLanguage = currentLanguage === "en" ? "bm" : "en";
      updateLanguage();
    });

    updateLanguage();
  </script>
</body>
</html>
