 if(fx.l){S.parties.forEach(p=>{if(p.coal==="gov")p.loy=clamp((p.loy||0)+fx.l)});out.push(["loyalty",fx.l])}
 if(fx.w){S.game.mom+=fx.w;out.push(["mom",fx.w])}
 if(fx.f){const r=flip(fx.f);if(r)ex.push(t("moved")+": "+r)}
 if(fx.pol){const q=fx.pol.split("|");S.policies.push({id:uid(),title:q[0],cat:q[1],desc:"",status:"1"});ex.push(t("polAdd")+": "+q[0])}
 return {out,ex}}
function showEvent(){const g=S.game,ev=EV[g.pend];if(!ev)return;const o=$("#modal");o.hidden=false;
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h3>⚠ ${esc(ev.t[L()])}</h3><p>${esc(ev.d[L()])}</p>${ev.c.map((c,i)=>`<button class="btn chb" data-ch="${i}">${esc(c.t[L()])}</button>`).join("")}</div>`}
function showRes(ev,c,r){const o=$("#modal");o.hidden=false;
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h3>${t("conseq")}</h3><p><b>${esc(ev.t[L()])}</b> → ${esc(c.t[L()])}</p><ul>${r.out.map(([k,v])=>`<li>${t(k)} <b style="color:${v>0?"#1a9d57":"#b42318"}">${v>0?"+":""}${v}</b></li>`).join("")}${r.ex.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="row"><button class="btn p" id="ok">${t("ok")}</button></div></div>`}
function choose(i){const g=S.game,ev=EV[g.pend];if(!ev)return;const c=ev.c[i],r=applyFx(c.fx);
 g.log.push({w:g.weeks-g.left,e:g.pend,c:i});g.pend=null;render();showRes(ev,c,r)}
function endWeek(){const g=S.game;if(g.over||g.pend!==null)return;g.left--;
 S.res.ap=2;S.res.funds+=8;S.res.cap=Math.min(100,S.res.cap+5);
 S.seats.forEach(q=>{q.sup=Math.max(5,Math.min(95,q.sup+Math.round((S.lv.approval-65)/25+(Math.random()-.5))))});
 ["approval","economy","stability","autonomy"].forEach(n=>{S.lv[n]=clamp(S.lv[n]+Math.round(Math.random()*4-2))});
 if(g.left<=0){electionDay();return}
 let pool=EV.map((_,i)=>i).filter(i=>!g.used.includes(i));if(!pool.length){g.used=[];pool=EV.map((_,i)=>i)}
 g.pend=pool[Math.floor(Math.random()*pool.length)];g.used.push(g.pend);render();showEvent()}
function electionDay(){const g=S.game,l=S.lv;g.over=true;g.left=0;
 const c0=cnt(),by=k=>S.parties.filter(p=>p.coal===k).sort((a,b)=>c0[b.id]-c0[a.id]),govP=by("gov"),oppP=by("opp");
 const shift=(l.approval-65)*.25+(l.economy-60)*.1+(l.stability-65)*.1+(loyalty()-75)*.1+(l.autonomy-55)*.05+g.mom*1.5;
 let flips=0;
 S.seats.forEach(s=>{const hg=P(s.party)&&P(s.party).coal==="gov",eff=s.sup+shift+s.inc*.08*(hg?1:-1)+(Math.random()-.5)*12;
  if(eff>=50&&!hg&&govP.length){s.party=govP[0].id;flips++}
  else if(eff<50&&hg&&oppP.length){s.party=oppP[0].id;flips++}});
 const gs=side("gov"),os=side("opp"),m=maj(),sw=Math.round(shift);
 g.res={sw,txt:gs>=m?"govMaj":os>=m?"oppMaj":"hung",gs,os};render();
 const o=$("#modal");o.hidden=false;
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h3>🗳 ${t("elDay")}</h3><p><b>${t(g.res.txt)}</b><br>${t("swingRes")}: ${sw>0?"+":""}${sw}%<br>${t("gov")} ${gs} / ${t("opp")} ${os} (${t("maj")}: ${m})<br>${t("moved")}: ${flips}</p><div class="row"><button class="btn p" id="ng">${t("newG")}</button><button class="btn" id="ok">${t("close")}</button></div></div>`}
const byId=(a,id)=>a.find(x=>x.id===id);
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act],[data-go],[data-f],[data-lv],[data-ch],[data-edit],[data-pe],[data-pc],[data-pd],[data-me],[data-md],[data-le],[data-ld],.seat,button[id]");if(!el)return;const d=el.dataset;
 if(d.go){cur=d.go;render();return}
 if(el.id==="lg"){lang=lang==="en"?"ms":"en";render();return}
 if(d.lv){S.lv[d.lv]=clamp(S.lv[d.lv]+Number(d.d));render();return}
 if(d.act){act(d.act);return}
 if(d.ch!==undefined){choose(+d.ch);return}
 if(d.edit!==undefined){seatModal(+d.edit);return}
 if(el.classList.contains("tile")){hl(null);selDun=+d.i;render();return}
 if(el.classList.contains("seat")){hl(null);seatModal(+d.i);return}
 if(d.f!==undefined&&el.classList.contains("lg")){flt=d.f&&flt!==d.f?d.f:null;render();return}
 if(d.pe)partyForm(P(d.pe));else if(d.pc){const p=P(d.pc);p.coal=p.coal==="gov"?"opp":"gov";toast(t("saved"));render()}else if(d.pd)delParty(d.pd);
 else if(d.me)cabForm(byId(S.cabinet,d.me));else if(d.md)ask(t("confirm"),()=>{S.cabinet=S.cabinet.filter(x=>x.id!==d.md)});
 else if(d.le)polForm(byId(S.policies,d.le));else if(d.ld)ask(t("confirm"),()=>{S.policies=S.policies.filter(x=>x.id!==d.ld)});
 else if(el.id==="addP")partyForm();else if(el.id==="addM")cabForm();else if(el.id==="addL")polForm();
 else if(el.id==="endw")endWeek();else if(el.id==="resolve")showEvent();
 else if(el.id==="ok"){closeM();render()}
 else if(el.id==="ng"){S=mk();flt=null;selDun=null;closeM();render()}
 else if(el.id==="sim"){const pid=$("#ep").value;if(!pid){toast(t("noP"));return}simulate(pid,+$("#es").value);toast(t("simDone"));render()}
 else if(el.id==="rst"){S=JSON.parse(JSON.stringify({...BASE,cabinet:S.cabinet,policies:S.policies,game:S.game,res:S.res}));flt=null;selDun=null;toast(t("restored"));render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const el=e.target.closest(".seat,.lg");if(el){e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}))}}});
/* ---------- hover highlight + tooltip ---------- */
const tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip);
function hl(el){
 const pid=el?el.dataset.p:null;
 document.querySelectorAll(".seat").forEach(c=>{const m=pid&&c.dataset.p===pid;c.style.opacity=pid?(m?1:.15):"";c.style.stroke=m?"#fff":"";c.style.strokeWidth=m?"3":""});
 if(!el){tip.style.display="none";return}
 const p=P(pid),s=S.seats[+el.dataset.i],n=cnt()[pid];
 tip.innerHTML=`<b>${esc(p?p.abbr:"?")}</b> · ${esc(p?p.name:"")}<br>${n} ${t("seats")} · ${p?t(p.coal):""}<br><span class="mu">${esc(s.name)}</span>`;tip.style.display="block"}
document.addEventListener("mouseover",e=>{const el=e.target.closest(".seat");if(el)hl(el)});
document.addEventListener("mouseout",e=>{if(e.target.closest(".seat"))hl(null)});
document.addEventListener("mousemove",e=>{if(tip.style.display==="block"){tip.style.left=Math.min(e.clientX+14,innerWidth-250)+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-90)+"px"}});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest(".seat");if(el){hl(el);const r=el.getBoundingClientRect();tip.style.left=Math.min(r.right+8,innerWidth-250)+"px";tip.style.top=r.top+"px"}});
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest(".seat"))hl(null)});
render();
</script></body></html>
