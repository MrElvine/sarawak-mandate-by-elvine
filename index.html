function clipHP(poly,mx,my,nx,ny){const out=[],d=q=>(q[0]-mx)*nx+(q[1]-my)*ny;
 for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=d(a),db=d(b);
  if(da<=0)out.push(a);
  if((da<0&&db>0)||(da>0&&db<0)){const k=da/(da-db);out.push([a[0]+k*(b[0]-a[0]),a[1]+k*(b[1]-a[1])])}}
 return out}

 const polys=sd.map((a,ai)=>{let poly=box;for(let b=0;b<sd.length&&poly.length;b++){if(b===ai)continue;poly=clipHP(poly,(a.x+sd[b].x)/2,(a.y+sd[b].y)/2,sd[b].x-a.x,sd[b].y-a.y)}return poly});
 const f=n=>n.toFixed(1),pd=poly=>"M"+poly.map(q=>f(q[0])+","+f(q[1])).join("L")+"Z";
 const dunD=Array(TOTAL).fill(""),dunE=[],divE=[],divBy=DIV.map(()=>[]);
 polys.forEach((poly,ai)=>{const a=sd[ai];dunD[a.i]+=pd(poly);
  for(let e=0;e<poly.length;e++){const A=poly[e],B=poly[(e+1)%poly.length],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);if(L<.01)continue;
   const nx=-dy/L*.15,ny=dx/L*.15,k1=NEAR(sd,mx+nx,my+ny),k2=NEAR(sd,mx-nx,my-ny),k=k1===ai?k2:k2===ai?k1:-1;
   if(k<0||k===ai||k<ai)continue;

E("scandal","pol",["Scandal in a ministry","Skandal di sebuah kementerian"],
["A report alleges that a ministry awarded contracts without a proper tender. The press is asking for answers and an opposition member has called for resignations. Some in your party say the matter should be handled quietly to avoid damage.","Satu laporan mendakwa sebuah kementerian menganugerahkan kontrak tanpa tender yang betul. Media meminta jawapan dan seorang ahli pembangkang menggesa peletakan jawatan. Sebahagian dalam parti anda berkata perkara ini patut ditangani secara senyap bagi mengelakkan kerosakan."],
[[["Sack the minister immediately","Pecat menteri serta-merta"],["The decisive move earns respect, though the minister's allies in the party are furious.","Langkah tegas ini meraih penghormatan, walaupun sekutu menteri itu dalam parti berang."],{a:3,l:-3,u:-1}],
 [["Keep it quiet","Senyapkan perkara ini"],["The story dies down for now, but a journalist keeps digging. This may not be over.","Cerita reda buat masa ini, tetapi seorang wartawan terus menyiasat. Ini mungkin belum berakhir."],{a:-3,l:2,nx:["leak",25]}],
 [["Order an independent probe","Arahkan siasatan bebas"],["The probe buys time and credibility, and a transparency reform is announced. It costs money and nobody can predict the findings.","Siasatan memberi masa dan kredibiliti, dan pembaharuan ketelusan diumumkan. Ia mahal dan tiada siapa dapat meramal hasilnya."],{a:1,u:-1,mo:-10,w:1,pol:"Transparency reform|Governance"}]]),
E("cross","pol",["Opposition figure wants to cross over","Tokoh pembangkang mahu menyertai kerajaan"],
["An opposition assemblyman has signalled that he is ready to join the government, citing frustration with his own party. Some of your members welcome the extra seat; others warn that opportunists rarely stay loyal and that voters dislike party-hopping.","Seorang wakil rakyat pembangkang memberi isyarat bersedia menyertai kerajaan kerana kecewa dengan partinya sendiri. Sebahagian ahli anda mengalu-alukan kerusi tambahan; yang lain memberi amaran oportunis jarang setia dan pengundi tidak suka lompat parti."],
[[["Welcome him with a post","Sambut beliau dengan satu jawatan"],["The bloc gains a seat and a headline. Some supporters grumble about rewarding opportunism.","Blok mendapat satu kerusi dan satu tajuk berita. Sebahagian penyokong merungut tentang ganjaran kepada oportunisme."],{f:"o",l:-3,a:-1,mo:-10}],
 [["Decline and stay principled","Menolak dan kekal berprinsip"],["You earn respect for consistency, though the seat count stays the same.","Anda meraih penghormatan kerana konsisten, walaupun bilangan kerusi kekal."],{a:2,l:2}],
 [["Keep him waiting","Biarkan beliau menunggu"],["He stays in limbo, which keeps the opposition nervous and the story alive.","Beliau tergantung, menjadikan pembangkang resah dan cerita ini hidup."],{u:1,w:1}]]),
E("budget","eco",["Revenue falls short","Hasil kurang daripada sasaran"],
["Revenue is below target and the cash balance is running low. Suppliers are asking when they will be paid, and the finance team warns that salaries could be delayed within weeks if nothing is done. Every option has a political price.","Hasil kurang daripada sasaran dan baki tunai semakin rendah. Pembekal bertanya bila mereka akan dibayar, dan pasukan kewangan memberi amaran gaji boleh lewat dalam beberapa minggu jika tiada tindakan. Setiap pilihan ada harga politik."],
[[["Borrow to cover the gap","Berhutang untuk menampung"],["Cash arrives quickly and the crisis passes. The debt grows and so does the interest bill.","Wang tiba cepat dan krisis berlalu. Hutang membesar dan bil faedah juga."],{db:150,mo:150}],
 [["Cut public spending","Potong perbelanjaan awam"],["Accounts stabilise, but cancelled projects and slower services upset residents.","Akaun stabil, tetapi projek dibatalkan dan perkhidmatan lebih perlahan menjengkelkan penduduk."],{mo:60,a:-4,u:4,e:-2}],
 [["Raise fees and levies","Naikkan fi dan levi"],["Revenue improves, but small businesses complain loudly and some call it a hidden tax.","Hasil bertambah baik, tetapi perniagaan kecil mengadu kuat dan ada yang menyebutnya cukai tersembunyi."],{mo:80,a:-6,u:3}]],{when:s=>s.lv.money<200,adv:"fin",rec:1}),
E("youth","soc",["Youth protest over jobs","Protes belia mengenai pekerjaan"],
["Hundreds of graduates have gathered downtown demanding jobs and lower living costs. The mood is tense but peaceful so far. Police ask for instructions, and organisers say they will return every weekend until someone listens.","Ratusan graduan berhimpun di tengah bandar menuntut pekerjaan dan kos sara hidup lebih rendah. Suasana tegang tetapi aman setakat ini. Polis meminta arahan, dan penganjur berkata mereka akan kembali setiap hujung minggu sehingga ada yang mendengar."],
[[["Launch a youth jobs scheme","Lancarkan skim pekerjaan belia"],["Applications flood in within days and the protests thin out. The scheme will cost money every month.","Permohonan membanjir dalam beberapa hari dan protes beransur kurang. Skim ini akan memakan belanja setiap bulan."],{mo:-45,u:-5,a:3,pol:"Youth jobs scheme|Social"}],
 [["Disperse the crowd","Bubarkan orang ramai"],["The street clears quickly, but photos of the dispersal spread online and anger deepens.","Jalan lengang dengan cepat, tetapi gambar pembubaran tersebar dalam talian dan kemarahan bertambah."],{u:-3,a:-6,w:-1,nx:["backlash",20]}],
 [["Hold a dialogue with the organisers","Adakan dialog dengan penganjur"],["Both sides talk for hours. Nothing is solved overnight, but the next march is cancelled.","Kedua-dua pihak berbincang berjam-jam. Tiada apa selesai semalaman, tetapi perarakan seterusnya dibatalkan."],{u:-2,a:1,mo:-5}]],{when:s=>s.lv.unrest>40,adv:"sec",rec:2,reg:["kch","mri","sib"]}),
E("royalty","fed",["Resource revenue dispute","Pertikaian hasil sumber"],
["Talks on the state's share of resource revenue have reopened. The federal side offers an increase, but smaller than your negotiators hoped. Some legal advisers say the claim is strong enough for court; others say a court case would take years and sour relations.","Rundingan tentang bahagian negeri daripada hasil sumber dibuka semula. Pihak Persekutuan menawarkan kenaikan, tetapi lebih kecil daripada yang diharapkan perunding anda. Sebahagian penasihat undang-undang berkata tuntutan cukup kuat untuk ke mahkamah; yang lain berkata kes mahkamah akan mengambil bertahun-tahun dan merosakkan hubungan."],
[[["Demand a bigger share","Tuntut bahagian lebih besar"],["The tough line plays well at home. The federal side digs in and talks drag on.","Pendirian keras mendapat sambutan di dalam negeri. Pihak Persekutuan bertahan dan rundingan berlarutan."],{m:5,u:2,l:1}],
 [["Accept the offer","Terima tawaran"],["Money flows in soon after. Commentators say the state could have pushed harder.","Wang masuk tidak lama kemudian. Pengulas berkata negeri sepatutnya mendesak lebih keras."],{mo:80,m:-3}],
 [["Take the case to court","Bawa kes ke mahkamah"],["The filing makes headlines and shows resolve, though legal fees begin to pile up.","Pemfailan menjadi berita utama dan menunjukkan azam, walaupun yuran guaman mula bertimbun."],{m:3,mo:-20,a:1}]]),
E("invest","eco",["Investor wants land","Pelabur mahu tanah"],
["A large investor proposes a plantation and processing hub that would create jobs and tax revenue. Part of the land is claimed under native customary rights. The investor wants a fast decision and hints that it will look at other states otherwise.","Seorang pelabur besar mencadangkan pusat ladang dan pemprosesan yang akan mewujudkan pekerjaan dan hasil cukai. Sebahagian tanah dituntut di bawah hak adat bumiputera. Pelabur mahukan keputusan cepat dan mengisyaratkan akan melihat negeri lain jika tidak."],
[[["Approve quickly","Luluskan segera"],["Construction begins within months and the economy gets a boost. Community leaders say they were not properly consulted.","Pembinaan bermula dalam beberapa bulan dan ekonomi mendapat dorongan. Pemimpin komuniti berkata mereka tidak dirunding dengan sempurna."],{e:6,mo:40,a:-1,nx:["landprot",30]}],
 [["Decline the project","Tolak projek"],["Native rights groups applaud, but business groups say the state is turning away investment.","Kumpulan hak adat memuji, tetapi kumpulan perniagaan berkata negeri menolak pelaburan."],{e:-1,a:2}],
 [["Negotiate with the community first","Berunding dengan komuniti dahulu"],["Talks take longer and the investor reduces the scale, but both sides accept the compromise.","Rundingan mengambil masa lebih lama dan pelabur mengecilkan skala, tetapi kedua-dua pihak menerima kompromi."],{e:3,mo:10}]],{adv:"land",rec:2,reg:["muk","btu","mri"]}),
E("health","soc",["Dengue outbreak","Wabak denggi"],
["Dengue cases have jumped in several towns and clinics are running short of staff and supplies. Parents are worried about schools. Health officers say a quick campaign of fogging, clean-ups and public notices could slow the spread, but it costs money.","Kes denggi melonjak di beberapa pekan dan klinik kekurangan kakitangan dan bekalan. Ibu bapa risau tentang sekolah. Pegawai kesihatan berkata kempen pantas pengasapan, gotong-royong dan notis awam boleh melambatkan penularan, tetapi ia memerlukan belanja."],
[[["Launch an emergency clean-up campaign","Lancarkan kempen pembersihan kecemasan"],["Cases peak within two weeks and then fall. Volunteers join in and people feel looked after.","Kes memuncak dalam dua minggu dan kemudian menurun. Sukarelawan menyertai dan rakyat rasa dijaga."],{a:4,mo:-30,u:-1}],
 [["Issue a public advisory only","Keluarkan nasihat awam sahaja"],["A few cases fall, but many do not, and some clinics are overwhelmed.","Beberapa kes berkurang, tetapi ramai tidak, dan sebahagian klinik terbeban."],{a:-1,mo:-5,nx:["dengue2",20]}],
 [["Blame residents for poor hygiene","Salahkan penduduk kerana kebersihan lemah"],["The comment goes viral for the wrong reasons, and health workers privately say it made their job harder.","Komen itu tular atas sebab yang salah dan pekerja kesihatan secara peribadi berkata ia menyukarkan kerja mereka."],{a:-6,u:3}]],{adv:"hlt",rec:0,reg:["kch","smh","btu"]}),
E("tourism","eco",["Rainforest festival proposal","Cadangan festival hutan hujan"],
["A proposal has landed for a large rainforest music and culture festival that could attract international visitors and sponsors. Hotels and craft sellers are enthusiastic. Critics worry about costs, crowds and the pressure on the local communities who would host it.","Satu cadangan tiba untuk festival muzik dan budaya hutan hujan berskala besar yang boleh menarik pelawat antarabangsa dan penaja. Hotel dan penjual kraf bersemangat. Pengkritik risau tentang kos, kesesakan dan tekanan ke atas komuniti tempatan yang menjadi tuan rumah."],
[[["Go big with international promotion","Teruskan secara besar dengan promosi antarabangsa"],["Tickets sell well and hotels fill up. The cost is high and the crowds strain local services.","Tiket laris dan hotel penuh. Kosnya tinggi dan kesesakan menekan perkhidmatan tempatan."],{e:5,mo:-25,a:3,u:1}],
 [["Keep it community-run and modest","Kekalkan secara kecil dan dikendalikan komuniti"],["Villagers take pride in hosting and craft sales rise. The event stays small and less profitable.","Penduduk kampung berbangga menjadi tuan rumah dan jualan kraf meningkat. Acara kekal kecil dan kurang menguntungkan."],{e:2,mo:10,a:2}],
 [["Cancel to save money","Batalkan untuk jimat"],["The budget is saved, but sellers and hotels feel let down.","Bajet dijimatkan, tetapi penjual dan hotel rasa dikecewakan."],{mo:15,a:-3,e:-2}]],{adv:"dig",rec:1,reg:["kch","mri","lmb"]}),
E("timber","env",["Timber licence controversy","Kontroversi lesen balak"],
["Environmental groups say timber licences have been granted near native villages and a watershed. A leaked map seems to support their claim. The industry says the licences are legal and thousands of jobs depend on them.","Kumpulan alam sekitar berkata lesen balak diberikan berhampiran kampung bumiputera dan kawasan tadahan air. Satu peta bocor seolah-olah menyokong dakwaan mereka. Industri berkata lesen itu sah dan beribu pekerjaan bergantung kepadanya."],
[[["Review the licences openly","Semak semula lesen secara terbuka"],["The review pauses some operations and annoys companies, but villagers and conservation groups praise the openness.","Semakan menghentikan sebahagian operasi dan menjengkelkan syarikat, tetapi penduduk kampung dan kumpulan pemuliharaan memuji keterbukaan."],{a:3,e:-3,u:-2,mo:-5}],
 [["Defend the licences","Pertahankan lesen"],["Industry is pleased, but protests start in the affected area and the issue sticks to your name.","Industri gembira, tetapi protes bermula di kawasan terjejas dan isu ini melekat pada nama anda."],{e:2,a:-4,u:4}],
 [["Freeze new licences quietly","Bekukan lesen baharu secara senyap"],["The freeze reduces tension without a public fight. Nobody feels fully satisfied.","Pembekuan mengurangkan ketegangan tanpa pertengkaran awam. Tiada siapa rasa sepenuhnya puas."],{u:-1,e:-1,a:1}]],{adv:"land",rec:0,reg:["kap","lmb","mri"]}),
E("civil","eco",["Civil servants ask for a bonus","Penjawat awam minta bonus"],
["The civil servants' union asks for a one-off bonus and better allowances, noting that prices have gone up. Government workers are an important base of support. Finance officers warn that a generous package would strain the budget.","Kesatuan penjawat awam meminta bonus sekali bayar dan elaun lebih baik kerana harga barang naik. Pekerja kerajaan ialah asas sokongan penting. Pegawai kewangan memberi amaran pakej murah hati akan membebankan bajet."],
[[["Grant the full request","Luluskan permintaan penuh"],["Morale jumps and the union praises you. The accounts feel the weight a few weeks later.","Moral melonjak dan kesatuan memuji anda. Akaun terasa bebannya beberapa minggu kemudian."],{mo:-60,a:4,l:2,u:-2}],
 [["Offer a smaller package","Tawarkan pakej lebih kecil"],["A compromise is reached after tense talks. Few are fully happy, but the budget survives.","Kompromi dicapai selepas rundingan tegang. Sedikit yang sepenuhnya gembira, tetapi bajet bertahan."],{mo:-25,a:1}],
 [["Refuse","Tolak"],["The refusal saves money, but union leaders warn of slow work and protest at the next meeting.","Penolakan menjimatkan wang, tetapi pemimpin kesatuan memberi amaran kerja perlahan dan protes pada mesyuarat seterusnya."],{a:-5,u:3,l:-2}]],{adv:"fin",rec:1,reg:["kch","smh"]}),
E("haze","env",["Haze over the state","Jerebu menyelubungi negeri"],
["Smoke from open burning across the region has pushed the air quality index into unhealthy levels. Schools are asking whether to close and hospitals report more breathing complaints. Enforcement against open burning would upset farmers who say it is their cheapest way to clear land.","Asap pembakaran terbuka di seluruh rantau telah menolak indeks kualiti udara ke tahap tidak sihat. Sekolah bertanya sama ada perlu ditutup dan hospital melaporkan lebih banyak aduan pernafasan. Penguatkuasaan terhadap pembakaran terbuka akan menyakitkan hati petani yang berkata ia kaedah paling murah membersihkan tanah."],
[[["Enforce a ban on open burning","Kuatkuasakan larangan pembakaran terbuka"],["Air quality improves within days. Some farmers are fined and complain they were singled out.","Kualiti udara bertambah baik dalam beberapa hari. Sebahagian petani didenda dan mengadu mereka disasarkan."],{a:3,u:1,e:-1}],
 [["Hand out masks and advisories only","Edar pelitup muka dan nasihat sahaja"],["It costs little and looks caring, but the smoke stays and so do the complaints.","Kosnya kecil dan nampak prihatin, tetapi asap kekal dan begitu juga aduan."],{a:-1,mo:-10}],
 [["Wait for the weather to change","Tunggu cuaca berubah"],["Rain eventually helps, but not before parents and doctors lose patience.","Hujan akhirnya membantu, tetapi bukan sebelum ibu bapa dan doktor kehilangan kesabaran."],{a:-5,u:2}]],{adv:"hlt",rec:0,reg:["sib","btu","mri"]}),
/* ----- new situations ----- */
E("pan","eco",["Pan Borneo works fall behind","Kerja Pan Borneo ketinggalan"],
["Sections of the Pan Borneo highway are months behind schedule. Drivers complain of detours and dust, and transporters say delays are raising costs.","Beberapa seksyen lebuh raya Pan Borneo ketinggalan beberapa bulan. Pemandu mengadu lencongan dan habuk, dan pengangkut berkata kelewatan menaikkan kos."],
[[["Summon the contractors and set penalties","Panggil kontraktor dan tetapkan penalti"],["The contractors promise to catch up. Progress is real but slow, and some warn of legal disputes.","Kontraktor berjanji mengejar. Kemajuan nyata tetapi perlahan, dan ada yang memberi amaran pertikaian undang-undang."],{a:2,e:2,u:-1}],
 [["Add state money to speed things up","Tambah dana negeri untuk mempercepat"],["Crews work extra shifts and sections reopen early. The treasury pays for the speed.","Pekerja bekerja syif tambahan dan seksyen dibuka awal. Perbendaharaan menanggung kos kelajuan."],{mo:-50,e:4,a:3}],
 [["Ask people to be patient","Minta rakyat bersabar"],["Patience wears thin. Travellers post photos of the worst stretches.","Kesabaran menipis. Pengembara memuat naik gambar bahagian paling teruk."],{a:-4,u:2}]],{adv:"inf",rec:0,reg:["srk","sib","muk","btu"]}),
E("gawai","soc",["Festival season funding","Pembiayaan musim perayaan"],
["Gawai is near and community groups ask for support for open houses, cultural events and travel for people returning to the longhouses. Budgets are tight but the season matters to many families.","Gawai hampir tiba dan kumpulan komuniti meminta sokongan untuk rumah terbuka, acara budaya dan perjalanan pulang ke rumah panjang. Bajet ketat tetapi musim ini penting bagi ramai keluarga."],
[[["Fund festival grants and travel aid","Biayai geran perayaan dan bantuan perjalanan"],["Longhouses fill with visitors and the mood is warm. The cost is modest but visible.","Rumah panjang dipenuhi pengunjung dan suasana meriah. Kosnya sederhana tetapi ketara."],{mo:-25,a:4,u:-2}],
 [["Small cultural grants only","Geran budaya kecil sahaja"],["Organisers manage with less. Most people accept it, a few grumble.","Penganjur menguruskan dengan kurang. Kebanyakan menerima, segelintir merungut."],{mo:-10,a:1}],
 [["No extra funding this year","Tiada dana tambahan tahun ini"],["The decision saves money but is mentioned in many speeches by rivals.","Keputusan ini menjimatkan wang tetapi disebut dalam banyak ucapan pesaing."],{a:-3,u:1}]],{reg:["kap","sri","bet","sib"]}),
E("hydro","eco",["Hydrogen bus pilot","Perintis bas hidrogen"],
["Engineers propose expanding a hydrogen bus pilot to more towns. It could cut fuel costs and attract investors, but the stations are expensive and the technology is still young.","Jurutera mencadangkan perintis bas hidrogen diperluaskan ke lebih banyak bandar. Ia boleh mengurangkan kos bahan api dan menarik pelabur, tetapi stesen mahal dan teknologinya masih baharu."],
[[["Expand the pilot","Perluaskan perintis"],["New routes open and commuters are curious. Maintenance costs turn out higher than hoped.","Laluan baharu dibuka dan penumpang ingin tahu. Kos penyelenggaraan lebih tinggi daripada dijangka."],{mo:-40,e:4,a:2,pol:"Hydrogen transport pilot|Energy"}],
 [["Bring in a private partner","Bawa masuk rakan swasta"],["The partner funds part of the build. The state keeps less control.","Rakan membiayai sebahagian pembinaan. Negeri mengekalkan kawalan lebih sedikit."],{e:2,mo:10,m:-1}],
 [["Wait and watch","Tunggu dan lihat"],["Nothing breaks and nothing changes. Investors look elsewhere.","Tiada apa rosak dan tiada apa berubah. Pelabur memandang tempat lain."],{e:-1}]],{adv:"inf",rec:1,reg:["kch","btu","mri"]}),
E("ferry","soc",["Ferry safety scare on the river","Kecemasan keselamatan feri di sungai"],
["An overcrowded express boat nearly capsized on the river, and passengers' videos are spreading online. Operators say inspections are costly; commuters say they have no other way to travel.","Sebuah bot ekspres sesak hampir terbalik di sungai dan video penumpang tersebar dalam talian. Pengendali berkata pemeriksaan mahal; penumpang berkata tiada cara lain untuk bergerak."],
[[["Order immediate safety inspections","Arahkan pemeriksaan keselamatan segera"],["Several boats are pulled from service for repairs. Passengers feel safer, but fares rise a little.","Beberapa bot ditarik daripada perkhidmatan untuk dibaiki. Penumpang rasa lebih selamat, tetapi tambang naik sedikit."],{a:3,mo:-15,u:-1}],
 [["Create a passenger safety fund","Wujudkan dana keselamatan penumpang"],["Operators get help to upgrade, and the headlines turn positive.","Pengendali dibantu menaik taraf, dan tajuk berita menjadi positif."],{a:4,mo:-30,e:1}],
 [["Say the boats are fine","Kata bot-bot itu selamat"],["The videos keep circulating and people ask who is responsible.","Video terus beredar dan rakyat bertanya siapa bertanggungjawab."],{a:-5,u:3}]],{adv:"sec",rec:0,reg:["sib","srk","kap","muk"]}),
E("clinic","soc",["Clinics short of doctors","Klinik kekurangan doktor"],
["Remote clinics report long waits and empty doctor posts. Villagers travel for hours by boat or road to see a medical officer, and some skip treatment altogether.","Klinik terpencil melaporkan penantian lama dan jawatan doktor kosong. Penduduk kampung berjalan berjam-jam dengan bot atau jalan raya untuk berjumpa pegawai perubatan, dan ada yang tidak berubat langsung."],
[[["Fund flying doctor and boat clinic teams","Biayai pasukan doktor terbang dan klinik bot"],["Teams reach isolated villages and trust grows. It is a steady monthly cost.","Pasukan sampai ke kampung terpencil dan kepercayaan meningkat. Ia kos bulanan yang tetap."],{a:5,mo:-35,u:-2,pol:"Remote health outreach|Health"}],
 [["Offer allowances to recruit doctors","Tawarkan elaun untuk merekrut doktor"],["A few doctors accept the posts, though not as many as hoped.","Beberapa doktor menerima jawatan, walaupun tidak sebanyak yang diharapkan."],{a:2,mo:-20}],
 [["Ask the federal health ministry","Minta kementerian kesihatan Persekutuan"],["Help is promised but slow to come.","Bantuan dijanjikan tetapi lambat tiba."],{a:-1,m:-1}]],{adv:"hlt",rec:0,reg:["kap","lmb","mri","sri"]}),
E("school","soc",["Students struggle to reach school","Pelajar sukar sampai ke sekolah"],
["Parents in remote districts say children walk for hours or depend on expensive boats to reach school. Attendance drops in the wet season. Teachers say hostels and transport support would help.","Ibu bapa di daerah terpencil berkata anak-anak berjalan berjam-jam atau bergantung kepada bot mahal untuk ke sekolah. Kehadiran menurun pada musim hujan. Guru berkata asrama dan bantuan pengangkutan akan membantu."],
[[["Fund school boats and transport","Biayai bot dan pengangkutan sekolah"],["Attendance improves within a term and parents are relieved.","Kehadiran bertambah baik dalam satu penggal dan ibu bapa lega."],{a:4,mo:-25,u:-1,e:1}],
 [["Build hostels in key villages","Bina asrama di kampung utama"],["Hostels take time to open, but families welcome the plan.","Asrama mengambil masa untuk dibuka, tetapi keluarga mengalu-alukan rancangan itu."],{a:3,mo:-40,pol:"Rural school hostels|Education"}],
 [["Leave it to schools to adapt","Biar sekolah menyesuaikan diri"],["Some schools improvise. Many families feel unheard.","Sebahagian sekolah berikhtiar sendiri. Ramai keluarga rasa tidak didengari."],{a:-3,u:1}]],{adv:"edu",rec:0,reg:["kap","lmb","sri","mri"]}),
E("windfall","eco",["Revenue beats the forecast","Hasil melebihi ramalan"],
["Strong energy revenue has left the state with an unexpected surplus. Everyone has an idea for it: pay down debt, build rural projects, or keep a reserve for rainy days.","Hasil tenaga yang kukuh meninggalkan negeri dengan lebihan tidak dijangka. Semua orang ada cadangan: bayar hutang, bina projek luar bandar, atau simpan rizab untuk hari susah."],
[[["Pay down debt","Bayar hutang"],["Interest costs ease and rating agencies approve. Voters notice little.","Kos faedah berkurang dan agensi penarafan menyetujui. Pengundi hampir tidak perasan."],{db:-120,e:1,a:1}],
 [["Spend on rural projects","Belanja untuk projek luar bandar"],["Roads and clinics get a boost and local leaders are pleased.","Jalan dan klinik mendapat dorongan dan pemimpin tempatan gembira."],{a:5,e:3,mo:-20}],
 [["Keep a cash reserve","Simpan rizab tunai"],["The treasury feels safer and finance staff relax.","Perbendaharaan rasa lebih selamat dan kakitangan kewangan lega."],{mo:100}]],{when:s=>s.lv.economy>55,adv:"fin",rec:0}),
E("landrul","soc",["Court ruling on customary land","Keputusan mahkamah tentang tanah adat"],
["A court has ruled in favour of villagers in a native customary land case. Companies worry about other projects, while community leaders say the state must respect the ruling.","Mahkamah memutuskan memihak kepada penduduk kampung dalam kes tanah adat. Syarikat risau tentang projek lain, manakala pemimpin komuniti berkata negeri mesti menghormati keputusan itu."],
[[["Respect the ruling and compensate fairly","Hormati keputusan dan beri pampasan adil"],["Villagers praise the state. Investors ask for clearer rules.","Penduduk kampung memuji negeri. Pelabur meminta peraturan lebih jelas."],{a:3,m:2,mo:-30,e:-1}],
 [["Appeal the decision","Rayu keputusan"],["The appeal calms companies but angers communities.","Rayuan menenangkan syarikat tetapi memarahkan komuniti."],{a:-3,u:3,e:1}],
 [["Hold talks on a fair framework","Adakan rundingan rangka kerja adil"],["A working group is set up. It will take time, but both sides join it.","Kumpulan kerja ditubuhkan. Ia akan mengambil masa, tetapi kedua-dua pihak menyertainya."],{a:1,u:-1,pol:"Customary land framework|Land"}]],{adv:"land",rec:2,reg:["btu","mri","muk","lmb"]}),
E("bario","eco","Beras Bario terkandas di lapangan terbang",
"Musim menuai di Bario hampir tamat dan lebih 200 tan beras bukit belum sempat dihantar ke Miri kerana penerbangan perintis dibatalkan tiga kali dalam dua minggu akibat kabus tebal. Petani menyatakan kos kargo udara sudah tiga kali ganda harga biasa, manakala beras yang disimpan mula diserang kumbang.||Sebuah koperasi tempatan berkata hotel-hotel di Miri dan Kuching sanggup membayar premium, tetapi hanya jika bekalan tiba sebelum hujung bulan. Pegawai daerah pula mengingatkan bahawa jalan balak ke Bario masih terlalu licin untuk lori besar.",
[["Beri subsidi kargo udara khas untuk petani Bario","Pesawat kargo mengangkut beras dalam masa tiga hari dan koperasi sempat memenuhi tempahan hotel. Petani menyebut keputusan ini sebagai tanda negeri benar-benar mengenali kawasan pedalaman, dan harga beras Bario di pasar Miri naik sedikit.||Namun bil kargo lebih tinggi daripada anggaran. Pegawai kewangan mengingatkan bahawa jika subsidi ini diulang setiap musim, ia akan menjadi komitmen tetap yang sukar ditarik balik.",{a:4,mo:-25,e:2,u:-1}],
 ["Baiki laluan jalan balak dengan kontraktor tempatan","Kerja pembaikan bermula seminggu kemudian dan pemandu lori tempatan mendapat kontrak kecil, yang memberi rezeki tambahan kepada beberapa keluarga. Jalan dibuka separa sebelum hujan lebat berikutnya.||Kemajuan agak perlahan, dan penduduk Bario merungut bahawa penyelesaian ini tidak membantu musim ini. Kumpulan alam sekitar pula bertanya sama ada laluan balak patut dijadikan jalan tetap.",{mo:-35,e:3,a:1,pol:"Bario road upgrade|Infrastructure"}],
 ["Bina pusat jualan dalam talian untuk hasil pedalaman","Pegawai digital melatih belia Bario menggambar, membungkus dan menjual beras serta kraf secara dalam talian. Tempahan pertama datang dari Kuala Lumpur dan Singapura dalam dua minggu.||Kesannya kecil pada musim ini kerana beras sedia ada masih terkandas, tetapi koperasi berasa yakin masa depan lebih terbuka, dan pelancong mula bertanya tentang lawatan ke dataran tinggi.",{mo:-15,e:2,a:2,pol:"Highland e-commerce hub|Digital"}]],{adv:"inf",rec:2,reg:["mri"]}),
E("sibumkt","eco","Peniaga pasar tertekan akibat pembaikan besar",
"Pasar pusat di Sibu dijadualkan ditutup separa selama lapan bulan untuk kerja naik taraf bumbung dan sistem pembetungan. Kira-kira 140 peniaga ikan, sayur dan kraf diminta berpindah ke tapak sementara di tepi sungai yang jauh daripada pelanggan tetap, dan sebahagian peniaga berkata pendapatan mereka sudah jatuh separuh sejak minggu lalu.||Persatuan peniaga membawa petisyen bertandatangan ke pejabat anda. Pihak majlis pula berkata kontrak sudah ditandatangani dan sebarang penangguhan akan menambah kos kepada pembayar cukai.",
[["Bina tapak sementara berbumbung berdekatan dan beri rebat sewa","Tapak baharu siap dalam sembilan hari dengan bumbung dan lampu, dan peniaga mula kembali mendapat pelanggan. Seorang penjual ikan memberitahu pemberita bahawa kali ini mereka merasa didengari.||Perbelanjaan lebih tinggi daripada yang dirancang, dan pegawai majlis mengeluh bahawa tapak sementara memerlukan pengawasan harian.",{mo:-30,a:4,u:-2,e:1}],
 ["Teruskan jadual tanpa perubahan","Kerja bermula tepat pada masanya dan majlis menjimatkan kos. Namun peniaga membuat sekatan simbolik di pintu masuk dan gambar kerusi kosong tersebar dalam talian.||Beberapa peniaga menutup gerai secara kekal dan pembangkang menyebutnya sebagai bukti kerajaan lebih mementingkan kontrak daripada rakyat kecil.",{a:-5,u:3,mo:5}],
 ["Pecahkan kerja kepada dua fasa supaya separuh pasar kekal buka","Peniaga bersetuju dengan pelan dua fasa, walaupun kos pembinaan sedikit meningkat dan siap lebih lambat. Pelanggan tetap masih boleh membeli di separuh pasar yang dibuka.||Kontraktor merungut tentang kerja yang lebih rumit, tetapi tiada bantahan besar berlaku.",{mo:-20,a:2,e:-1,u:-1}]],{adv:"fin",rec:2,reg:["sib"]}),
E("bakunpower","soc","Rumah panjang masih bergantung kepada penjana diesel",
"Seorang ketua rumah panjang di Kapit menulis surat terbuka bahawa 26 rumah panjang di sepanjang sungai masih bergantung kepada penjana diesel. Harga diesel naik dan bekalan hanya sampai dua kali seminggu dengan bot. Anak-anak tidak boleh belajar pada waktu malam dan peti sejuk vaksin di klinik desa pernah hampir rosak.||Syarikat utiliti berkata sambungan grid terlalu mahal untuk laluan sungai berbukit, tetapi mencadangkan sistem solar mikro-grid sebagai alternatif. Pegawai daerah mahu keputusan sebelum musim hujan menutup laluan bot.",
[["Biayai solar mikro-grid untuk semua 26 rumah panjang","Pasukan teknikal tiba dengan bot berpanel solar dan memasang sistem satu demi satu. Dalam masa dua bulan anak-anak membuat kerja rumah di bawah lampu terang, dan klinik desa mendapat peti sejuk yang stabil.||Kosnya besar dan perbendaharaan terasa tekanannya, tetapi ketua rumah panjang menyebut ini sebagai keputusan paling bermakna dalam sedekad.",{mo:-55,a:6,u:-3,e:2,pol:"Solar micro-grid programme|Energy"}],
 ["Mulakan dengan lima rumah panjang sebagai projek perintis","Lima rumah panjang menerima sistem solar dalam sebulan dan hasilnya dipuji. Yang lain berasa dikecualikan dan beberapa ketua menulis surat memohon giliran segera.||Pegawai menyatakan pelaksanaan berperingkat lebih mudah dikawal, tetapi tekanan politik akan meningkat setiap minggu sehingga semua mendapat giliran.",{mo:-20,a:3,e:1}],
 ["Beri subsidi diesel sementara sahaja","Penjana kembali berjalan lebih lama dan penduduk lega buat sementara. Namun subsidi itu hilang bersama diesel yang dibakar, dan tiada apa berubah dari segi struktur.||Ketua rumah panjang berterima kasih secara sopan, tetapi menambah bahawa mereka mahukan penyelesaian kekal, bukan bantuan setiap musim.",{mo:-12,a:1,u:-1}]],{adv:"inf",rec:0,reg:["kap","bet"]}),
E("lngplant","eco","Pemberhentian kerja di kilang Bintulu",
"Sebuah kilang pemprosesan di kawasan perindustrian Bintulu mengumumkan akan menghentikan satu barisan pengeluaran selama enam bulan dan berkemungkinan memberhentikan 380 pekerja kontrak. Kesatuan sekerja berkata ramai daripadanya orang Bintulu dan Kemena yang masih membayar pinjaman rumah dan kereta.||Pengurusan kilang menyatakan permintaan eksport lemah dan mereka mungkin menukar keputusan jika kerajaan negeri menawarkan insentif tenaga atau latihan semula. Pembangkang menggunakan isu ini dalam hantaran media sosial setiap hari.",
[["Tawarkan insentif tenaga dengan syarat pekerja dikekalkan","Syarikat bersetuju membatalkan sebahagian besar pemberhentian dan hanya 40 pekerja dilepaskan secara sukarela. Kesatuan memuji langkah ini dan suasana di pintu kilang tenang semula.||Namun pelabur lain mula bertanya sama ada insentif serupa akan ditawarkan kepada mereka, dan pegawai kewangan risau tentang preseden.",{mo:-40,e:4,a:3,u:-2}],
 ["Biayai latihan semula dan padanan kerja","Pusat latihan di Bintulu menerima 200 peserta pertama dalam dua minggu, dan beberapa syarikat setempat berjanji menemuduga mereka. Pekerja berasa ada jalan keluar.||Walau begitu, kilang tetap menutup barisan pengeluaran itu dan sebahagian pekerja berasa latihan tidak membayar ansuran rumah mereka bulan ini.",{mo:-25,a:2,e:1,u:-1,pol:"Worker retraining scheme|Social"}],
 ["Kata ini keputusan komersial syarikat","Kenyataan itu dianggap dingin. Kesatuan mengadakan perhimpunan kecil di luar pejabat anda dan pemberhentian diteruskan mengikut jadual.||Pelabur menyukai ketegasan, tetapi pengundi di Bintulu menghafal ayat itu, dan pembangkang menjadikannya tajuk kempen.",{a:-4,u:3,e:-3}]],{adv:"fin",rec:1,reg:["btu"]}),
E("kchtransit","eco","Perdebatan laluan pengangkutan awam Kuching",
"Penduduk Samariang, Batu Kawah dan Batu Kitang mahu laluan bas bandar dilanjutkan ke kawasan perumahan baharu kerana perjalanan ke tempat kerja kini mengambil lebih sejam pada waktu puncak. Peniaga di tengah bandar pula bimbang laluan baharu akan menghilangkan tempat letak kereta di hadapan kedai mereka.||Pengendali berkata lanjutan hanya berbaloi jika kerajaan menanggung separuh kos kenderaan baharu. Wakil rakyat bagi kawasan terbabit meminta jawapan sebelum sidang akan datang.",
[["Lanjutkan laluan dan beli bas tambahan","Laluan baharu dibuka selepas dua bulan dan penumpang bertambah setiap minggu. Pekerja kilang di Samarahan menyebutnya sebagai penjimatan masa dua jam sehari.||Beberapa peniaga di tengah bandar merungut tentang kehilangan tempat letak kereta, dan kos penyelenggaraan menambah beban bajet.",{mo:-45,a:4,e:3,u:-2,pol:"Urban bus route extension|Infrastructure"}],
 ["Bina kawasan letak kereta ulang-alik dahulu","Kawasan letak kereta di pinggir bandar siap dalam sebulan dan sebahagian pemandu mula menukar kepada bas sedia ada. Pengendali berpuas hati kerana tiada kos kenderaan baharu.||Penduduk kawasan perumahan baharu berasa masih dilupakan dan menunggu keputusan tentang laluan mereka.",{mo:-25,a:2,e:1}],
 ["Tangguhkan sehingga kajian trafik siap","Kajian dijadualkan lapan minggu dan semua pihak diminta bersabar. Peniaga tengah bandar lega, tetapi penumpang yang menunggu di perhentian berasa diabaikan.||Pembangkang menyebut kajian itu sebagai alasan untuk tidak membuat keputusan.",{a:-3,u:1,mo:-3}]],{adv:"inf",rec:0,reg:["kch","smh"]}),
E("pepperlabour","eco","Pekebun lada kekurangan pekerja",
"Menjelang musim memetik lada di Betong, Sarikei dan Sri Aman, pekebun kecil mengadu bahawa ramai pekerja asing tidak kembali selepas kontrak tamat, manakala belia kampung lebih suka bekerja di bandar. Lada yang masak mula gugur di kebun.||Persatuan pekebun meminta kuota pekerja ditambah dan geran jentera pemetik. Pegawai pertanian berkata geran jentera mahal dan mengambil masa, manakala kelulusan kuota terletak pada kerajaan Persekutuan.",
[["Berunding dengan Persekutuan untuk kuota musim","Pegawai negeri berulang-alik ke Putrajaya dan kuota musim diluluskan separuh daripada permintaan. Sebahagian pekebun sempat memetik, tetapi yang lain terlepas musim.||Rundingan itu berjaya tanpa pertengkaran awam, tetapi ada suara di negeri yang berkata kebergantungan kepada kuota Persekutuan tidak sihat.",{m:-1,e:2,a:2,u:-1}],
 ["Beri geran separa untuk jentera pemetik","Geran diluluskan dan 90 pekebun menerima mesin dalam dua bulan. Mereka yang menerima berasa bangga, tetapi yang menunggu giliran berasa cemburu.||Kos geran lebih besar daripada anggaran awal dan pegawai menyatakan pelaburan ini baru memberi pulangan selepas dua musim.",{mo:-30,e:3,a:3,pol:"Pepper mechanisation grant|Agriculture"}],
 ["Lancarkan program upah belia untuk memetik lada","Program menarik 300 belia dari bandar yang mahu pendapatan tambahan semasa cuti. Sebahagian kebun terselamat dan pekebun terkejut dengan semangat anak muda.||Namun belia hanya tersedia hujung minggu, dan pekebun masih memerlukan pekerja sepenuh masa.",{mo:-15,a:2,u:-2,e:1}]],{adv:"land",rec:1,reg:["srk","bet","sri"]}),
E("teacherhard","soc","Guru pedalaman minta elaun tambahan",
"Kesatuan guru melaporkan bahawa tujuh sekolah di pedalaman Kapit dan Limbang kehilangan guru sains dan matematik tahun ini kerana pertukaran, dan tiada pengganti tetap. Seorang guru berkata beliau mengambil bot dua hari untuk pulang bertemu keluarga.||Ibu bapa bimbang tentang peperiksaan akhir tahun. Kementerian Persekutuan mengurus guru, tetapi negeri boleh menawarkan elaun tambahan dan perumahan.",
[["Beri elaun dan perumahan negeri untuk guru pedalaman","Dalam sebulan lima guru baharu menerima tawaran dan beberapa guru sedia ada menarik balik permohonan pertukaran. Ibu bapa menghantar kuih ke sekolah sebagai tanda terima kasih.||Pegawai Persekutuan agak tidak selesa kerana negeri melangkah ke bidang mereka, tetapi tidak membantah secara terbuka.",{mo:-35,a:4,u:-2}],
 ["Biayai tuisyen dalam talian dengan pusat internet komuniti","Pelajar menyertai kelas dalam talian dari balai raya yang kini ada sambungan lebih baik. Guru dari bandar mengajar dua kali seminggu dan pelajar menyukai suasana baharu itu.||Namun isyarat tidak stabil pada hari hujan, dan ibu bapa masih mahukan guru yang hadir di sekolah.",{mo:-20,a:3,e:1}],
 ["Minta Persekutuan menyelesaikan sepenuhnya","Surat dihantar dan jawapan mesra diterima tetapi tanpa tarikh. Sekolah terus menunggu dan guru yang tinggal kelihatan keletihan.||Ibu bapa menulis kepada akhbar bahawa negeri sepatutnya bertindak sendiri.",{a:-2,m:-1}]],{adv:"edu",rec:0,reg:["kap","lmb"]}),
E("bridge","eco","Jambatan lama diisytiharkan tidak selamat",
"Jurutera daerah menemui keretakan di tiang jambatan lama yang menghubungkan dua kampung di Sri Aman, dan lori berat sudah dilarang melaluinya. Dua pengusaha bot tambang sanggup menyeberangkan penduduk, tetapi tambangnya tinggi.||Seorang pelajar tahun akhir berkata dia terpaksa menaiki bot setiap pagi untuk ke sekolah. Kontraktor menawarkan penyelesaian cepat dengan kos lebih tinggi, atau penyelesaian lebih murah dengan masa lebih lama.",
[["Bina jambatan sementara dan baiki dengan cepat","Jambatan sementara siap dalam dua minggu dan lori kecil boleh melalui semula. Peniaga dan pelajar lega, dan kerja pembaikan sebenar bermula serentak.||Kos pantas ini besar, dan beberapa pegawai berkata sebahagian wang itu boleh digunakan di tempat lain.",{mo:-50,a:4,u:-2,e:2}],
 ["Lakukan pembaikan berperingkat dengan kos lebih rendah","Kerja berjalan perlahan dan jambatan hanya dibuka separa selepas sebulan. Penduduk bersabar tetapi mengeluh tentang kesesakan di tepi sungai.||Perbelanjaan terkawal dan juruteranya berpuas hati, tetapi tiada sesiapa menyebut keputusan ini sebagai bijak.",{mo:-25,a:1,u:1}],
 ["Kekalkan larangan dan sediakan bot percuma","Bot percuma beroperasi setiap pagi dan petang dan pelajar tiba tepat masa. Penduduk menghargai bantuan itu, tetapi bot penuh sesak pada hujung minggu.||Jambatan masih belum dibaiki, dan jurutera memberi amaran keretakan boleh bertambah.",{mo:-15,a:2,e:-1}]],{adv:"inf",rec:0,reg:["sri","bet"]}),
E("scam","soc","Gelombang penipuan dalam talian",
"Dalam tiga minggu, polis menerima lebih 120 laporan penipuan telefon dan aplikasi pesanan di Kuching, Samarahan dan Sibu. Ramai mangsa ialah warga emas dan pesara yang kehilangan simpanan puluhan ribu ringgit, dan seorang pesara berkata beliau hilang wang simpanan pengebumiannya.||Bank berkata mereka mengesan transaksi pelik tetapi tidak boleh menyekat tanpa arahan. Pegawai keselamatan mencadangkan kempen kesedaran, pusat bantuan 24 jam, atau kerjasama dengan bank dan telco.",
[["Wujudkan pusat bantuan 24 jam dan kempen komuniti","Talian bantuan menerima 300 panggilan dalam minggu pertama dan beberapa transaksi dihentikan sebelum wang hilang. Sukarelawan mengajar warga emas di dewan komuniti dan pusat jagaan.||Kos operasi agak tinggi, tetapi akhbar memuji langkah ini sebagai contoh perkhidmatan yang benar-benar membantu.",{mo:-25,a:4,u:-2,pol:"Anti-scam helpline|Social"}],
 ["Bentuk pasukan khas bersama bank dan telco","Pasukan itu dapat menyekat beberapa akaun penipu dalam seminggu dan dua suspek ditahan. Bank memuji kerjasama yang lebih pantas.||Kempen kesedaran awam kurang menonjol, dan sebahagian mangsa berasa sudah terlambat untuk mereka.",{mo:-15,a:3,e:1}],
 ["Keluarkan amaran awam sahaja","Amaran dihantar melalui media sosial dan radio. Sebahagian orang peka, tetapi warga emas yang tidak menggunakan media sosial tidak terjangkau.||Laporan penipuan terus meningkat dan wakil rakyat pembangkang bertanya mengapa tiada tindakan lebih serius.",{a:-1,u:1,mo:-2}]],{adv:"sec",rec:0,reg:["kch","smh","sib"]}),
E("hornbill","env","Burung kenyalang dan jalan baharu",
"Pakar hidupan liar menemui sarang burung kenyalang di hutan yang bakal dilalui cadangan jalan menghubungkan dua rumah panjang berhampiran Batang Ai. Penduduk setempat mahukan jalan itu kerana kini terpaksa menaiki bot sehari penuh untuk ke klinik.||Pertubuhan alam sekitar menawarkan laluan alternatif yang lebih panjang tetapi menjejaskan beberapa ladang. Pelancong yang datang melihat burung kenyalang juga menyumbang pendapatan kepada rumah panjang.",
[["Ubah laluan walaupun lebih panjang","Jalan dilukis semula dan pakar alam sekitar menyatakan kelegaan. Ladang yang terjejas dibayar pampasan, tetapi beberapa pemilik berkata jumlahnya tidak memadai.||Kos pembinaan meningkat dan jalan siap lebih lambat, tetapi penduduk bersetuju selepas dijelaskan.",{mo:-30,a:3,u:-1,e:-1}],
 ["Teruskan laluan asal dengan pagar perlindungan","Kerja berjalan pantas dan penduduk gembira kerana jalan siap lebih awal. Pertubuhan alam sekitar berarak dan gambar sarang yang terganggu tersebar.||Beberapa pelancong membatalkan tempahan dan nama negeri disebut dalam laporan antarabangsa.",{mo:-15,a:-1,u:2,e:1}],
 ["Bina jambatan gantung ekopelancongan","Jalan kecil dan jambatan gantung dibina dengan teknologi ringan dan kesan terhadap kenyalang kecil. Rumah panjang membuka homestay dan pemandu pelancong tempatan.||Kosnya tinggi, dan jalan tidak boleh dilalui kenderaan besar, jadi sebahagian penduduk masih mahukan jalan sebenar.",{mo:-35,a:3,e:3,pol:"Hornbill ecotourism trail|Environment"}]],{adv:"land",rec:2,reg:["sri","kap"]}),
E("audit","pol","Laporan audit peruntukan tidak digunakan",
"Laporan audit dalaman menunjukkan sembilan projek kecil di beberapa bahagian tidak dibelanjakan walaupun peruntukan diluluskan sejak tahun lepas, termasuk dua perigi komuniti dan sebuah balai raya. Wartawan menyiarkan senarai projek dan meminta jawapan.||Beberapa ketua jabatan berkata masalah itu berpunca daripada birokrasi dan kelewatan kontraktor. Wakil rakyat pembangkang meminta laporan penuh dikeluarkan.",
[["Siarkan laporan penuh dan tetapkan tarikh siap","Laporan diterbitkan dan setiap projek diberi tarikh baharu. Akhbar memuji ketelusan, dan penduduk menyemak laman web untuk melihat kemajuan.||Beberapa ketua jabatan berasa dimalukan secara terbuka, dan hubungan dalam kerajaan agak tegang buat sementara.",{a:3,u:-1,w:1,l:-1,pol:"Project delivery tracker|Governance"}],
 ["Kembalikan peruntukan dan tukar kontraktor","Peruntukan ditarik balik dan kontraktor baharu dilantik dalam dua minggu. Beberapa projek bermula semula dengan cepat.||Kontraktor lama membuat aduan dan sebahagian ahli parti berasa mereka dihukum tanpa dibicarakan.",{mo:-10,a:2,l:-1}],
 ["Anggap laporan ini perkara dalaman","Kenyataan ringkas dikeluarkan dan isu itu seolah-olah reda. Namun seorang wartawan menyiarkan wawancara dengan penduduk yang masih menunggu perigi mereka.||Pembangkang menyebut ini bukti kerajaan menyembunyikan perkara, dan isu ini akan dibangkitkan lagi.",{a:-4,u:2,w:-1}]],{adv:"fin",rec:0}),
E("gascyl","soc","Kekurangan gas memasak di pedalaman",
"Beberapa kedai runcit di Belaga, Lawas dan pedalaman Baram melaporkan tong gas kosong tidak dapat diisi kerana lori pengedar tidak sampai selepas jalan runtuh. Keluarga kembali memasak dengan kayu api, dan harga tong gas di kedai persendirian naik hampir dua kali ganda.||Pengedar berkata mereka rugi jika menghantar ke tempat jauh tanpa bantuan kos. Pejabat daerah menawarkan bot dan helikopter sewa, tetapi kosnya tinggi.",
[["Biayai penghantaran khas ke kawasan terputus","Bot dan helikopter mengangkut tong gas ke tiga lokasi dalam seminggu. Keluarga menyambut dengan lega, dan harga di kedai menurun semula.||Kos penghantaran besar bagi jumlah yang kecil, tetapi pegawai daerah berkata nilainya terasa dalam mutu hidup.",{mo:-30,a:4,u:-2}],
 ["Tetapkan harga siling dan beri insentif pengedar","Harga siling diumumkan dan pengedar menerima insentif kecil. Sebahagian kedai mematuhi, tetapi ada yang berhenti menjual kerana tidak untung.||Bekalan agak pulih di kawasan yang mudah dicapai, tetapi kawasan terpencil masih kekurangan.",{mo:-12,a:2,e:-1}],
 ["Galakkan penggunaan dapur biojisim komuniti","Dapur biojisim dipasang di dua balai raya sebagai percubaan. Penduduk berminat tetapi menyatakan ia mengambil masa untuk membiasakan diri.||Pakar kesihatan menasihatkan pengudaraan yang baik, dan sebahagian keluarga berasa ini langkah mundur.",{mo:-18,a:1,e:1,u:1}]],{adv:"inf",rec:0,reg:["kap","lmb","mri"]}),

function chart(){
 const radii=[130,166,202,238,274],sum=radii.reduce((a,b)=>a+b,0),n=S.seats.length;
 const c=radii.map(r=>Math.round(n*r/sum));c[4]+=n-c.reduce((a,b)=>a+b,0);
 const pos=[];radii.forEach((r,i)=>{for(let j=0;j<c[i];j++){const a=Math.PI-Math.PI*j/(c[i]-1);pos.push({a,x:300+r*Math.cos(a),y:300-r*Math.sin(a)})}});
 pos.sort((p,q)=>q.a-p.a);
 const pi={};S.parties.forEach((p,i)=>pi[p.id]=i);
 const g=s=>P(s.party)&&P(s.party).coal==="gov"?0:1;
 const ord=S.seats.map((s,i)=>({s,i})).sort((a,b)=>g(a.s)-g(b.s)||(pi[a.s.party]??99)-(pi[b.s.party]??99)||a.i-b.i);
 const cs=ord.map((o,k)=>{const s=o.s,p=P(s.party),ch=s.party!==BASE.seats[o.i].party;
  return `<circle class="seat" data-i="${o.i}" data-p="${esc(s.party)}" cx="${pos[k].x.toFixed(1)}" cy="${pos[k].y.toFixed(1)}" r="13" fill="${p?p.color:"#ccc"}" opacity="${flt&&s.party!==flt?.15:1}" ${ch?'stroke="#000" stroke-dasharray="3 2" stroke-width="2"':""} tabindex="0" role="button" aria-label="${esc(s.name)} ${p?esc(p.abbr):""}"/>`}).join("");
 const m=maj(),am=(pos[m-1].a+(pos[m]||pos[m-1]).a)/2,cx=Math.cos(am),sy=Math.sin(am);
 const ln=`<line x1="${(300+105*cx).toFixed(1)}" y1="${(300-105*sy).toFixed(1)}" x2="${(300+298*cx).toFixed(1)}" y2="${(300-298*sy).toFixed(1)}" stroke="#111" stroke-width="2" stroke-dasharray="6 4" opacity=".75" pointer-events="none"/><text x="${(300+298*cx).toFixed(1)}" y="${(300-298*sy-8).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#111">${t("majLine")}: ${m}</text>`;
 return `<svg class="ch" viewBox="0 -25 600 345" role="group" aria-label="${t("chart")}">${cs}${ln}<text x="300" y="285" text-anchor="middle" font-size="40" font-weight="700" fill="#1b2433">${n}</text><text x="300" y="305" text-anchor="middle" font-size="13" fill="#667085">${t("seats")}</text></svg><p class="mu" style="text-align:center">${t("majNote")}</p>`;
}

function ripple(fx,ev,r){const o=[],l=S.lv,f=fin(),i=L(),pk=a=>a[Math.floor(Math.random()*a.length)];
 r.out.forEach(([k,v])=>{const P=RP[k];if(!P)return;const s=pk(v>0?P.u:P.d)[i],big=Math.abs(v)>=(k==="money"||k==="debt"?40:5);
  o.push((big?(i?"Kesannya besar. ":"The effect is large. "):"")+s)});
 const O=[];
 if(l.money<120)O.push(["Looking ahead, the cash balance is now thin, so the next unexpected bill could force borrowing.","Melihat ke depan, baki tunai kini nipis, jadi bil tidak dijangka seterusnya boleh memaksa pinjaman."]);
 if(l.unrest>=65)O.push(["Security advisers warn that the public mood is tense and a small incident could spread quickly.","Penasihat keselamatan memberi amaran suasana awam tegang dan satu kejadian kecil boleh merebak dengan cepat."]);
 if(l.approval<=40)O.push(["Public support is low and rival parties are preparing to exploit every misstep.","Sokongan rakyat rendah dan parti saingan bersedia memanfaatkan setiap kesilapan."]);
 if(f.ratio>100)O.push(["The debt burden is heavy relative to yearly revenue, which will limit what you can fund later.","Beban hutang berat berbanding hasil tahunan, yang akan menghadkan apa yang boleh dibiayai kemudian."]);
 if(loyalty()<50)O.push(["Coalition discipline is weak, and any contested vote could expose divisions.","Disiplin gabungan lemah dan sebarang undi bertikai boleh mendedahkan perpecahan."]);
 if(l.approval>=75&&l.unrest<=35)O.push(["Things look steady, which gives you room to plan bigger projects before the election.","Keadaan kelihatan stabil, memberi ruang untuk merancang projek lebih besar sebelum pilihan raya."]);
 if(!O.length)O.push(["The situation remains balanced for now, and the next few weeks will decide which way it tilts.","Keadaan kekal seimbang buat masa ini dan beberapa minggu akan datang akan menentukan arah condongnya."]);
 o.push(O[0][i]);if(O[1])o.push(O[1][i]);
 o.push((52-(S.game.wk||0)-1)+" "+t("wksRemain"));
 return o}
function showRes(ev,c,r){const o=$("#modal");o.hidden=false;
 const bad=(k,v)=>(k==="unrest"||k==="debt")?v>0:v<0,now=k=>({approval:S.lv.approval,unrest:S.lv.unrest,economy:S.lv.economy,autonomy:S.lv.autonomy,money:S.lv.money,debt:S.lv.debt,loyalty:loyalty(),mom:S.game.mom})[k],pr=ripple(c.fx,ev,r);
 o.innerHTML=`<div class="dlg wide" role="dialog" aria-modal="true"><h3>📣 ${t("conseq")}</h3><p class="mu" style="margin:0">📅 ${t("week")} ${Math.min(52,(S.game.wk||0)+1)}/52</p><p><b>${esc(ev.t[L()])}</b> → ${esc(c.t[L()])}</p>${c.r[L()].split("||").map(x=>`<p class="story">${esc(x)}</p>`).join("")}<h3 style="margin-top:14px">${t("ripH")}</h3>${pr.map(x=>`<p>${esc(x)}</p>`).join("")}<ul>${r.out.map(([k,v])=>`<li>${t(k)} <b style="color:${bad(k,v)?"#b42318":"#1a9d57"}">${v>0?"+":""}${v}</b> <span class="mu">(${t("now")} ${now(k)})</span></li>`).join("")}${r.ex.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="row"><button class="btn p" id="ok">${t("ok")}</button></div></div>`}
function choose(i){const g=S.game,ev=evById(g.pend);if(!ev)return;const c=ev.c[i];pulse=[];const r=applyFx(c.fx,ev);
 g.log.push({d:g.day,e:g.pend,c:i});g.pend=null;checkAch();render();showRes(ev,c,r)}
function electionDay(){const g=S.game,l=S.lv,f=fin();g.over=true;g.day=g.total;stopClock();
 const c0=cnt(),by=k=>S.parties.filter(p=>p.coal===k).sort((a,b)=>c0[b.id]-c0[a.id]),govP=by("gov"),oppP=by("opp");
 const shift=(l.approval-65)*.25+(l.economy-60)*.1-(l.unrest-30)*.15+(loyalty()-75)*.1+(l.autonomy-55)*.05+g.mom*1.5-Math.max(0,f.ratio-80)*.08;
 let flips=0;pulse=[];
 S.seats.forEach((s,i)=>{const hg=P(s.party)&&P(s.party).coal==="gov",eff=s.sup+shift+s.inc*.08*(hg?1:-1)+(Math.random()-.5)*12;
  if(eff>=50&&!hg&&govP.length){s.party=govP[0].id;flips++;pulse.push(i)}
  else if(eff<50&&hg&&oppP.length){s.party=oppP[0].id;flips++;pulse.push(i)}});
 const gs=side("gov"),os=side("opp"),m=maj(),sw=Math.round(shift);
 const sc=Math.round(gs/S.seats.length*50+l.approval*.2+(100-l.unrest)*.1+l.economy*.1+Math.max(0,100-f.ratio)*.1);
 const rk=os>=m?"rk0":gs<m?"rk1":sc>=75?"rk4":sc>=58?"rk3":"rk2";
 g.res={sw,txt:gs>=m?"govMaj":os>=m?"oppMaj":"hung",gs,os,sc,rk};cur="dash";render();
 const o=$("#modal");o.hidden=false;
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h3>🗳 ${t("elDay")}</h3><p><b>${t(g.res.txt)}</b><br>${t("rank")}: <b>${t(rk)}</b> · ${t("score")}: <b>${sc}/100</b><br>${t("swingRes")}: ${sw>0?"+":""}${sw}%<br>${t("gov")} ${gs} / ${t("opp")} ${os} (${t("maj")}: ${m})<br>${t("moved")}: ${flips}</p><div class="row"><button class="btn p" id="ng">${t("newG")}</button><button class="btn" id="ok">${t("close")}</button></div></div>`}
function newGame(){const go=()=>{S=mk();flt=null;selDun=null;dsel=null;pulse=[];stopClock();closeM();render();fire(pickEv())};if(S.game.over)go();else ask(t("confirmNew"),go,t("newG"),1)}
function showHow(){const o=$("#modal");o.hidden=false;
 o.innerHTML=`<div class="dlg wide" role="dialog" aria-modal="true"><h3>ℹ ${t("how")}</h3><ol>${[1,2,3,4,5].map(i=>`<li>${t("h"+i)}</li>`).join("")}</ol><p class="mu">${t("hnote")} ${t("saveNote")}</p><div class="row"><button class="btn p" id="ok">${t("ok")}</button></div></div>`}
/* ---------- map zoom / pan ---------- */
function setVB(){const sv=$("#mapsvg");if(sv){sv.setAttribute("viewBox",`${mv.x} ${mv.y} ${mv.w} ${mv.h}`);sv.style.setProperty("--k",(mv.w/810).toFixed(4))}}
function clampV(){mv.x=Math.max(-20,Math.min(830-mv.w,mv.x));mv.y=Math.max(-20,Math.min(580-mv.h,mv.y))}
let anim=0;
function zoom(f,cx,cy){cancelAnimationFrame(anim);const nw=Math.max(36,Math.min(810,mv.w*f)),nh=nw*560/810;if(cx==null){cx=mv.x+mv.w/2;cy=mv.y+mv.h/2}
 mv.x=cx-(cx-mv.x)*nw/mv.w;mv.y=cy-(cy-mv.y)*nh/mv.h;mv.w=nw;mv.h=nh;clampV();setVB()}
function animTo(g){cancelAnimationFrame(anim);const f={x:mv.x,y:mv.y,w:mv.w,h:mv.h},t0=performance.now();
 const step=n=>{const k=Math.min(1,(n-t0)/420),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;mv.x=f.x+(g.x-f.x)*e;mv.y=f.y+(g.y-f.y)*e;mv.w=f.w+(g.w-f.w)*e;mv.h=f.h+(g.h-f.h)*e;setVB();if(k<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function fitBox(b,minW){const w=Math.min(810,Math.max(b[2]-b[0],(b[3]-b[1])*810/560,minW||40)),h=w*560/810,cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
 animTo({x:Math.max(-20,Math.min(830-w,cx-w/2)),y:Math.max(-20,Math.min(580-h,cy-h/2)),w,h})}
const fitDiv=di=>fitBox(MAP.vbox[di],120),fitDun=i=>fitBox(MAP.dbox[i],70),resetView=()=>animTo({x:-10,y:-10,w:810,h:560});
document.addEventListener("wheel",e=>{const sv=e.target.closest&&e.target.closest("#mapsvg");if(!sv)return;e.preventDefault();const r=sv.getBoundingClientRect();zoom(e.deltaY<0?.8:1.25,mv.x+(e.clientX-r.left)/r.width*mv.w,mv.y+(e.clientY-r.top)/r.height*mv.h)},{passive:false});
let drag=null;
document.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"||e.button!==0)return;const sv=e.target.closest&&e.target.closest("#mapsvg");if(!sv)return;cancelAnimationFrame(anim);drag={x:e.clientX,y:e.clientY,mx:mv.x,my:mv.y,sv,moved:false}});
document.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;drag.moved=true;const r=drag.sv.getBoundingClientRect();
 mv.x=drag.mx-dx/r.width*mv.w;mv.y=drag.my-dy/r.height*mv.h;clampV();setVB()});
document.addEventListener("pointerup",()=>{if(drag&&drag.moved)noClickUntil=Date.now()+80;drag=null});
/* ---------- events ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
document.addEventListener("click",e=>{
 if(Date.now()<noClickUntil)return;
 const el=e.target.closest("[data-spd],[data-act],[data-go],[data-f],[data-ch],[data-edit],[data-pe],[data-pc],[data-pd],[data-me],[data-md],[data-le],[data-ld],[data-sel],[data-div],[data-divgo],[data-lay],[data-lab],[data-z],[data-bg],.seat,.cell,button[id]");if(!el)return;const d=el.dataset;
 if(d.divgo!==undefined){e.preventDefault();dsel=+d.divgo;selDun=null;cur="dash";render();fitDiv(dsel);return}
 if(d.spd!==undefined){setSpd(d.spd);return}
 if(d.go){cur=d.go;render();return}
 if(el.id==="lg"){lang=lang==="en"?"ms":"en";render();return}
 if(el.id==="how"){showHow();return}
 if(d.lay!==undefined){lay=d.lay;render();return}
 if(d.lab!==undefined){labs=!labs;render();return}
 if(d.z!==undefined){if(d.z==="in")zoom(.7);else if(d.z==="out")zoom(1.4);else{dsel=null;selDun=null;render();resetView()}return}
 if(d.act){act(d.act);return}
 if(d.ch!==undefined){choose(+d.ch);return}
 if(d.edit!==undefined){seatModal(+d.edit);return}
 if(d.sel!==undefined){selDun=+d.sel;dsel=dv(selDun);render();fitDun(selDun);return}
 if(d.bg!==undefined){if(cur==="dash"&&(dsel!==null||selDun!==null)){dsel=null;selDun=null;render();resetView()}return}
 if(el.classList.contains("cell")){hl(null);const i=+d.i,di=+d.div;
  if(cur!=="dash"){seatModal(i);return}
  if(dsel!==di){dsel=di;selDun=null;render();fitDiv(di)}else if(selDun===i){selDun=null;render();fitDiv(di)}else{selDun=i;render();fitDun(i)}
  return}
 if(el.classList.contains("seat")){hl(null);seatModal(+d.i);return}
 if(d.f!==undefined&&(el.classList.contains("lg")||el.classList.contains("seg"))){flt=d.f&&flt!==d.f?d.f:null;render();return}
 if(d.pe)partyForm(P(d.pe));else if(d.pc){const p=P(d.pc);p.coal=p.coal==="gov"?"opp":"gov";toast(t("saved"));render()}else if(d.pd)delParty(d.pd);
 else if(d.me)cabForm(byId(S.cabinet,d.me));else if(d.md)ask(t("confirm"),()=>{S.cabinet=S.cabinet.filter(x=>x.id!==d.md)});
 else if(d.le)polForm(byId(S.policies,d.le));else if(d.ld)ask(t("confirm"),()=>{S.policies=S.policies.filter(x=>x.id!==d.ld)});
 else if(el.id==="addP")partyForm();else if(el.id==="addM")cabForm();else if(el.id==="addL")polForm();
 else if(el.id==="resolve")showEvent();else if(el.id==="endwk")endWeek();
 else if(el.id==="ok"){closeM();render();pulse=[];if(!S.game.first&&!S.game.over&&S.game.pend===null)fire(pickEv())}
 else if(el.id==="ng"||el.id==="ng2")newGame();
 else if(el.id==="sim"){const pid=$("#ep").value;if(!pid){toast(t("noP"));return}simulate(pid,+$("#es").value);toast(t("simDone"));render();pulse=[]}
 else if(el.id==="rst"){S=JSON.parse(JSON.stringify({...BASE,cabinet:S.cabinet,policies:S.policies,game:S.game,res:S.res,lv:S.lv}));flt=null;selDun=null;toast(t("restored"));render()}
});
function dunFilter(e){if(e.target.id==="q"||e.target.id==="qd"){const tb=$("#tb");if(tb)tb.innerHTML=dunRows($("#q").value,$("#qd").value)}}
document.addEventListener("input",dunFilter);document.addEventListener("change",dunFilter);
document.addEventListener("keydown",e=>{
 const free=e.target===document.body&&$("#modal").hidden;
 if(e.code==="Space"&&free){e.preventDefault();endWeek();return}
 if(e.key==="Enter"||e.key===" "){const el=e.target.closest(".seat,.lg,.cell");if(el){e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}))}}});
/* ---------- hover highlight + tooltip ---------- */
const tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip);
function hl(el){
 const pid=el?el.dataset.p:null;
 document.querySelectorAll(".cell.dh").forEach(x=>x.classList.remove("dh"));
 document.querySelectorAll(".seat").forEach(c=>{const m=pid&&c.dataset.p===pid;c.style.opacity=pid?(m?1:.15):"";c.style.stroke=m?"#fff":"";c.style.strokeWidth=m?"3":""});
 if(!el){tip.style.display="none";return}
 const p=P(pid),s=S.seats[+el.dataset.i],n=cnt()[pid];
 tip.innerHTML=`<b>${esc(p?p.abbr:"?")}</b> · ${esc(p?p.name:"")}<br>${n} ${t("seats")} · ${p?t(p.coal):""}<br><span class="mu">${esc(s.name)} · ${esc(DIV[dv(+el.dataset.i)].n)} · ${s.sup}%</span>`;tip.style.display="block"}
function hr(el){const di=+el.dataset.div,ix=rng(di),g=ix.filter(i=>{const p=P(S.seats[i].party);return p&&p.coal==="gov"}).length;
 tip.innerHTML=`<b>📍 ${esc(DIV[di].n)}</b><br>${ix.length} ${t("seats")} · ${t("gov")} ${g} / ${t("opp")} ${ix.length-g}<br><span class="mu">${t("avgS")}: ${Math.round(ix.reduce((a,i)=>a+S.seats[i].sup,0)/ix.length)}%</span>`;tip.style.display="block"}
function dunTip(i){const q=S.seats[i],p=P(q.party);tip.innerHTML=`<b>${esc(q.name)}</b> (N.${q.id}) · ${esc(DIV[dv(i)].n)}<br>${p?esc(p.abbr)+" · "+esc(p.name):"?"}<br><span class="mu">${t("sup")}: ${q.sup}% · ${t("area"+q.area)}</span>`;tip.style.display="block"}
function cellHover(c){document.querySelectorAll(".cell.dh").forEach(x=>x.classList.remove("dh"));const di=+c.dataset.div;
 if(cur!=="dash"||dsel===di){dunTip(+c.dataset.i);c.classList.add("dh")}else{hr(c);document.querySelectorAll('.cell[data-div="'+di+'"]').forEach(x=>x.classList.add("dh"))}}
document.addEventListener("mouseover",e=>{const c=e.target.closest(".cell");if(c){cellHover(c);return}const el=e.target.closest(".seat");if(el)hl(el)});
document.addEventListener("mouseout",e=>{if(e.target.closest(".seat,.cell"))hl(null)});
document.addEventListener("mousemove",e=>{if(tip.style.display==="block"){tip.style.left=Math.min(e.clientX+14,innerWidth-250)+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-90)+"px"}});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest(".seat");if(el){hl(el);const r=el.getBoundingClientRect();tip.style.left=Math.min(r.right+8,innerWidth-250)+"px";tip.style.top=r.top+"px"}});
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest(".seat"))hl(null)});
const loaded=load();render();
if(loaded&&S.game.pend!==null&&!S.game.over)showEvent();else if(!loaded)showHow();
</script></body></html>
