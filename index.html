<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarawak Political Simulator</title>

  <style>
    :root {
      --bg: #0b1120;
      --panel: #111a2d;
      --panel-light: #17233a;
      --border: #26344d;
      --text: #e8eef8;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --sidebar-width: 230px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand {
      padding: 0 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease,
        border-color 160ms ease;
    }

    .nav button:hover {
      background: var(--panel-light);
      color: var(--text);
    }

    .nav button.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.22);
    }

    /* Main area */
    .main {
      min-width: 0;
      padding: 28px 32px;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 0 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-heading h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .page-heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .language-toggle {
      flex-shrink: 0;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .language-toggle:hover {
      border-color: var(--accent);
      background: var(--panel-light);
    }

    .content {
      padding-top: 28px;
    }

    .placeholder {
      min-height: 220px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .placeholder h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .placeholder p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Responsive layout */
    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        padding: 18px;
        gap: 18px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main {
        padding: 22px 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      .page-heading h2 {
        font-size: 21px;
      }
    }

    @media (max-width: 420px) {
      .topbar {
        flex-direction: column;
      }

      .language-toggle {
        align-self: flex-start;
      }

      .nav {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1 data-i18n="brand">Sarawak Political Simulator</h1>
        <p data-i18n="subtitle">Political strategy game</p>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-page="dashboard" data-i18n="dashboard">
          Dashboard
        </button>
        <button data-page="dun" data-i18n="dun">DUN</button>
        <button data-page="parties" data-i18n="parties">Parties</button>
        <button data-page="election" data-i18n="election">Election</button>
        <button data-page="cabinet" data-i18n="cabinet">Cabinet</button>
        <button data-page="policies" data-i18n="policies">Policies</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Welcome to the Sarawak Political Simulator.</p>
        </div>

        <button
          class="language-toggle"
          id="languageToggle"
          type="button"
          aria-label="Switch language"
        >
          BM
        </button>
      </header>

      <section class="content">
        <div class="placeholder">
          <h3 id="contentTitle">Dashboard</h3>
          <p id="contentDescription">
            This section is ready for the next development step.
          </p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const translations = {
      en: {
        brand: "Sarawak Political Simulator",
        subtitle: "Political strategy game",
        dashboard: "Dashboard",
        dun: "DUN",
        parties: "Parties",
        election: "Election",
        cabinet: "Cabinet",
        policies: "Policies",
        pageSubtitle: "Welcome to the Sarawak Political Simulator.",
        contentDescription: "This section is ready for the next development step."
      },
      bm: {
        brand: "Simulator Politik Sarawak",
        subtitle: "Permainan strategi politik",
        dashboard: "Dashboard",
        dun: "DUN",
        parties: "Parti",
        election: "Pilihan Raya",
        cabinet: "Kabinet",
        policies: "Dasar",
        pageSubtitle: "Selamat datang ke Simulator Politik Sarawak.",
        contentDescription: "Bahagian ini sedia untuk langkah pembangunan seterusnya."
      }
    };

    const pageKeys = [
      "dashboard",
      "dun",
      "parties",
      "election",
      "cabinet",
      "policies"
    ];

    let currentLanguage = "en";
    let currentPage = "dashboard";

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const contentTitle = document.getElementById("contentTitle");
    const contentDescription = document.getElementById("contentDescription");
    const languageToggle = document.getElementById("languageToggle");
    const navButtons = document.querySelectorAll(".nav button");

    function updateLanguage() {
      const language = translations[currentLanguage];

      document.documentElement.lang = currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        if (language[key]) {
          element.textContent = language[key];
        }
      });

      pageSubtitle.textContent = language.pageSubtitle;
      contentDescription.textContent = language.contentDescription;
      languageToggle.textContent = currentLanguage === "en" ? "BM" : "EN";

      updatePage();
    }

    function updatePage() {
      const language = translations[currentLanguage];
      const title = language[currentPage];

      pageTitle.textContent = title;
      contentTitle.textContent = title;

      navButtons.forEach((button) => {
        const isActive = button.dataset.page === currentPage;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-current", isActive ? "page" : "false");
      });
    }

    navButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentPage = button.dataset.page;
        updatePage();
      });
    });

    languageToggle.addEventListener("click", () => {
      currentLanguage = currentLanguage === "en" ? "bm" : "en";
      updateLanguage();
    });

    updateLanguage();
  </script>
</body>
</html>
