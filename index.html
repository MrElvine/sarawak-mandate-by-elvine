
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarawak Political Simulator</title>

<style>
:root {
  --bg: #0b1020;
  --panel: #131b2e;
  --panel2: #19243a;
  --border: #2b3852;
  --text: #edf2ff;
  --muted: #9aa9c4;
  --accent: #f0b429;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.brand {
  font-size: 20px;
  font-weight: 800;
}

button {
  padding: 9px 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
}

button:hover { border-color: var(--accent); }

.app {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: calc(100vh - 66px);
}

.sidebar {
  padding: 18px 12px;
  border-right: 1px solid var(--border);
  background: var(--panel);
}

.nav-button {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  text-align: left;
}

.nav-button.active {
  background: var(--accent);
  color: #17130a;
  font-weight: 700;
}

main { padding: 24px; }

.page-title {
  margin: 0 0 8px;
  font-size: 26px;
}

.subtitle {
  margin: 0 0 22px;
  color: var(--muted);
}

.placeholder {
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
}

@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .nav-button {
    width: auto;
    flex: 0 0 auto;
    margin: 0;
  }
  main { padding: 16px; }
}
</style>
</head>

<body>
<header>
  <div class="brand" id="brandTitle">🏛 Sarawak Political Simulator</div>
  <button id="languageToggle">Bahasa Melayu</button>
</header>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <button class="nav-button active" data-page="dashboard" data-en="Dashboard" data-ms="Dashboard">Dashboard</button>
    <button class="nav-button" data-page="dun" data-en="DUN" data-ms="DUN">DUN</button>
    <button class="nav-button" data-page="parties" data-en="Parties" data-ms="Parti">Parties</button>
    <button class="nav-button" data-page="election" data-en="Election" data-ms="Pilihan Raya">Election</button>
    <button class="nav-button" data-page="cabinet" data-en="Cabinet" data-ms="Kabinet">Cabinet</button>
    <button class="nav-button" data-page="policies" data-en="Policies" data-ms="Polisi">Policies</button>
  </nav>

  <main>
    <h1 class="page-title" id="pageTitle">Dashboard</h1>
    <p class="subtitle" id="pageSubtitle">Manage Sarawak's political simulation.</p>
    <section class="placeholder" id="pageContent">
      Dashboard foundation is ready. Features will be added step by step.
    </section>
  </main>
</div>

<script>
let language = "en";

const pageNames = {
  en: {
    dashboard: "Dashboard",
    dun: "DUN",
    parties: "Parties",
    election: "Election",
    cabinet: "Cabinet",
    policies: "Policies"
  },
  ms: {
    dashboard: "Dashboard",
    dun: "DUN",
    parties: "Parti",
    election: "Pilihan Raya",
    cabinet: "Kabinet",
    policies: "Polisi"
  }
};

const subtitles = {
  en: "Manage Sarawak's political simulation.",
  ms: "Urus simulasi politik Sarawak."
};

function setLanguage() {
  document.documentElement.lang = language === "en" ? "en" : "ms";
  document.getElementById("languageToggle").textContent =
    language === "en" ? "Bahasa Melayu" : "English";

  document.querySelectorAll(".nav-button").forEach(button => {
    button.textContent = button.dataset[language];
  });

  document.getElementById("pageSubtitle").textContent = subtitles[language];
  showPage(document.querySelector(".nav-button.active").dataset.page);
}

function showPage(page) {
  document.querySelectorAll(".nav-button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  document.getElementById("pageTitle").textContent = pageNames[language][page];

  const content = {
    en: "This section is ready for its next feature.",
    ms: "Bahagian ini sedia untuk ciri seterusnya."
  };

  document.getElementById("pageContent").textContent = content[language];
}

document.getElementById("languageToggle").addEventListener("click", () => {
  language = language === "en" ? "ms" : "en";
  setLanguage();
});

document.querySelectorAll(".nav-button").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

setLanguage();
</script>
</body>
</html>
