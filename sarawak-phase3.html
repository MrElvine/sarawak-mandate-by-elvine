.btn{transition:transform .12s,background .15s,box-shadow .15s}.btn:active{transform:scale(.96)}.chb{transition:transform .15s,background .15s}.chb:hover:not(:disabled){transform:translateX(5px);background:#e8eefc}

["A large investor proposes a plantation and processing hub that would create jobs and tax revenue. Part of the land is claimed under native customary rights. The investor wants a fast decision and hints that it will look at other states otherwise.","Seorang pelabur besar mencadangkan pusat ladang dan pemprosesan yang akan mewujudkan pekerjaan dan hasil cukai. Sebahagian tanah dituntut di bawah hak adat bumiputera. Pelabur mahukan keputusan cepat dan mengisyaratkan akan melihat negeri lain jika tidak."],
[[["Approve quickly","Luluskan segera"],["Construction begins within months and the economy gets a boost. Community leaders say they were not properly consulted.","Pembinaan bermula dalam beberapa bulan dan ekonomi mendapat dorongan. Pemimpin komuniti berkata mereka tidak dirunding dengan sempurna."],{e:6,mo:40,a:-1,nx:["landprot",30]}],
 [["Decline the project","Tolak projek"],["Native rights groups applaud, but business groups say the state is turning away investment.","Kumpulan hak adat memuji, tetapi kumpulan perniagaan berkata negeri menolak pelaburan."],{e:-1,a:2}],
 [["Negotiate with the community first","Berunding dengan komuniti dahulu"],["Talks take longer and the investor reduces the scale, but both sides accept the compromise.","Rundingan mengambil masa lebih lama dan pelabur mengecilkan skala, tetapi kedua-dua pihak menerima kompromi."],{e:3,mo:10}]],{adv:"land",rec:2,reg:["muk","btu","mri"]}),
E("health","soc",["Dengue outbreak","Wabak denggi"],
["Dengue cases have jumped in several towns and clinics are running short of staff and supplies. Parents are worried about schools. Health officers say a quick campaign of fogging, clean-ups and public notices could slow the spread, but it costs money.","Kes denggi melonjak di beberapa pekan dan klinik kekurangan kakitangan dan bekalan. Ibu bapa risau tentang sekolah. Pegawai kesihatan berkata kempen pantas pengasapan, gotong-royong dan notis awam boleh melambatkan penularan, tetapi ia memerlukan belanja."],
[[["Launch an emergency clean-up campaign","Lancarkan kempen pembersihan kecemasan"],["Cases peak within two weeks and then fall. Volunteers join in and people feel looked after.","Kes memuncak dalam dua minggu dan kemudian menurun. Sukarelawan menyertai dan rakyat rasa dijaga."],{a:4,mo:-30,u:-1}],
 [["Issue a public advisory only","Keluarkan nasihat awam sahaja"],["A few cases fall, but many do not, and some clinics are overwhelmed.","Beberapa kes berkurang, tetapi ramai tidak, dan sebahagian klinik terbeban."],{a:-1,mo:-5,nx:["dengue2",20]}],
 [["Blame residents for poor hygiene","Salahkan penduduk kerana kebersihan lemah"],["The comment goes viral for the wrong reasons, and health workers privately say it made their job harder.","Komen itu tular atas sebab yang salah dan pekerja kesihatan secara peribadi berkata ia menyukarkan kerja mereka."],{a:-6,u:3}]],{adv:"hlt",rec:0,reg:["kch","smh","btu"]}),
E("tourism","eco",["Rainforest festival proposal","Cadangan festival hutan hujan"],
["A proposal has landed for a large rainforest music and culture festival that could attract international visitors and sponsors. Hotels and craft sellers are enthusiastic. Critics worry about costs, crowds and the pressure on the local communities who would host it.","Satu cadangan tiba untuk festival muzik dan budaya hutan hujan berskala besar yang boleh menarik pelawat antarabangsa dan penaja. Hotel dan penjual kraf bersemangat. Pengkritik risau tentang kos, kesesakan dan tekanan ke atas komuniti tempatan yang menjadi tuan rumah."],
[[["Go big with international promotion","Teruskan secara besar dengan promosi antarabangsa"],["Tickets sell well and hotels fill up. The cost is high and the crowds strain local services.","Tiket laris dan hotel penuh. Kosnya tinggi dan kesesakan menekan perkhidmatan tempatan."],{e:5,mo:-25,a:3,u:1}],
 [["Keep it community-run and modest","Kekalkan secara kecil dan dikendalikan komuniti"],["Villagers take pride in hosting and craft sales rise. The event stays small and less profitable.","Penduduk kampung berbangga menjadi tuan rumah dan jualan kraf meningkat. Acara kekal kecil dan kurang menguntungkan."],{e:2,mo:10,a:2}],
 [["Cancel to save money","Batalkan untuk jimat"],["The budget is saved, but sellers and hotels feel let down.","Bajet dijimatkan, tetapi penjual dan hotel rasa dikecewakan."],{mo:15,a:-3,e:-2}]],{adv:"dig",rec:1,reg:["kch","mri","lmb"]}),
E("timber","env",["Timber licence controversy","Kontroversi lesen balak"],
["Environmental groups say timber licences have been granted near native villages and a watershed. A leaked map seems to support their claim. The industry says the licences are legal and thousands of jobs depend on them.","Kumpulan alam sekitar berkata lesen balak diberikan berhampiran kampung bumiputera dan kawasan tadahan air. Satu peta bocor seolah-olah menyokong dakwaan mereka. Industri berkata lesen itu sah dan beribu pekerjaan bergantung kepadanya."],
[[["Review the licences openly","Semak semula lesen secara terbuka"],["The review pauses some operations and annoys companies, but villagers and conservation groups praise the openness.","Semakan menghentikan sebahagian operasi dan menjengkelkan syarikat, tetapi penduduk kampung dan kumpulan pemuliharaan memuji keterbukaan."],{a:3,e:-3,u:-2,mo:-5}],
 [["Defend the licences","Pertahankan lesen"],["Industry is pleased, but protests start in the affected area and the issue sticks to your name.","Industri gembira, tetapi protes bermula di kawasan terjejas dan isu ini melekat pada nama anda."],{e:2,a:-4,u:4}],
 [["Freeze new licences quietly","Bekukan lesen baharu secara senyap"],["The freeze reduces tension without a public fight. Nobody feels fully satisfied.","Pembekuan mengurangkan ketegangan tanpa pertengkaran awam. Tiada siapa rasa sepenuhnya puas."],{u:-1,e:-1,a:1}]],{adv:"land",rec:0,reg:["kap","lmb","mri"]}),
E("civil","eco",["Civil servants ask for a bonus","Penjawat awam minta bonus"],
["The civil servants' union asks for a one-off bonus and better allowances, noting that prices have gone up. Government workers are an important base of support. Finance officers warn that a generous package would strain the budget.","Kesatuan penjawat awam meminta bonus sekali bayar dan elaun lebih baik kerana harga barang naik. Pekerja kerajaan ialah asas sokongan penting. Pegawai kewangan memberi amaran pakej murah hati akan membebankan bajet."],
[[["Grant the full request","Luluskan permintaan penuh"],["Morale jumps and the union praises you. The accounts feel the weight a few weeks later.","Moral melonjak dan kesatuan memuji anda. Akaun terasa bebannya beberapa minggu kemudian."],{mo:-60,a:4,l:2,u:-2}],
 [["Offer a smaller package","Tawarkan pakej lebih kecil"],["A compromise is reached after tense talks. Few are fully happy, but the budget survives.","Kompromi dicapai selepas rundingan tegang. Sedikit yang sepenuhnya gembira, tetapi bajet bertahan."],{mo:-25,a:1}],
 [["Refuse","Tolak"],["The refusal saves money, but union leaders warn of slow work and protest at the next meeting.","Penolakan menjimatkan wang, tetapi pemimpin kesatuan memberi amaran kerja perlahan dan protes pada mesyuarat seterusnya."],{a:-5,u:3,l:-2}]],{adv:"fin",rec:1,reg:["kch","smh"]}),
E("haze","env",["Haze over the state","Jerebu menyelubungi negeri"],
["Smoke from open burning across the region has pushed the air quality index into unhealthy levels. Schools are asking whether to close and hospitals report more breathing complaints. Enforcement against open burning would upset farmers who say it is their cheapest way to clear land.","Asap pembakaran terbuka di seluruh rantau telah menolak indeks kualiti udara ke tahap tidak sihat. Sekolah bertanya sama ada perlu ditutup dan hospital melaporkan lebih banyak aduan pernafasan. Penguatkuasaan terhadap pembakaran terbuka akan menyakitkan hati petani yang berkata ia kaedah paling murah membersihkan tanah."],
[[["Enforce a ban on open burning","Kuatkuasakan larangan pembakaran terbuka"],["Air quality improves within days. Some farmers are fined and complain they were singled out.","Kualiti udara bertambah baik dalam beberapa hari. Sebahagian petani didenda dan mengadu mereka disasarkan."],{a:3,u:1,e:-1}],
 [["Hand out masks and advisories only","Edar pelitup muka dan nasihat sahaja"],["It costs little and looks caring, but the smoke stays and so do the complaints.","Kosnya kecil dan nampak prihatin, tetapi asap kekal dan begitu juga aduan."],{a:-1,mo:-10}],
 [["Wait for the weather to change","Tunggu cuaca berubah"],["Rain eventually helps, but not before parents and doctors lose patience.","Hujan akhirnya membantu, tetapi bukan sebelum ibu bapa dan doktor kehilangan kesabaran."],{a:-5,u:2}]],{adv:"hlt",rec:0,reg:["sib","btu","mri"]}),
/* ----- new situations ----- */
E("pan","eco",["Pan Borneo works fall behind","Kerja Pan Borneo ketinggalan"],
["Sections of the Pan Borneo highway are months behind schedule. Drivers complain of detours and dust, and transporters say delays are raising costs.","Beberapa seksyen lebuh raya Pan Borneo ketinggalan beberapa bulan. Pemandu mengadu lencongan dan habuk, dan pengangkut berkata kelewatan menaikkan kos."],
[[["Summon the contractors and set penalties","Panggil kontraktor dan tetapkan penalti"],["The contractors promise to catch up. Progress is real but slow, and some warn of legal disputes.","Kontraktor berjanji mengejar. Kemajuan nyata tetapi perlahan, dan ada yang memberi amaran pertikaian undang-undang."],{a:2,e:2,u:-1}],
 [["Add state money to speed things up","Tambah dana negeri untuk mempercepat"],["Crews work extra shifts and sections reopen early. The treasury pays for the speed.","Pekerja bekerja syif tambahan dan seksyen dibuka awal. Perbendaharaan menanggung kos kelajuan."],{mo:-50,e:4,a:3}],
 [["Ask people to be patient","Minta rakyat bersabar"],["Patience wears thin. Travellers post photos of the worst stretches.","Kesabaran menipis. Pengembara memuat naik gambar bahagian paling teruk."],{a:-4,u:2}]],{adv:"inf",rec:0,reg:["srk","sib","muk","btu"]}),
E("gawai","soc",["Festival season funding","Pembiayaan musim perayaan"],
["Gawai is near and community groups ask for support for open houses, cultural events and travel for people returning to the longhouses. Budgets are tight but the season matters to many families.","Gawai hampir tiba dan kumpulan komuniti meminta sokongan untuk rumah terbuka, acara budaya dan perjalanan pulang ke rumah panjang. Bajet ketat tetapi musim ini penting bagi ramai keluarga."],
[[["Fund festival grants and travel aid","Biayai geran perayaan dan bantuan perjalanan"],["Longhouses fill with visitors and the mood is warm. The cost is modest but visible.","Rumah panjang dipenuhi pengunjung dan suasana meriah. Kosnya sederhana tetapi ketara."],{mo:-25,a:4,u:-2}],
 [["Small cultural grants only","Geran budaya kecil sahaja"],["Organisers manage with less. Most people accept it, a few grumble.","Penganjur menguruskan dengan kurang. Kebanyakan menerima, segelintir merungut."],{mo:-10,a:1}],
 [["No extra funding this year","Tiada dana tambahan tahun ini"],["The decision saves money but is mentioned in many speeches by rivals.","Keputusan ini menjimatkan wang tetapi disebut dalam banyak ucapan pesaing."],{a:-3,u:1}]],{reg:["kap","sri","bet","sib"]}),
E("hydro","eco",["Hydrogen bus pilot","Perintis bas hidrogen"],
["Engineers propose expanding a hydrogen bus pilot to more towns. It could cut fuel costs and attract investors, but the stations are expensive and the technology is still young.","Jurutera mencadangkan perintis bas hidrogen diperluaskan ke lebih banyak bandar. Ia boleh mengurangkan kos bahan api dan menarik pelabur, tetapi stesen mahal dan teknologinya masih baharu."],
[[["Expand the pilot","Perluaskan perintis"],["New routes open and commuters are curious. Maintenance costs turn out higher than hoped.","Laluan baharu dibuka dan penumpang ingin tahu. Kos penyelenggaraan lebih tinggi daripada dijangka."],{mo:-40,e:4,a:2,pol:"Hydrogen transport pilot|Energy"}],
 [["Bring in a private partner","Bawa masuk rakan swasta"],["The partner funds part of the build. The state keeps less control.","Rakan membiayai sebahagian pembinaan. Negeri mengekalkan kawalan lebih sedikit."],{e:2,mo:10,m:-1}],
 [["Wait and watch","Tunggu dan lihat"],["Nothing breaks and nothing changes. Investors look elsewhere.","Tiada apa rosak dan tiada apa berubah. Pelabur memandang tempat lain."],{e:-1}]],{adv:"inf",rec:1,reg:["kch","btu","mri"]}),
E("ferry","soc",["Ferry safety scare on the river","Kecemasan keselamatan feri di sungai"],
["An overcrowded express boat nearly capsized on the river, and passengers' videos are spreading online. Operators say inspections are costly; commuters say they have no other way to travel.","Sebuah bot ekspres sesak hampir terbalik di sungai dan video penumpang tersebar dalam talian. Pengendali berkata pemeriksaan mahal; penumpang berkata tiada cara lain untuk bergerak."],
[[["Order immediate safety inspections","Arahkan pemeriksaan keselamatan segera"],["Several boats are pulled from service for repairs. Passengers feel safer, but fares rise a little.","Beberapa bot ditarik daripada perkhidmatan untuk dibaiki. Penumpang rasa lebih selamat, tetapi tambang naik sedikit."],{a:3,mo:-15,u:-1}],
 [["Create a passenger safety fund","Wujudkan dana keselamatan penumpang"],["Operators get help to upgrade, and the headlines turn positive.","Pengendali dibantu menaik taraf, dan tajuk berita menjadi positif."],{a:4,mo:-30,e:1}],
 [["Say the boats are fine","Kata bot-bot itu selamat"],["The videos keep circulating and people ask who is responsible.","Video terus beredar dan rakyat bertanya siapa bertanggungjawab."],{a:-5,u:3}]],{adv:"sec",rec:0,reg:["sib","srk","kap","muk"]}),
E("clinic","soc",["Clinics short of doctors","Klinik kekurangan doktor"],
["Remote clinics report long waits and empty doctor posts. Villagers travel for hours by boat or road to see a medical officer, and some skip treatment altogether.","Klinik terpencil melaporkan penantian lama dan jawatan doktor kosong. Penduduk kampung berjalan berjam-jam dengan bot atau jalan raya untuk berjumpa pegawai perubatan, dan ada yang tidak berubat langsung."],
[[["Fund flying doctor and boat clinic teams","Biayai pasukan doktor terbang dan klinik bot"],["Teams reach isolated villages and trust grows. It is a steady monthly cost.","Pasukan sampai ke kampung terpencil dan kepercayaan meningkat. Ia kos bulanan yang tetap."],{a:5,mo:-35,u:-2,pol:"Remote health outreach|Health"}],
 [["Offer allowances to recruit doctors","Tawarkan elaun untuk merekrut doktor"],["A few doctors accept the posts, though not as many as hoped.","Beberapa doktor menerima jawatan, walaupun tidak sebanyak yang diharapkan."],{a:2,mo:-20}],
 [["Ask the federal health ministry","Minta kementerian kesihatan Persekutuan"],["Help is promised but slow to come.","Bantuan dijanjikan tetapi lambat tiba."],{a:-1,m:-1}]],{adv:"hlt",rec:0,reg:["kap","lmb","mri","sri"]}),
E("school","soc",["Students struggle to reach school","Pelajar sukar sampai ke sekolah"],
["Parents in remote districts say children walk for hours or depend on expensive boats to reach school. Attendance drops in the wet season. Teachers say hostels and transport support would help.","Ibu bapa di daerah terpencil berkata anak-anak berjalan berjam-jam atau bergantung kepada bot mahal untuk ke sekolah. Kehadiran menurun pada musim hujan. Guru berkata asrama dan bantuan pengangkutan akan membantu."],
[[["Fund school boats and transport","Biayai bot dan pengangkutan sekolah"],["Attendance improves within a term and parents are relieved.","Kehadiran bertambah baik dalam satu penggal dan ibu bapa lega."],{a:4,mo:-25,u:-1,e:1}],
 [["Build hostels in key villages","Bina asrama di kampung utama"],["Hostels take time to open, but families welcome the plan.","Asrama mengambil masa untuk dibuka, tetapi keluarga mengalu-alukan rancangan itu."],{a:3,mo:-40,pol:"Rural school hostels|Education"}],
 [["Leave it to schools to adapt","Biar sekolah menyesuaikan diri"],["Some schools improvise. Many families feel unheard.","Sebahagian sekolah berikhtiar sendiri. Ramai keluarga rasa tidak didengari."],{a:-3,u:1}]],{adv:"edu",rec:0,reg:["kap","lmb","sri","mri"]}),
E("windfall","eco",["Revenue beats the forecast","Hasil melebihi ramalan"],
["Strong energy revenue has left the state with an unexpected surplus. Everyone has an idea for it: pay down debt, build rural projects, or keep a reserve for rainy days.","Hasil tenaga yang kukuh meninggalkan negeri dengan lebihan tidak dijangka. Semua orang ada cadangan: bayar hutang, bina projek luar bandar, atau simpan rizab untuk hari susah."],
[[["Pay down debt","Bayar hutang"],["Interest costs ease and rating agencies approve. Voters notice little.","Kos faedah berkurang dan agensi penarafan menyetujui. Pengundi hampir tidak perasan."],{db:-120,e:1,a:1}],
 [["Spend on rural projects","Belanja untuk projek luar bandar"],["Roads and clinics get a boost and local leaders are pleased.","Jalan dan klinik mendapat dorongan dan pemimpin tempatan gembira."],{a:5,e:3,mo:-20}],
 [["Keep a cash reserve","Simpan rizab tunai"],["The treasury feels safer and finance staff relax.","Perbendaharaan rasa lebih selamat dan kakitangan kewangan lega."],{mo:100}]],{when:s=>s.lv.economy>55,adv:"fin",rec:0}),
E("landrul","soc",["Court ruling on customary land","Keputusan mahkamah tentang tanah adat"],
["A court has ruled in favour of villagers in a native customary land case. Companies worry about other projects, while community leaders say the state must respect the ruling.","Mahkamah memutuskan memihak kepada penduduk kampung dalam kes tanah adat. Syarikat risau tentang projek lain, manakala pemimpin komuniti berkata negeri mesti menghormati keputusan itu."],
[[["Respect the ruling and compensate fairly","Hormati keputusan dan beri pampasan adil"],["Villagers praise the state. Investors ask for clearer rules.","Penduduk kampung memuji negeri. Pelabur meminta peraturan lebih jelas."],{a:3,m:2,mo:-30,e:-1}],
 [["Appeal the decision","Rayu keputusan"],["The appeal calms companies but angers communities.","Rayuan menenangkan syarikat tetapi memarahkan komuniti."],{a:-3,u:3,e:1}],
 [["Hold talks on a fair framework","Adakan rundingan rangka kerja adil"],["A working group is set up. It will take time, but both sides join it.","Kumpulan kerja ditubuhkan. Ia akan mengambil masa, tetapi kedua-dua pihak menyertainya."],{a:1,u:-1,pol:"Customary land framework|Land"}]],{adv:"land",rec:2,reg:["btu","mri","muk","lmb"]}),
E("bario","eco","Beras Bario terkandas di lapangan terbang",
"Musim menuai di Bario hampir tamat dan lebih 200 tan beras bukit belum sempat dihantar ke Miri kerana penerbangan perintis dibatalkan tiga kali dalam dua minggu akibat kabus tebal. Petani menyatakan kos kargo udara sudah tiga kali ganda harga biasa, manakala beras yang disimpan mula diserang kumbang.||Sebuah koperasi tempatan berkata hotel-hotel di Miri dan Kuching sanggup membayar premium, tetapi hanya jika bekalan tiba sebelum hujung bulan. Pegawai daerah pula mengingatkan bahawa jalan balak ke Bario masih terlalu licin untuk lori besar.",
[["Beri subsidi kargo udara khas untuk petani Bario","Pesawat kargo mengangkut beras dalam masa tiga hari dan koperasi sempat memenuhi tempahan hotel. Petani menyebut keputusan ini sebagai tanda negeri benar-benar mengenali kawasan pedalaman, dan harga beras Bario di pasar Miri naik sedikit.||Namun bil kargo lebih tinggi daripada anggaran. Pegawai kewangan mengingatkan bahawa jika subsidi ini diulang setiap musim, ia akan menjadi komitmen tetap yang sukar ditarik balik.",{a:4,mo:-25,e:2,u:-1}],
 ["Baiki laluan jalan balak dengan kontraktor tempatan","Kerja pembaikan bermula seminggu kemudian dan pemandu lori tempatan mendapat kontrak kecil, yang memberi rezeki tambahan kepada beberapa keluarga. Jalan dibuka separa sebelum hujan lebat berikutnya.||Kemajuan agak perlahan, dan penduduk Bario merungut bahawa penyelesaian ini tidak membantu musim ini. Kumpulan alam sekitar pula bertanya sama ada laluan balak patut dijadikan jalan tetap.",{mo:-35,e:3,a:1,pol:"Bario road upgrade|Infrastructure"}],
 ["Bina pusat jualan dalam talian untuk hasil pedalaman","Pegawai digital melatih belia Bario menggambar, membungkus dan menjual beras serta kraf secara dalam talian. Tempahan pertama datang dari Kuala Lumpur dan Singapura dalam dua minggu.||Kesannya kecil pada musim ini kerana beras sedia ada masih terkandas, tetapi koperasi berasa yakin masa depan lebih terbuka, dan pelancong mula bertanya tentang lawatan ke dataran tinggi.",{mo:-15,e:2,a:2,pol:"Highland e-commerce hub|Digital"}]],{adv:"inf",rec:2,reg:["mri"]}),
E("sibumkt","eco","Peniaga pasar tertekan akibat pembaikan besar",
"Pasar pusat di Sibu dijadualkan ditutup separa selama lapan bulan untuk kerja naik taraf bumbung dan sistem pembetungan. Kira-kira 140 peniaga ikan, sayur dan kraf diminta berpindah ke tapak sementara di tepi sungai yang jauh daripada pelanggan tetap, dan sebahagian peniaga berkata pendapatan mereka sudah jatuh separuh sejak minggu lalu.||Persatuan peniaga membawa petisyen bertandatangan ke pejabat anda. Pihak majlis pula berkata kontrak sudah ditandatangani dan sebarang penangguhan akan menambah kos kepada pembayar cukai.",
[["Bina tapak sementara berbumbung berdekatan dan beri rebat sewa","Tapak baharu siap dalam sembilan hari dengan bumbung dan lampu, dan peniaga mula kembali mendapat pelanggan. Seorang penjual ikan memberitahu pemberita bahawa kali ini mereka merasa didengari.||Perbelanjaan lebih tinggi daripada yang dirancang, dan pegawai majlis mengeluh bahawa tapak sementara memerlukan pengawasan harian.",{mo:-30,a:4,u:-2,e:1}],
 ["Teruskan jadual tanpa perubahan","Kerja bermula tepat pada masanya dan majlis menjimatkan kos. Namun peniaga membuat sekatan simbolik di pintu masuk dan gambar kerusi kosong tersebar dalam talian.||Beberapa peniaga menutup gerai secara kekal dan pembangkang menyebutnya sebagai bukti kerajaan lebih mementingkan kontrak daripada rakyat kecil.",{a:-5,u:3,mo:5}],
 ["Pecahkan kerja kepada dua fasa supaya separuh pasar kekal buka","Peniaga bersetuju dengan pelan dua fasa, walaupun kos pembinaan sedikit meningkat dan siap lebih lambat. Pelanggan tetap masih boleh membeli di separuh pasar yang dibuka.||Kontraktor merungut tentang kerja yang lebih rumit, tetapi tiada bantahan besar berlaku.",{mo:-20,a:2,e:-1,u:-1}]],{adv:"fin",rec:2,reg:["sib"]}),
E("bakunpower","soc","Rumah panjang masih bergantung kepada penjana diesel",
"Seorang ketua rumah panjang di Kapit menulis surat terbuka bahawa 26 rumah panjang di sepanjang sungai masih bergantung kepada penjana diesel. Harga diesel naik dan bekalan hanya sampai dua kali seminggu dengan bot. Anak-anak tidak boleh belajar pada waktu malam dan peti sejuk vaksin di klinik desa pernah hampir rosak.||Syarikat utiliti berkata sambungan grid terlalu mahal untuk laluan sungai berbukit, tetapi mencadangkan sistem solar mikro-grid sebagai alternatif. Pegawai daerah mahu keputusan sebelum musim hujan menutup laluan bot.",
[["Biayai solar mikro-grid untuk semua 26 rumah panjang","Pasukan teknikal tiba dengan bot berpanel solar dan memasang sistem satu demi satu. Dalam masa dua bulan anak-anak membuat kerja rumah di bawah lampu terang, dan klinik desa mendapat peti sejuk yang stabil.||Kosnya besar dan perbendaharaan terasa tekanannya, tetapi ketua rumah panjang menyebut ini sebagai keputusan paling bermakna dalam sedekad.",{mo:-55,a:6,u:-3,e:2,pol:"Solar micro-grid programme|Energy"}],
 ["Mulakan dengan lima rumah panjang sebagai projek perintis","Lima rumah panjang menerima sistem solar dalam sebulan dan hasilnya dipuji. Yang lain berasa dikecualikan dan beberapa ketua menulis surat memohon giliran segera.||Pegawai menyatakan pelaksanaan berperingkat lebih mudah dikawal, tetapi tekanan politik akan meningkat setiap minggu sehingga semua mendapat giliran.",{mo:-20,a:3,e:1}],
 ["Beri subsidi diesel sementara sahaja","Penjana kembali berjalan lebih lama dan penduduk lega buat sementara. Namun subsidi itu hilang bersama diesel yang dibakar, dan tiada apa berubah dari segi struktur.||Ketua rumah panjang berterima kasih secara sopan, tetapi menambah bahawa mereka mahukan penyelesaian kekal, bukan bantuan setiap musim.",{mo:-12,a:1,u:-1}]],{adv:"inf",rec:0,reg:["kap","bet"]}),
E("lngplant","eco","Pemberhentian kerja di kilang Bintulu",
"Sebuah kilang pemprosesan di kawasan perindustrian Bintulu mengumumkan akan menghentikan satu barisan pengeluaran selama enam bulan dan berkemungkinan memberhentikan 380 pekerja kontrak. Kesatuan sekerja berkata ramai daripadanya orang Bintulu dan Kemena yang masih membayar pinjaman rumah dan kereta.||Pengurusan kilang menyatakan permintaan eksport lemah dan mereka mungkin menukar keputusan jika kerajaan negeri menawarkan insentif tenaga atau latihan semula. Pembangkang menggunakan isu ini dalam hantaran media sosial setiap hari.",
[["Tawarkan insentif tenaga dengan syarat pekerja dikekalkan","Syarikat bersetuju membatalkan sebahagian besar pemberhentian dan hanya 40 pekerja dilepaskan secara sukarela. Kesatuan memuji langkah ini dan suasana di pintu kilang tenang semula.||Namun pelabur lain mula bertanya sama ada insentif serupa akan ditawarkan kepada mereka, dan pegawai kewangan risau tentang preseden.",{mo:-40,e:4,a:3,u:-2}],
 ["Biayai latihan semula dan padanan kerja","Pusat latihan di Bintulu menerima 200 peserta pertama dalam dua minggu, dan beberapa syarikat setempat berjanji menemuduga mereka. Pekerja berasa ada jalan keluar.||Walau begitu, kilang tetap menutup barisan pengeluaran itu dan sebahagian pekerja berasa latihan tidak membayar ansuran rumah mereka bulan ini.",{mo:-25,a:2,e:1,u:-1,pol:"Worker retraining scheme|Social"}],
 ["Kata ini keputusan komersial syarikat","Kenyataan itu dianggap dingin. Kesatuan mengadakan perhimpunan kecil di luar pejabat anda dan pemberhentian diteruskan mengikut jadual.||Pelabur menyukai ketegasan, tetapi pengundi di Bintulu menghafal ayat itu, dan pembangkang menjadikannya tajuk kempen.",{a:-4,u:3,e:-3}]],{adv:"fin",rec:1,reg:["btu"]}),
E("kchtransit","eco","Perdebatan laluan pengangkutan awam Kuching",
"Penduduk Samariang, Batu Kawah dan Batu Kitang mahu laluan bas bandar dilanjutkan ke kawasan perumahan baharu kerana perjalanan ke tempat kerja kini mengambil lebih sejam pada waktu puncak. Peniaga di tengah bandar pula bimbang laluan baharu akan menghilangkan tempat letak kereta di hadapan kedai mereka.||Pengendali berkata lanjutan hanya berbaloi jika kerajaan menanggung separuh kos kenderaan baharu. Wakil rakyat bagi kawasan terbabit meminta jawapan sebelum sidang akan datang.",
[["Lanjutkan laluan dan beli bas tambahan","Laluan baharu dibuka selepas dua bulan dan penumpang bertambah setiap minggu. Pekerja kilang di Samarahan menyebutnya sebagai penjimatan masa dua jam sehari.||Beberapa peniaga di tengah bandar merungut tentang kehilangan tempat letak kereta, dan kos penyelenggaraan menambah beban bajet.",{mo:-45,a:4,e:3,u:-2,pol:"Urban bus route extension|Infrastructure"}],
 ["Bina kawasan letak kereta ulang-alik dahulu","Kawasan letak kereta di pinggir bandar siap dalam sebulan dan sebahagian pemandu mula menukar kepada bas sedia ada. Pengendali berpuas hati kerana tiada kos kenderaan baharu.||Penduduk kawasan perumahan baharu berasa masih dilupakan dan menunggu keputusan tentang laluan mereka.",{mo:-25,a:2,e:1}],
 ["Tangguhkan sehingga kajian trafik siap","Kajian dijadualkan lapan minggu dan semua pihak diminta bersabar. Peniaga tengah bandar lega, tetapi penumpang yang menunggu di perhentian berasa diabaikan.||Pembangkang menyebut kajian itu sebagai alasan untuk tidak membuat keputusan.",{a:-3,u:1,mo:-3}]],{adv:"inf",rec:0,reg:["kch","smh"]}),
E("pepperlabour","eco","Pekebun lada kekurangan pekerja",
"Menjelang musim memetik lada di Betong, Sarikei dan Sri Aman, pekebun kecil mengadu bahawa ramai pekerja asing tidak kembali selepas kontrak tamat, manakala belia kampung lebih suka bekerja di bandar. Lada yang masak mula gugur di kebun.||Persatuan pekebun meminta kuota pekerja ditambah dan geran jentera pemetik. Pegawai pertanian berkata geran jentera mahal dan mengambil masa, manakala kelulusan kuota terletak pada kerajaan Persekutuan.",
[["Berunding dengan Persekutuan untuk kuota musim","Pegawai negeri berulang-alik ke Putrajaya dan kuota musim diluluskan separuh daripada permintaan. Sebahagian pekebun sempat memetik, tetapi yang lain terlepas musim.||Rundingan itu berjaya tanpa pertengkaran awam, tetapi ada suara di negeri yang berkata kebergantungan kepada kuota Persekutuan tidak sihat.",{m:-1,e:2,a:2,u:-1}],
 ["Beri geran separa untuk jentera pemetik","Geran diluluskan dan 90 pekebun menerima mesin dalam dua bulan. Mereka yang menerima berasa bangga, tetapi yang menunggu giliran berasa cemburu.||Kos geran lebih besar daripada anggaran awal dan pegawai menyatakan pelaburan ini baru memberi pulangan selepas dua musim.",{mo:-30,e:3,a:3,pol:"Pepper mechanisation grant|Agriculture"}],
 ["Lancarkan program upah belia untuk memetik lada","Program menarik 300 belia dari bandar yang mahu pendapatan tambahan semasa cuti. Sebahagian kebun terselamat dan pekebun terkejut dengan semangat anak muda.||Namun belia hanya tersedia hujung minggu, dan pekebun masih memerlukan pekerja sepenuh masa.",{mo:-15,a:2,u:-2,e:1}]],{adv:"land",rec:1,reg:["srk","bet","sri"]}),
E("teacherhard","soc","Guru pedalaman minta elaun tambahan",
"Kesatuan guru melaporkan bahawa tujuh sekolah di pedalaman Kapit dan Limbang kehilangan guru sains dan matematik tahun ini kerana pertukaran, dan tiada pengganti tetap. Seorang guru berkata beliau mengambil bot dua hari untuk pulang bertemu keluarga.||Ibu bapa bimbang tentang peperiksaan akhir tahun. Kementerian Persekutuan mengurus guru, tetapi negeri boleh menawarkan elaun tambahan dan perumahan.",
[["Beri elaun dan perumahan negeri untuk guru pedalaman","Dalam sebulan lima guru baharu menerima tawaran dan beberapa guru sedia ada menarik balik permohonan pertukaran. Ibu bapa menghantar kuih ke sekolah sebagai tanda terima kasih.||Pegawai Persekutuan agak tidak selesa kerana negeri melangkah ke bidang mereka, tetapi tidak membantah secara terbuka.",{mo:-35,a:4,u:-2}],
 ["Biayai tuisyen dalam talian dengan pusat internet komuniti","Pelajar menyertai kelas dalam talian dari balai raya yang kini ada sambungan lebih baik. Guru dari bandar mengajar dua kali seminggu dan pelajar menyukai suasana baharu itu.||Namun isyarat tidak stabil pada hari hujan, dan ibu bapa masih mahukan guru yang hadir di sekolah.",{mo:-20,a:3,e:1}],
 ["Minta Persekutuan menyelesaikan sepenuhnya","Surat dihantar dan jawapan mesra diterima tetapi tanpa tarikh. Sekolah terus menunggu dan guru yang tinggal kelihatan keletihan.||Ibu bapa menulis kepada akhbar bahawa negeri sepatutnya bertindak sendiri.",{a:-2,m:-1}]],{adv:"edu",rec:0,reg:["kap","lmb"]}),
E("bridge","eco","Jambatan lama diisytiharkan tidak selamat",
"Jurutera daerah menemui keretakan di tiang jambatan lama yang menghubungkan dua kampung di Sri Aman, dan lori berat sudah dilarang melaluinya. Dua pengusaha bot tambang sanggup menyeberangkan penduduk, tetapi tambangnya tinggi.||Seorang pelajar tahun akhir berkata dia terpaksa menaiki bot setiap pagi untuk ke sekolah. Kontraktor menawarkan penyelesaian cepat dengan kos lebih tinggi, atau penyelesaian lebih murah dengan masa lebih lama.",
[["Bina jambatan sementara dan baiki dengan cepat","Jambatan sementara siap dalam dua minggu dan lori kecil boleh melalui semula. Peniaga dan pelajar lega, dan kerja pembaikan sebenar bermula serentak.||Kos pantas ini besar, dan beberapa pegawai berkata sebahagian wang itu boleh digunakan di tempat lain.",{mo:-50,a:4,u:-2,e:2}],
 ["Lakukan pembaikan berperingkat dengan kos lebih rendah","Kerja berjalan perlahan dan jambatan hanya dibuka separa selepas sebulan. Penduduk bersabar tetapi mengeluh tentang kesesakan di tepi sungai.||Perbelanjaan terkawal dan juruteranya berpuas hati, tetapi tiada sesiapa menyebut keputusan ini sebagai bijak.",{mo:-25,a:1,u:1}],
 ["Kekalkan larangan dan sediakan bot percuma","Bot percuma beroperasi setiap pagi dan petang dan pelajar tiba tepat masa. Penduduk menghargai bantuan itu, tetapi bot penuh sesak pada hujung minggu.||Jambatan masih belum dibaiki, dan jurutera memberi amaran keretakan boleh bertambah.",{mo:-15,a:2,e:-1}]],{adv:"inf",rec:0,reg:["sri","bet"]}),
E("scam","soc","Gelombang penipuan dalam talian",
"Dalam tiga minggu, polis menerima lebih 120 laporan penipuan telefon dan aplikasi pesanan di Kuching, Samarahan dan Sibu. Ramai mangsa ialah warga emas dan pesara yang kehilangan simpanan puluhan ribu ringgit, dan seorang pesara berkata beliau hilang wang simpanan pengebumiannya.||Bank berkata mereka mengesan transaksi pelik tetapi tidak boleh menyekat tanpa arahan. Pegawai keselamatan mencadangkan kempen kesedaran, pusat bantuan 24 jam, atau kerjasama dengan bank dan telco.",
[["Wujudkan pusat bantuan 24 jam dan kempen komuniti","Talian bantuan menerima 300 panggilan dalam minggu pertama dan beberapa transaksi dihentikan sebelum wang hilang. Sukarelawan mengajar warga emas di dewan komuniti dan pusat jagaan.||Kos operasi agak tinggi, tetapi akhbar memuji langkah ini sebagai contoh perkhidmatan yang benar-benar membantu.",{mo:-25,a:4,u:-2,pol:"Anti-scam helpline|Social"}],
 ["Bentuk pasukan khas bersama bank dan telco","Pasukan itu dapat menyekat beberapa akaun penipu dalam seminggu dan dua suspek ditahan. Bank memuji kerjasama yang lebih pantas.||Kempen kesedaran awam kurang menonjol, dan sebahagian mangsa berasa sudah terlambat untuk mereka.",{mo:-15,a:3,e:1}],
 ["Keluarkan amaran awam sahaja","Amaran dihantar melalui media sosial dan radio. Sebahagian orang peka, tetapi warga emas yang tidak menggunakan media sosial tidak terjangkau.||Laporan penipuan terus meningkat dan wakil rakyat pembangkang bertanya mengapa tiada tindakan lebih serius.",{a:-1,u:1,mo:-2}]],{adv:"sec",rec:0,reg:["kch","smh","sib"]}),
E("hornbill","env","Burung kenyalang dan jalan baharu",
"Pakar hidupan liar menemui sarang burung kenyalang di hutan yang bakal dilalui cadangan jalan menghubungkan dua rumah panjang berhampiran Batang Ai. Penduduk setempat mahukan jalan itu kerana kini terpaksa menaiki bot sehari penuh untuk ke klinik.||Pertubuhan alam sekitar menawarkan laluan alternatif yang lebih panjang tetapi menjejaskan beberapa ladang. Pelancong yang datang melihat burung kenyalang juga menyumbang pendapatan kepada rumah panjang.",
[["Ubah laluan walaupun lebih panjang","Jalan dilukis semula dan pakar alam sekitar menyatakan kelegaan. Ladang yang terjejas dibayar pampasan, tetapi beberapa pemilik berkata jumlahnya tidak memadai.||Kos pembinaan meningkat dan jalan siap lebih lambat, tetapi penduduk bersetuju selepas dijelaskan.",{mo:-30,a:3,u:-1,e:-1}],
 ["Teruskan laluan asal dengan pagar perlindungan","Kerja berjalan pantas dan penduduk gembira kerana jalan siap lebih awal. Pertubuhan alam sekitar berarak dan gambar sarang yang terganggu tersebar.||Beberapa pelancong membatalkan tempahan dan nama negeri disebut dalam laporan antarabangsa.",{mo:-15,a:-1,u:2,e:1}],
 ["Bina jambatan gantung ekopelancongan","Jalan kecil dan jambatan gantung dibina dengan teknologi ringan dan kesan terhadap kenyalang kecil. Rumah panjang membuka homestay dan pemandu pelancong tempatan.||Kosnya tinggi, dan jalan tidak boleh dilalui kenderaan besar, jadi sebahagian penduduk masih mahukan jalan sebenar.",{mo:-35,a:3,e:3,pol:"Hornbill ecotourism trail|Environment"}]],{adv:"land",rec:2,reg:["sri","kap"]}),
E("audit","pol","Laporan audit peruntukan tidak digunakan",
"Laporan audit dalaman menunjukkan sembilan projek kecil di beberapa bahagian tidak dibelanjakan walaupun peruntukan diluluskan sejak tahun lepas, termasuk dua perigi komuniti dan sebuah balai raya. Wartawan menyiarkan senarai projek dan meminta jawapan.||Beberapa ketua jabatan berkata masalah itu berpunca daripada birokrasi dan kelewatan kontraktor. Wakil rakyat pembangkang meminta laporan penuh dikeluarkan.",
[["Siarkan laporan penuh dan tetapkan tarikh siap","Laporan diterbitkan dan setiap projek diberi tarikh baharu. Akhbar memuji ketelusan, dan penduduk menyemak laman web untuk melihat kemajuan.||Beberapa ketua jabatan berasa dimalukan secara terbuka, dan hubungan dalam kerajaan agak tegang buat sementara.",{a:3,u:-1,w:1,l:-1,pol:"Project delivery tracker|Governance"}],
 ["Kembalikan peruntukan dan tukar kontraktor","Peruntukan ditarik balik dan kontraktor baharu dilantik dalam dua minggu. Beberapa projek bermula semula dengan cepat.||Kontraktor lama membuat aduan dan sebahagian ahli parti berasa mereka dihukum tanpa dibicarakan.",{mo:-10,a:2,l:-1}],
 ["Anggap laporan ini perkara dalaman","Kenyataan ringkas dikeluarkan dan isu itu seolah-olah reda. Namun seorang wartawan menyiarkan wawancara dengan penduduk yang masih menunggu perigi mereka.||Pembangkang menyebut ini bukti kerajaan menyembunyikan perkara, dan isu ini akan dibangkitkan lagi.",{a:-4,u:2,w:-1}]],{adv:"fin",rec:0}),
E("gascyl","soc","Kekurangan gas memasak di pedalaman",
"Beberapa kedai runcit di Belaga, Lawas dan pedalaman Baram melaporkan tong gas kosong tidak dapat diisi kerana lori pengedar tidak sampai selepas jalan runtuh. Keluarga kembali memasak dengan kayu api, dan harga tong gas di kedai persendirian naik hampir dua kali ganda.||Pengedar berkata mereka rugi jika menghantar ke tempat jauh tanpa bantuan kos. Pejabat daerah menawarkan bot dan helikopter sewa, tetapi kosnya tinggi.",
[["Biayai penghantaran khas ke kawasan terputus","Bot dan helikopter mengangkut tong gas ke tiga lokasi dalam seminggu. Keluarga menyambut dengan lega, dan harga di kedai menurun semula.||Kos penghantaran besar bagi jumlah yang kecil, tetapi pegawai daerah berkata nilainya terasa dalam mutu hidup.",{mo:-30,a:4,u:-2}],
 ["Tetapkan harga siling dan beri insentif pengedar","Harga siling diumumkan dan pengedar menerima insentif kecil. Sebahagian kedai mematuhi, tetapi ada yang berhenti menjual kerana tidak untung.||Bekalan agak pulih di kawasan yang mudah dicapai, tetapi kawasan terpencil masih kekurangan.",{mo:-12,a:2,e:-1}],
 ["Galakkan penggunaan dapur biojisim komuniti","Dapur biojisim dipasang di dua balai raya sebagai percubaan. Penduduk berminat tetapi menyatakan ia mengambil masa untuk membiasakan diri.||Pakar kesihatan menasihatkan pengudaraan yang baik, dan sebahagian keluarga berasa ini langkah mundur.",{mo:-18,a:1,e:1,u:1}]],{adv:"inf",rec:0,reg:["kap","lmb","mri"]}),
E("storm","env","Ribut kuat di pesisir",
"Ribut kuat dengan angin laju menghempas pantai Mukah dan Dalat pada waktu malam, menyebabkan puluhan bumbung zink terbang dan beberapa bot nelayan karam di muara. Nelayan berkata mereka tidak dapat turun ke laut selama tiga hari.||Pegawai daerah menganggarkan kerosakan awal berjumlah jutaan ringgit. Persatuan nelayan meminta bantuan segera untuk bot dan jaring, dan penduduk mahukan sistem amaran lebih awal.",
[["Beri pakej pemulihan dan insurans bot nelayan","Pakej diumumkan dalam tiga hari dan nelayan menerima bayaran pertama dalam seminggu. Mereka kembali ke laut lebih cepat daripada dijangka.||Pegawai kewangan menyatakan skim insurans memerlukan dana tetap, tetapi nelayan berkata ini kali pertama mereka rasa dilindungi.",{mo:-35,a:5,u:-2}],
 ["Bina sistem amaran pesisir dan pusat perlindungan","Pembinaan bermula dan menara amaran dipasang di tiga lokasi. Penduduk berasa lebih selamat untuk jangka panjang, walaupun bantuan segera kurang.||Beberapa keluarga yang hilang bumbung merungut bahawa mereka masih menunggu.",{mo:-30,a:3,e:1,pol:"Coastal early-warning system|Disaster"}],
 ["Beri bantuan makanan sementara sahaja","Bakul makanan diedarkan ke 400 keluarga dan penduduk berterima kasih. Namun bot yang karam tidak diganti dan nelayan terpaksa meminjam.||Pembangkang menyebut bantuan itu sebagai tindakan simbolik.",{mo:-8,a:-1,u:2}]],{adv:"inf",rec:0,reg:["muk","srk"]}),
E("english","soc","Perbahasan bahasa pengantar sains dan matematik",
"Persatuan ibu bapa di beberapa bandar mencadangkan agar sains dan matematik diajar dalam dua bahasa supaya anak-anak lebih bersedia untuk pengajian tinggi dan pekerjaan. Sebahagian guru bimbang pelajar luar bandar akan ketinggalan jika bahasa Inggeris terlalu ditekankan.||Pengkritik pula menganggap isu ini sebagai pengalih perhatian. Pegawai pendidikan meminta arahan sama ada mahu memulakan kajian rintis atau menunggu panduan Persekutuan.",
[["Mulakan kajian rintis di sepuluh sekolah","Sepuluh sekolah dipilih merentasi bandar dan luar bandar, dan guru menjalani latihan tambahan. Ibu bapa teruja, dan pegawai pendidikan bersetuju dengan pendekatan hati-hati.||Beberapa pihak di peringkat Persekutuan berasa tidak selesa dengan langkah itu, tetapi tiada pertikaian terbuka.",{mo:-15,a:2,m:2}],
 ["Tangguh dan rujuk Persekutuan","Surat dihantar dan jawapan diterima dengan nada sopan tetapi tanpa komitmen. Isu ini senyap seketika.||Ibu bapa yang mahukan perubahan berasa negeri tidak cukup berani, dan penyokong autonomi pendidikan berasa kecewa.",{a:-1,m:-1}],
 ["Beri latihan bahasa tambahan kepada guru sahaja","Kursus bahasa untuk 600 guru dianjurkan pada cuti sekolah. Guru menghargai peluang itu walaupun penat.||Kesannya tidak segera, tetapi pegawai berkata ia asas yang baik untuk sebarang perubahan di masa depan.",{mo:-12,a:2,e:1}]],{adv:"edu",rec:0}),
E("bursary","soc","Biasiswa negeri dipertikai",
"Senarai penerima biasiswa negeri tersebar dalam talian dan ibu bapa dari luar bandar mendakwa anak mereka yang cemerlang tidak dipilih, manakala beberapa penerima mempunyai ibu bapa berpendapatan tinggi. Pegawai kementerian berkata kriteria dikira mengikut mata dan pendapatan.||Pelajar dari pedalaman membuat video rayuan yang tular. Wakil rakyat mencadangkan pengiraan semula dan kuota luar bandar.",
[["Kira semula dengan kuota luar bandar","Senarai dikemas kini dalam dua minggu dan 40 pelajar luar bandar ditambah. Ibu bapa menghubungi pejabat anda untuk berterima kasih, dan video pelajar disunting dengan ucapan syukur.||Beberapa penerima asal berasa tidak adil dan menulis aduan, tetapi jumlahnya kecil.",{mo:-20,a:4,u:-2,pol:"Rural bursary quota|Education"}],
 ["Pertahankan keputusan sedia ada","Kementerian menerbitkan penjelasan panjang mengenai kriteria. Penjelasan itu betul dari segi teknikal tetapi dianggap dingin.||Video pelajar menjangkau ratusan ribu tontonan dan kemarahan di kawasan luar bandar semakin ketara.",{a:-4,u:2}],
 ["Tambah dana biasiswa tanpa mengubah kriteria","Dana ditambah dan 60 lagi pelajar menerima biasiswa. Ramai berasa lega, walaupun masalah pengiraan tidak diselesaikan.||Pegawai kewangan menyatakan ini mahal, dan pengkritik berkata isunya adalah keadilan, bukan jumlah.",{mo:-35,a:3,e:1}]],{adv:"edu",rec:0}),
E("miriaged","eco","Telaga minyak lama dan pekerja berpengalaman",
"Beberapa telaga minyak lama di luar pesisir Miri dijangka ditutup dalam tiga tahun, dan sekumpulan pekerja berpengalaman berusia lewat 50-an bimbang tidak mendapat pekerjaan lain. Kedai makan dan penyewaan rumah berhampiran pangkalan sudah terasa kesannya.||Syarikat menawarkan kerjasama untuk mengalihkan kemahiran ke tenaga baharu seperti hidrogen. Peniaga di Miri pula meminta kerajaan menarik pelancong dan pelabur baharu.",
[["Rancang peralihan tenaga bersama syarikat","Pelan peralihan disiapkan bersama syarikat dan universiti, dan kursus untuk pekerja berpengalaman bermula. Pekerja berasa kemahiran mereka dihargai.||Hasil sebenar mengambil masa bertahun-tahun, dan pengkritik berkata janji itu masih di atas kertas.",{mo:-30,e:4,a:2,pol:"Energy transition plan|Energy"}],
 ["Galakkan pelancongan dan acara di Miri","Pelbagai acara dianjurkan dan hotel mencatat tempahan lebih tinggi. Peniaga makanan dan kedai cenderamata gembira.||Namun pekerja minyak berasa mereka tidak mendapat manfaat langsung, dan acara itu bukan penyelesaian tetap.",{mo:-20,e:3,a:2}],
 ["Tunggu tanpa rancangan baharu","Tiada apa berlaku dan kebimbangan terus tersebar di kedai kopi. Syarikat menawarkan pakej pelepasan yang hanya memuaskan sebahagian pekerja.||Pembangkang berkata kerajaan tidak merancang untuk masa depan Miri.",{e:-3,a:-3,u:2}]],{adv:"fin",rec:0,reg:["mri"]}),
E("midterm","pol",["Mid-term review","Semakan separuh penggal"],["Half of the term is behind you. Party divisions, civil servants and business groups all ask what the second half will look like. Newspapers publish scorecards of your promises, and your own advisers disagree about whether to defend the record or reset the agenda.||The coalition council wants a public statement this week. Whatever you say will be quoted until election day.","Separuh penggal telah berlalu. Bahagian parti, penjawat awam dan kumpulan perniagaan semuanya bertanya bagaimana separuh kedua nanti. Akhbar menerbitkan kad skor janji anda, dan penasihat anda sendiri berbeza pendapat sama ada mahu mempertahankan rekod atau menetapkan semula agenda.||Majlis gabungan mahukan kenyataan awam minggu ini. Apa yang anda katakan akan dipetik sehingga hari mengundi."],
[[["Defend the record proudly","Pertahankan rekod dengan bangga"],["Supporters feel vindicated and the coalition relaxes. Critics say you are ignoring problems, and the line is repeated by rivals for weeks.||The statement hardens the narrative: you are the party of continuity.","Penyokong rasa dibela dan gabungan lega. Pengkritik berkata anda mengabaikan masalah, dan ayat itu diulang pesaing berminggu-minggu.||Kenyataan ini mengukuhkan naratif: anda ialah parti kesinambungan."],{l:4,a:-1,w:1}],
 [["Reset the agenda with a new five-point plan","Tetapkan semula agenda dengan pelan lima perkara baharu"],["The plan gets a lot of attention and the press calls it energetic. Officials scramble to cost it, and a few allies worry it promises too much.||Voters say they like having something concrete to judge.","Pelan itu mendapat perhatian besar dan media menyebutnya bertenaga. Pegawai bergegas mengira kosnya, dan beberapa sekutu bimbang ia berjanji terlalu banyak.||Pengundi kata mereka suka ada sesuatu yang konkrit untuk dinilai."],{a:3,mo:-20,w:1,pol:"Five-point renewal plan|Governance"}],
 [["Admit mistakes and promise fixes","Akui kesilapan dan janji pembaikan"],["Honesty earns grudging respect and the tone of coverage softens. Some members feel you handed the opposition a weapon.||The real test is whether the fixes arrive before polling day.","Kejujuran meraih penghormatan separuh hati dan nada liputan melembut. Sebahagian ahli rasa anda memberi senjata kepada pembangkang.||Ujian sebenar ialah sama ada pembaikan tiba sebelum hari mengundi."],{a:2,u:-2,l:-2}]],{ch:1,wk:26}),
E("candidates","pol",["Choosing candidates","Memilih calon"],["Nomination day is close and every division chief has a favourite. In several seats, long-serving assemblymen are unpopular, while younger challengers are untested. Women's and youth wings ask for more seats, and two coalition partners both claim the same constituency.||Your decision will be read as a message about what kind of government you lead. A bad pick can cost a safe seat.","Hari penamaan calon hampir dan setiap ketua bahagian ada pilihan sendiri. Di beberapa kerusi, wakil rakyat lama kurang popular, manakala pencabar muda belum teruji. Sayap wanita dan pemuda meminta lebih banyak kerusi, dan dua rakan gabungan menuntut kawasan yang sama.||Keputusan anda akan dibaca sebagai mesej tentang jenis kerajaan yang anda pimpin. Pilihan yang salah boleh menjejaskan kerusi selamat."],
[[["Refresh the line-up with new faces","Segarkan barisan dengan wajah baharu"],["Younger candidates energise the campaign and urban voters respond. A few veterans are bitter and one grumbles to the press.||Rural voters ask who these new people are.","Calon muda menyegarkan kempen dan pengundi bandar bertindak balas. Beberapa veteran kecewa dan seorang merungut kepada media.||Pengundi luar bandar bertanya siapa orang baharu ini."],{a:3,l:-3,w:1}],
 [["Keep experienced incumbents","Kekalkan penyandang berpengalaman"],["The machine runs smoothly and loyal members are pleased. Commentators call the list predictable.||Safe seats stay safe, but marginal ones may need more energy.","Jentera berjalan lancar dan ahli setia gembira. Pengulas menyebut senarai itu boleh diramal.||Kerusi selamat kekal selamat, tetapi kerusi marginal mungkin perlukan lebih tenaga."],{l:4,a:-1}],
 [["Balance by division and let chiefs decide","Seimbangkan mengikut bahagian dan biar ketua memutuskan"],["Division chiefs feel respected and local machines work hard. A couple of choices turn out awkward and are criticised.||The process feels fair, if slow.","Ketua bahagian rasa dihormati dan jentera tempatan bekerja keras. Beberapa pilihan nampak janggal dan dikritik.||Prosesnya terasa adil, walaupun perlahan."],{l:2,a:1,u:-1}]],{ch:1,wk:47}),
E("manifesto","pol",["Launching the manifesto","Melancarkan manifesto"],["The manifesto launch is in four days. Your drafters have three versions: one full of big infrastructure pledges, one focused on cost of living, and one centred on state rights. Each has loyal supporters in the room, and the finance team has marked the first as expensive.||Journalists will compare every line with your record. Voters will remember one headline.","Pelancaran manifesto tinggal empat hari. Penggubal anda ada tiga versi: satu penuh janji infrastruktur besar, satu tertumpu pada kos sara hidup, dan satu berpusat pada hak negeri. Setiap satu ada penyokong setia dalam bilik, dan pasukan kewangan menandakan yang pertama sebagai mahal.||Wartawan akan membandingkan setiap baris dengan rekod anda. Pengundi akan ingat satu tajuk berita."],
[[["Big infrastructure pledges","Janji infrastruktur besar"],["Crowds cheer the maps and promises of roads, bridges and airports. Analysts warn about funding, and rivals call it a wish list.||Rural districts like what they hear.","Orang ramai bersorak pada peta dan janji jalan, jambatan dan lapangan terbang. Penganalisis memberi amaran tentang pembiayaan, dan pesaing menyebutnya senarai impian.||Daerah luar bandar suka apa yang mereka dengar."],{a:2,e:2,w:1,mo:-10}],
 [["Cost of living first","Kos sara hidup diutamakan"],["Families nod at pledges on prices, subsidies and wages. The press says it is sensible and a little cautious.||The mood in urban areas improves.","Keluarga mengangguk pada janji harga, subsidi dan gaji. Media berkata ia munasabah dan agak berhati-hati.||Suasana di kawasan bandar bertambah baik."],{a:3,u:-2,w:1}],
 [["State rights and identity","Hak negeri dan identiti"],["The speeches are emotional and the hall is loud. The message resonates with core supporters but less with undecided voters.||Federal leaders watch carefully.","Ucapan penuh emosi dan dewan bergema. Mesej ini menyentuh penyokong teras tetapi kurang menarik pengundi yang belum membuat keputusan.||Pemimpin Persekutuan memerhati dengan teliti."],{m:6,a:1,w:1}]],{ch:1,wk:51}),
E("prices","eco","Harga barang basah melonjak di pasar",
"Pembekal sayur dan ikan di Sibu, Miri dan Kuching melaporkan harga borong naik hampir satu perempat dalam dua minggu akibat gangguan bekalan dan kos pengangkutan. Peniaga pasar mengadu pelanggan membeli separuh daripada kebiasaan, dan beberapa ibu tunggal memberitahu pemberita mereka terpaksa memilih antara lauk dan bil elektrik.||Persatuan pengguna mahu kawalan harga serta-merta, manakala pembekal besar memberi amaran kawalan harga akan menyebabkan bekalan hilang dari rak. Pegawai kementerian meminta arahan sebelum hujung minggu.",
[["Tetapkan harga siling sementara dan hantar penguat kuasa","Penguat kuasa meronda pasar dan harga turun dalam beberapa hari. Pengguna lega dan pembekal kecil patuh, tetapi beberapa peruncit besar mengurangkan stok dan rak kosong muncul di kedai tertentu.||Keputusan ini popular tetapi tidak boleh bertahan lama tanpa menyelesaikan punca bekalan.",{a:4,e:-2,u:-1,mo:-5}],
 ["Beri baucar makanan kepada keluarga berpendapatan rendah","Baucar sampai kepada 40 ribu keluarga dalam dua minggu. Peniaga pasar turut mendapat manfaat kerana pelanggan kembali membeli.||Kos baucar besar dan kritikan timbul bahawa ia tidak menyelesaikan punca kenaikan harga.",{a:5,mo:-40,u:-2}],
 ["Biar pasaran menyesuaikan diri","Harga turun perlahan selepas tiga minggu tetapi kemarahan di pasar membuak. Gambar rak kosong dan ibu tunggal yang mengeluh tersebar luas.||Pembangkang menyebut kerajaan tidak merasai kesusahan rakyat.",{a:-5,u:3,e:1}],
 ["Lancarkan platform harga terbuka dan subsidi tersasar","Aplikasi harga masa nyata dilancarkan dan subsidi hanya diberikan kepada yang layak. Pasar menjadi lebih telus dan peniaga yang menaikkan harga melampau dikesan.||Pegawai kewangan berpuas hati kerana kos terkawal, dan akhbar memuji pendekatan moden ini.",{a:4,mo:-20,e:2,u:-2,pol:"Open price platform|Digital"},"fin"]],{adv:"fin",rec:3,reg:["sib","mri","kch"]}),
E("illegal","env","Drone kesan pembalakan haram di hulu sungai",
"Gambar drone yang dihantar sekumpulan belia dari rumah panjang di Kapit menunjukkan jentolak membuka laluan balak baharu di kawasan yang belum diluluskan. Sungai di bawahnya sudah keruh dan penduduk kampung berkata ikan semakin kurang.||Syarikat yang dinamakan menafikan sebarang kesalahan dan mendakwa laluan itu dalam kawasan berlesen. Pegawai hutan mengakui sempadan peta lama tidak jelas, tetapi gambar tersebut sudah dikongsi puluhan ribu kali.",
[["Hentikan kerja serta-merta dan buat siasatan terbuka","Jentolak dihentikan dan pasukan penguat kuasa tiba dalam dua hari. Belia rumah panjang dijemput melihat siasatan, dan akhbar memuji tindakan pantas.||Syarikat membuat aduan tentang kerugian, dan beberapa pekerja kontrak kehilangan upah buat sementara.",{a:4,e:-2,u:-2,mo:-10}],
 ["Minta syarikat menyelesaikan sendiri","Syarikat mengeluarkan kenyataan dan memagari sebahagian kawasan. Orang ramai tidak yakin, dan belia meneruskan siaran langsung dari tapak.||Isu ini terus tular dan nama kerajaan disebut dalam ulasan.",{a:-4,u:3,e:1}],
 ["Wujudkan pasukan pemantau komuniti dengan dron rasmi","Pasukan gabungan penguat kuasa dan belia dilatih menerbangkan dron setiap minggu. Penduduk rasa dihormati dan laporan mula masuk secara tetap.||Kosnya sederhana, tetapi kepercayaan masyarakat meningkat.",{a:3,mo:-20,u:-2,pol:"Community forest monitoring|Environment"}],
 ["Bekukan lesen kawasan itu dan semak peta sempadan","Pegawai tanah menyemak peta dan mendapati dua lesen bertindih. Satu lesen dibatalkan dengan pampasan kecil, dan peta baharu diterbitkan.||Pelabur memahami ketegasan itu, dan pengkritik kehilangan hujah.",{a:5,u:-3,e:-1,mo:-15},"land"]],{adv:"land",rec:3,reg:["kap","bet"]}),
E("hostel","soc","Pelajar universiti protes yuran asrama",
"Beberapa ratus pelajar di universiti negeri berhimpun di dataran kampus selepas yuran asrama dinaikkan dua puluh peratus. Seorang pelajar tahun dua memberitahu pemberita dia terpaksa bekerja malam di kedai makan untuk membayar sewa, dan prestasinya jatuh.||Naib canselor berkata kos elektrik dan penyelenggaraan sudah melebihi bajet. Kesatuan pelajar memberi tempoh seminggu sebelum mereka membawa petisyen ke dewan undangan.",
[["Bayar jurang kos melalui dana negeri","Kenaikan dibatalkan dan pelajar bersorak. Naib canselor lega, tetapi jabatan lain berasa dana pendidikan diambil daripada mereka.||Pelajar menghantar surat terima kasih secara terbuka.",{a:4,mo:-30,u:-3}],
 ["Rundingan tiga pihak dengan universiti dan pelajar","Rundingan berlangsung beberapa hari dan kenaikan dikurangkan separuh. Tiada pihak benar-benar gembira, tetapi perhimpunan reda.||Pengulas menyebutnya sebagai penyelesaian matang.",{a:2,mo:-12,u:-2}],
 ["Sokong keputusan universiti","Perhimpunan bertukar menjadi bantahan yang lebih besar dan gambar pelajar tidur di dewan tular.||Beberapa pensyarah menyokong pelajar secara terbuka.",{a:-4,u:4,mo:5}],
 ["Lancarkan skim asrama bersubsidi dan kerja sambilan kampus","Skim ini memberi pelajar kerja sambilan di kampus dengan upah sewajarnya dan mengurangkan yuran untuk yang memerlukan. Pelajar menyambut baik, dan universiti dapat membantu menyelenggara kemudahan.||Kos setiap bulan tetap, tetapi pelaburan ini dilihat jangka panjang.",{a:5,mo:-25,u:-3,e:1,pol:"Student hostel and campus jobs scheme|Education"},"edu"]],{adv:"edu",rec:3,reg:["kch","mri"]}),
E("datacentre","eco","Pusat data mahu tenaga hidro tambahan",
"Sebuah syarikat teknologi merancang pusat data besar berhampiran Samalaju dan meminta jaminan bekalan elektrik berharga rendah selama sepuluh tahun. Projek itu menjanjikan pekerjaan teknikal dan hasil cukai, tetapi menggunakan elektrik yang sama untuk industri sedia ada.||Penduduk di Bintulu risau tarif akan naik untuk rumah, dan kumpulan alam sekitar mempersoalkan keperluan empangan baharu. Syarikat memberi masa dua minggu sebelum mereka memilih lokasi lain.",
[["Luluskan dengan syarat tarif rumah dilindungi","Syarikat bersetuju dengan syarat dan kerja bermula. Penduduk lega kerana tarif rumah dilindungi, tetapi industri sedia ada merungut bekalan terhad pada musim kemarau.||Pekerja teknikal muda mula pulang dari luar negeri.",{e:5,mo:25,a:2,u:1}],
 ["Tolak dan kekalkan bekalan untuk industri sedia ada","Industri tempatan lega dan kumpulan alam sekitar memuji. Syarikat teknologi memilih negeri lain dan beberapa pemerhati menyebutnya peluang yang terlepas.||Pekerjaan teknikal baharu tidak wujud.",{e:-2,a:1,u:-1}],
 ["Runding syarat tenaga boleh diperbaharui","Syarikat bersetuju membiayai sebahagian ladang solar sebagai syarat. Rundingan memakan masa tetapi hasilnya dianggap lebih mapan.||Kos awal lebih tinggi dan syarikat berasa dipaksa.",{e:3,mo:15,a:2,pol:"Renewable-powered data hub|Energy"}],
 ["Bina talian penghantaran tambahan untuk menampung kedua-duanya","Pasukan jurutera menyiapkan pelan talian baharu dan menunjukkan bekalan mencukupi untuk industri dan pusat data. Kedua-dua pihak menerima pelan itu.||Kos pembinaan tinggi, tetapi pelaburan ini membuka laluan untuk projek industri lain.",{e:6,mo:-30,a:3},"inf"]],{adv:"inf",rec:3,reg:["btu"]}),
E("parades","pol","Dua perarakan perayaan bertembung hari yang sama",
"Dua persatuan komuniti memohon permit perarakan di bandar yang sama pada petang yang sama, dan laluan mereka bersilang di satu bulatan sibuk. Kedua-duanya berkata tarikh itu tidak boleh diubah kerana berkait dengan upacara tradisi.||Polis menganggarkan puluhan ribu peserta dan bimbang tentang keselamatan serta salah faham. Pegawai bandar menawarkan beberapa pelan laluan, tetapi setiap satu mengecewakan sekurang-kurangnya satu pihak.",
[["Pisahkan masa dan laluan dengan pasukan penyelaras bersama","Pasukan penyelaras bertemu kedua-dua pihak dan menetapkan jadual berperingkat. Perarakan berjalan lancar dan peserta bertukar sapaan di bulatan.||Akhbar memuji suasana perpaduan.",{a:4,u:-3,mo:-8}],
 ["Luluskan satu sahaja dan tolak yang satu lagi","Pihak yang ditolak membantah secara terbuka dan merasa diketepikan. Perarakan yang diluluskan berjalan aman tetapi nada ketegangan kekal.||Beberapa pemimpin komuniti menulis surat kepada anda.",{a:-3,u:3}],
 ["Anjurkan satu perarakan bersama dengan tema perpaduan","Dua persatuan bersetuju selepas rundingan panjang dan menyertai satu perarakan besar. Gambar peserta dari kedua-dua pihak berpelukan tersebar.||Beberapa ahli kedua-dua persatuan tidak berpuas hati dengan kompromi.",{a:5,u:-4,w:1,mo:-12}],
 ["Kerah pasukan keselamatan dan kawalan kesesakan","Polis dan sukarelawan mengawal laluan dengan pelan terperinci. Tiada kejadian besar berlaku dan kesesakan terurus.||Beberapa peserta merungut tentang kehadiran polis yang ramai.",{a:2,u:-2,mo:-15},"sec"]],{adv:"sec",rec:2,reg:["kch","sib","mri"]}),
E("waterquality","env","Air paip kelihatan keruh di beberapa kampung",
"Penduduk di beberapa kampung berhampiran Sri Aman dan Betong melaporkan air paip berwarna perang dan berbau selepas hujan lebat. Seorang ibu memberitahu anaknya mengalami ruam selepas mandi dan klinik desa melaporkan peningkatan kes sakit perut.||Syarikat air berkata kualiti air masih dalam had, tetapi ujian bebas oleh sebuah universiti menunjukkan kekeruhan lebih tinggi daripada piawaian. Orang ramai menuntut jawapan dan air minuman alternatif.",
[["Edarkan air bersih dan siasat loji rawatan","Tangki air tiba dalam sehari dan pasukan jurutera memeriksa loji. Penduduk menyambut baik, dan hasil siasatan menemui kegagalan penapis yang dibaiki.||Kos penghantaran air agak tinggi tetapi kepercayaan awam pulih.",{a:4,mo:-25,u:-2}],
 ["Percayai laporan syarikat air","Syarikat menerbitkan data dan menegaskan air selamat. Penduduk tidak percaya dan membeli air botol sendiri.||Keputusan ujian bebas menjadi tajuk akhbar dan nama kerajaan disebut.",{a:-5,u:3}],
 ["Bentuk jawatankuasa pemantau air bersama penduduk dan universiti","Jawatankuasa mengambil sampel mingguan dan menerbitkan keputusan di papan kenyataan kampung. Ketelusan menenangkan penduduk, walaupun masalah penapis belum selesai.||Universiti gembira dapat membantu.",{a:3,mo:-12,u:-2,pol:"Community water monitoring|Environment"}],
 ["Hantar pasukan kesihatan dan lancarkan saringan segera","Pasukan kesihatan menyaring kanak-kanak dan memberi nasihat. Beberapa kes ruam dirawat awal dan penduduk berterima kasih.||Siasatan loji berjalan serentak.",{a:5,mo:-25,u:-3},"hlt"]],{adv:"hlt",rec:3,reg:["sri","bet"]}),
E("fedcond","fed","Persekutuan tawar projek dengan syarat",
"Pegawai Persekutuan menawarkan peruntukan besar untuk projek jalan dan klinik di beberapa bahagian, tetapi dengan syarat negeri bersetuju menyelaraskan beberapa dasar tanah dan perancangan dengan pusat. Pegawai negeri berkata wang itu boleh membina kemudahan yang sudah lama dijanjikan.||Penyokong hak negeri bimbang syarat itu akan melemahkan kedudukan tawar-menawar pada masa depan. Pelabur dan rakan gabungan menunggu keputusan anda sebelum menyusun rancangan mereka.",
[["Terima tawaran penuh","Wang tiba dan projek bermula. Pembangkang dan sebahagian penyokong autonomi mengkritik, dan pemerhati menyebutnya kompromi besar.||Rakyat di kawasan terlibat gembira dengan kemajuan.",{mo:70,a:3,m:-5,e:3}],
 ["Tolak dan teruskan dengan dana sendiri","Pendirian tegas disambut penyokong autonomi. Projek berjalan perlahan kerana dana terhad dan beberapa kawasan kecewa.||Hubungan dengan pusat sejuk buat sementara.",{m:5,a:1,mo:-30,e:-1}],
 ["Runding untuk syarat yang lebih ringan","Rundingan berlarutan tiga minggu dan hasilnya separuh daripada wang dengan syarat lebih sedikit. Kedua-dua pihak mengisytiharkan kemenangan sederhana.||Prosesnya dianggap matang oleh pemerhati.",{mo:35,m:-1,a:2,e:1}],
 ["Pecahkan tawaran: terima projek tanpa syarat, tangguh yang lain","Pegawai memilih projek yang tidak mengikat dasar dan menunda yang lain. Kedua-dua pihak boleh menerimanya.||Pemerhati menyebutnya langkah bijak.",{mo:40,m:1,a:3,e:2},"fin"]],{adv:"fin",rec:3}),
E("influencer","pol","Pempengaruh mengkritik kerajaan di media sosial",
"Seorang pempengaruh popular dari Sibu memuat naik video mengkritik pelaksanaan beberapa projek dan memberi contoh jalan berlubang serta klinik tanpa ubat. Video itu mendapat ratusan ribu tontonan dalam sehari dan disambut dengan komen sokongan serta kecaman.||Penasihat media anda berbeza pendapat: sebahagian mahu membalas secara langsung, sebahagian mahu mengabaikan, dan sebahagian mahu menjemput pempengaruh itu melihat sendiri.",
[["Jemput beliau melawat projek dan jawab soalan","Beliau menerima dan menyiarkan lawatan itu secara langsung. Sebahagian kritikan terbukti benar dan sebahagian tidak, dan penonton menghargai keterbukaan.||Beberapa pegawai berasa malu di depan kamera.",{a:3,u:-1,w:1}],
 ["Balas dengan kenyataan rasmi dan data","Kenyataan itu betul tetapi dianggap defensif. Peminat pempengaruh membalas dengan lebih banyak video.||Isu ini bertahan beberapa hari.",{a:-3,u:2}],
 ["Abaikan sehingga reda","Topik ini reda dalam seminggu tetapi sebahagian penonton menganggap kerajaan tidak peduli.||Ahli parti merungut bahawa kerajaan hilang naratif digital.",{a:-2,w:-1}],
 ["Tawarkan program digital rakyat dengan laporan masalah segera","Aplikasi laporan masalah dilancarkan dan pempengaruh itu menjadi pengguna pertama. Aduan diselesaikan dalam masa yang lebih singkat.||Rakyat berasa lebih didengari.",{a:5,mo:-18,u:-2,e:1,pol:"Citizen issue reporting app|Digital"},"dig"]],{adv:"dig",rec:3,reg:["sib"]}),
E("accident","soc","Kemalangan lori balak di jalan utama",
"Sebuah lori balak terbabas di jalan utama berhampiran Bintulu pada waktu hujan lebat dan menutup laluan selama enam jam. Dua orang cedera parah dan ambulans terperangkap dalam kesesakan. Keluarga mangsa berkata bantuan sampai lewat.||Isu keselamatan lori balak dan keadaan jalan dibangkitkan semula. Pemandu lori berkata mereka bekerja jam panjang dengan upah rendah, manakala penduduk menuntut had laju lebih ketat.",
[["Kuatkuasakan had laju dan semakan lori balak","Pemeriksaan mengejut dijalankan dan puluhan lori dikenakan tindakan. Penduduk lega, tetapi pengendali merungut kerugian masa.||Kemalangan kecil berkurang dalam sebulan.",{a:3,u:-1,e:-1,mo:-8}],
 ["Bina lorong kecemasan dan pusat ambulans di laluan itu","Pembinaan dimulakan dan ambulans diletakkan lebih dekat dengan kawasan berisiko. Masa respons turun dengan ketara.||Kos tinggi tetapi hasilnya dirasai.",{a:4,mo:-35,u:-2}],

function polDetect(title){const x=" "+title.toLowerCase()+" ",sc={};Object.keys(KW).forEach(c=>{sc[c]=KW[c].split(",").reduce((a,w)=>a+(x.includes(w)?w.length>3?2:1:0),0)});

function mapCat(str,title){const k=String(str||"").toLowerCase();if(PC[k])return k;if(CATMAP[k])return CATMAP[k];return polDetect(title||"").cat}
function polAnalyze(title,lv,catOver){lv=LVS[lv]?lv:"m";const det=polDetect(title||""),cat=catOver&&PC[catOver]?catOver:det.cat,pc=PC[cat],sc=LVS[lv],fx={};
 Object.keys(pc.fx).forEach(k=>fx[k]=+(pc.fx[k]*sc.f).toFixed(2));
 const area=pc.area,tx=(title||"").trim()||"…";
 const D=DESC[cat].map(arr=>arr.map(x=>x.replace("{t}",tx)).slice());
 const lvTxt=[{s:"Phase one is a small pilot in selected districts.",m:"",l:"It is a statewide commitment with a long funding horizon."},{s:"Fasa pertama ialah rintis kecil di daerah terpilih.",m:"",l:"Ia komitmen seluruh negeri dengan tempoh pembiayaan yang panjang."}];
 const ar=[area[2]>=1.25?"Rural and interior communities should benefit most.":area[0]>=1.15?"Towns and urban residents should benefit most.":"",area[2]>=1.25?"Komuniti luar bandar dan pedalaman sepatutnya paling banyak mendapat manfaat.":area[0]>=1.15?"Penduduk bandar sepatutnya paling banyak mendapat manfaat.":""];
 const desc=[0,1].map(i=>(D[i].slice(0,2).join(" ")+" "+lvTxt[i][lv]+" "+ar[i]+" "+D[i][2]).replace(/\s+/g," ").trim());
 return {cat,hit:det.hit,fx,cost:Math.round(pc.cost*sc.c),up:Math.max(1,Math.round(pc.up*sc.c*.9)),wk:Math.round(pc.wk*sc.w),cap:pc.cap+(lv==="l"?1:0),area,lv,desc,tags:[cat]}}
function popOf(p){const f=p.fx||{},a=p.area||[1,1,1];return clamp(50+(f.a||0)*28-(f.u||0)*14+(f.e||0)*10+(a[2]-1)*8)}
function polNorm(p){if(!p.fx){const c=mapCat(p.cat,p.title),a=polAnalyze(p.title,"m",c);Object.assign(p,{cat:c,fx:a.fx,cost:a.cost,up:a.up,wk:a.wk,cap:a.cap,area:a.area,tags:a.tags,lv:"m"});if(!p.desc)p.desc=a.desc[L()]}
 if(!PC[p.cat])p.cat=mapCat(p.cat,p.title);p.status=String(p.status);if(p.status==="1"&&p.left==null)p.left=p.wk||6;p.age=p.age||0;p.id=p.id||uid();if(p.pop==null)p.pop=popOf(p);return p}
function makePolicy(title,catStr,status){const c=mapCat(catStr,title),a=polAnalyze(title,"m",c);return polNorm({id:uid(),title,cat:c,desc:a.desc[L()],status:status||"1",lv:"m",fx:a.fx,cost:a.cost,up:a.up,wk:a.wk,cap:a.cap,area:a.area,tags:a.tags,left:a.wk,age:0})}
function polFx(){const cnt={},out={a:0,e:0,u:0,m:0},per={};S.policies.forEach(p=>{if(String(p.status)!=="2")return;const k=cnt[p.cat]=(cnt[p.cat]||0)+1,dim=1/(1+.35*(k-1)),mat=Math.min(1,.35+.13*(p.age||0)),f={};Object.keys(p.fx||{}).forEach(a=>{f[a]=p.fx[a]*dim*mat;out[a]=(out[a]||0)+f[a]});per[p.id]=f});const CAP={a:1.1,e:.9,u:.9,m:.5};Object.keys(out).forEach(k=>{const c=CAP[k]||1;out[k]=c*Math.tanh(out[k]/c)});return {out,per}}

function softFx(fx,ev){if(!ev)return {fx,note:""};const rel=new Set([...(RELP[ev.adv]||[]),...(RELC[ev.cat]||[])]);

 const n=hit.length,o=Object.assign({},fx);
 ["a","e","m"].forEach(k=>{if(o[k])o[k]=Math.round(o[k]<0?o[k]*(1-.3*n):o[k]*(1+.15*n))});
 if(o.u)o.u=Math.round(o.u>0?o.u*(1-.3*n):o.u*(1+.15*n));
 return {fx:o,note:"◆ "+B("Your policy softened the impact: ","Polisi anda meredakan kesan: ")+hit.map(p=>p.title).join(", ")}}

 if(p.lv==="l"){v-=5;why.push([B("Ambitious scope","Skop bercita-cita tinggi"),-5])}else if(p.lv==="s"){v+=4;why.push([B("Modest scope","Skop sederhana"),4])}
 if(S.policies.some(q=>q.id!==p.id&&q.cat===p.cat&&String(q.status)==="2")){v+=4;why.push([B("Builds on an existing policy","Membina atas polisi sedia ada"),4])}
 if(popOf(p)>=62){v+=4;why.push([B("Likely popular","Berkemungkinan popular"),4])}

 if(l.unrest>55)A("✹","Unrest is high. Try Community policing or a Youth programme.","Keresahan tinggi. Cuba rondaan komuniti atau program belia.");
 if(l.approval<50)A("↘","Approval is slipping. Visit weak seats or fund a local project.","Sokongan merosot. Kunjungi kerusi lemah atau biayai projek tempatan.");
 if(f.ratio>100)A("▭","Debt is heavy. Repay some debt before the market notices.","Hutang tinggi. Bayar sebahagian hutang sebelum pasaran bimbang.");
 if(l.money<120||f.net<0)A("◈","Funds are thin. Run a tourism campaign or choose a tighter budget stance.","Dana tipis. Jalankan kempen pelancongan atau pilih pendirian belanjawan lebih ketat.");
 if(!S.policies.some(p=>String(p.status)==="2"))A("§","No laws in force yet. Draft one in the Policy Lab.","Belum ada polisi berkuat kuasa. Draf satu di Makmal Polisi.");
 if(b.set!==g.term)A("▤","Table this term's budget (Budget tab).","Bentang belanjawan penggal ini (tab Belanjawan).");
 if(loyalty()<60)A("⬡","Coalition loyalty is low. Hold a Coalition retreat.","Kesetiaan gabungan rendah. Adakan retreat gabungan.");
 if(S.opp.str>65)A("⚠︎","The opposition is surging. Counter in marginal seats.","Pembangkang menaik. Bertindak di kerusi marginal.");
 if((g.wk||0)>=40&&!(g.pledges||[]).some(x=>x.term===g.term))A("◢","Election season is near. Your manifesto opens in week 47.","Musim pilihan raya hampir. Manifesto dibuka minggu 47.");
 const w=S.seats.map((q,i)=>[i,q.sup]).filter(x=>P(S.seats[x[0]].party)&&P(S.seats[x[0]].party).coal==="gov").sort((x,y)=>x[1]-y[1])[0];
 if(w&&w[1]<54)A("◎",S.seats[w[0]].name+" is your most marginal seat ("+w[1]+"%).",S.seats[w[0]].name+" ialah kerusi paling marginal anda ("+w[1]+"%).");
 if(!a.length)A("✓","Things look stable. Invest in a new policy while you can.","Keadaan stabil. Labur dalam polisi baharu selagi boleh.");
 return a.slice(0,3)}

mxE("monsoon",["Monsoon season warnings","Amaran musim tengkujuh"],["The weather service warns that the monsoon will bring heavy rain to the coast for the coming weeks. Drains in the older towns are clogged, and fishermen ask whether harbours will stay open.","Jabatan cuaca memberi amaran tengkujuh akan membawa hujan lebat ke pantai beberapa minggu akan datang. Longkang di pekan lama tersumbat dan nelayan bertanya sama ada pelabuhan kekal dibuka."],
 [[["Clear drains and pre-position relief","Bersihkan longkang dan sediakan bantuan awal"],["Crews work through the night and the first storms cause far less damage than feared.","Pasukan bekerja sepanjang malam dan ribut pertama menyebabkan kerosakan jauh lebih kecil daripada dijangka."],{a:4,mo:-25,u:-2}],[["Issue public warnings only","Keluarkan amaran awam sahaja"],["Costs stay low, but some towns flood anyway and residents ask why nothing was done.","Kos kekal rendah, tetapi beberapa pekan tetap banjir dan penduduk bertanya mengapa tiada tindakan."],{a:-2,u:3}],[["Fund a coastal flood barrier study","Biayai kajian benteng banjir pantai"],["Experts welcome the plan, though it will take years and the opposition calls it slow.","Pakar mengalu-alukan rancangan itu, walaupun ia mengambil masa bertahun dan pembangkang menyebutnya lambat."],{a:2,mo:-40,e:2}]],{when:s=>[10,11,0,1].includes(moNow()),adv:"inf",rec:0});
mxE("haze",["Haze blankets the cities","Jerebu menyelubungi bandar"],["Smoke from distant fires turns the sky yellow. Schools report children coughing, flights are delayed and clinics are crowded. Residents want to know who is responsible and what you will do.","Asap daripada kebakaran jauh menjadikan langit kuning. Sekolah melaporkan kanak-kanak batuk, penerbangan tertangguh dan klinik sesak. Penduduk mahu tahu siapa bertanggungjawab dan apa yang anda akan lakukan."],

mxE("gawai",["Gawai Dayak preparations","Persiapan Gawai Dayak"],["Communities are preparing for Gawai. Longhouse chiefs ask for help with transport, safety and funds for cultural events, and travellers will soon fill the roads and airports.","Komuniti bersiap untuk Gawai. Ketua rumah panjang meminta bantuan pengangkutan, keselamatan dan dana untuk acara budaya, dan pengembara akan segera memenuhi jalan serta lapangan terbang."],

mxE("sarawakday",["Sarawak Day celebrations","Sambutan Hari Sarawak"],["Sarawak Day on 22 July brings parades and speeches. Many people expect you to say something about the state's rights and its place in the federation.","Hari Sarawak pada 22 Julai menyaksikan perarakan dan ucapan. Ramai menjangka anda bercakap tentang hak negeri dan tempatnya dalam persekutuan."],

mxE("durian",["Durian glut hits farmers","Lambakan durian menjejas petani"],["A bumper harvest has pushed durian prices down. Smallholders say middlemen are paying less than the cost of transport, and some are leaving fruit to rot by the roadside.","Hasil melimpah menjatuhkan harga durian. Pekebun kecil berkata orang tengah membayar kurang daripada kos pengangkutan, dan ada yang membiarkan buah reput di tepi jalan."],

mxE("festival",["Rainforest music festival","Festival muzik hutan hujan"],["An international music festival is returning to the Cultural Village. Organisers need support, hotels want more flights, and some residents worry about noise and crowds.","Festival muzik antarabangsa kembali ke Kampung Budaya. Penganjur memerlukan sokongan, hotel mahu lebih banyak penerbangan, dan sesetengah penduduk bimbang tentang bunyi bising dan kesesakan."],

function flagSVG(p){const c=p.color||"#667085",d=shade(c,-.28),l=shade(c,.38),hv=hsh2((p.abbr||"")+(p.name||"")),pt=hv%8,W="#fff";let b="";
 if(FLAGX[p.id])b=FLAGX[p.id](c,d,l);
 else if(pt===0)b=`<rect width="90" height="60" fill="${c}"/><rect y="20" width="90" height="20" fill="${l}"/>${emblem(hv,45,30,9,W)}`;
 else if(pt===1)b=`<rect width="90" height="60" fill="${c}"/><polygon points="0,0 40,0 0,60" fill="${d}"/>${emblem(hv,60,30,10,W)}`;
 else if(pt===2)b=`<rect width="90" height="60" fill="${d}"/><polygon points="0,0 58,30 0,60" fill="${c}"/>${emblem(hv,22,30,8,W)}`;
 else if(pt===3)b=`<rect width="90" height="60" fill="${c}"/><rect x="26" width="12" height="60" fill="${l}"/><rect y="24" width="90" height="12" fill="${l}"/>${emblem(hv,13,12,7,W)}`;
 else if(pt===4){let r="";for(let i=0;i<12;i++){const a=i*Math.PI/6,a2=a+Math.PI/12;r+=`<polygon points="45,30 ${(45+90*Math.cos(a)).toFixed(1)},${(30+90*Math.sin(a)).toFixed(1)} ${(45+90*Math.cos(a2)).toFixed(1)},${(30+90*Math.sin(a2)).toFixed(1)}" fill="${c}"/>`}b=`<rect width="90" height="60" fill="${d}"/>${r}<circle cx="45" cy="30" r="11" fill="${W}"/>${emblem(hv,45,30,7,c)}`}
 else if(pt===5)b=`<rect width="90" height="60" fill="${c}"/><polygon points="90,0 90,60 0,60" fill="${d}"/>${emblem(hv,28,22,9,W)}`;
 else if(pt===6)b=`<rect width="90" height="60" fill="${c}"/><circle cx="45" cy="30" r="19" fill="${W}"/>${emblem(hv,45,30,10,c)}`;
 else b=`<rect width="30" height="60" fill="${c}"/><rect x="30" width="30" height="60" fill="${W}"/><rect x="60" width="30" height="60" fill="${d}"/>${emblem(hv,45,30,8,c)}`;
 return `<svg viewBox="0 0 90 60" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">${b}</svg>`}
function flagHTML(p,w){const im=pLogo(p),h=im&&w<40?w:Math.round(w*2/3);return `<span class="flagw${im?" logo":""}" style="width:${w}px;height:${h}px">${im?`<img src="${esc(im)}" alt="" style="width:100%;height:100%;object-fit:contain">`:flagSVG(p)}</span>`}
function faceHTML(name,color,sz,img){sz=sz||56;if(img)return `<img class="face" src="${esc(img)}" width="${sz}" height="${sz}" alt="" style="object-fit:cover">`;
 const n=(name||"").trim(),hv=hsh2(n||"?"),skin=["#f3d2b3","#e8b98d","#d49a6a","#b9774a","#8d5a36"][hv%5],hair=["#1c1c1c","#2d1b12","#4a3020","#6b6b6b","#1c1c1c"][(hv>>3)%5],st=(hv>>6)%5,gl=(hv>>9)%3===0,bg=color||"#667085";

 return frame(`<path d="M8 64c0-14 10-20 24-20s24 6 24 20z" fill="${shade(bg,-.35)}"/><rect x="27" y="36" width="10" height="10" rx="3" fill="${shade(skin,-.08)}"/><path d="M26 44l6 10 6-10z" fill="#fff"/><path d="M30 48h4l1 10-3 3-3-3z" fill="${bg}"/><ellipse cx="32" cy="26" rx="12" ry="14" fill="${skin}"/>${hairP}<circle cx="27" cy="26" r="1.5" fill="#222"/><circle cx="37" cy="26" r="1.5" fill="#222"/><path d="M28 33q4 3 8 0" stroke="#7a3b2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>${gl?`<g fill="none" stroke="#222" stroke-width="1.2"><circle cx="27" cy="26" r="4.2"/><circle cx="37" cy="26" r="4.2"/><path d="M31.2 26h1.6"/></g>`:""}`)}

function readImg(file,k){if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,256/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(im.width*m));cv.height=Math.max(1,Math.round(im.height*m));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);(window.__up=window.__up||{})[k]=cv.toDataURL("image/jpeg",.82)};im.onerror=()=>toast(B("That file is not a readable image","Fail itu bukan imej yang boleh dibaca"));im.src=fr.result};fr.readAsDataURL(file)}
