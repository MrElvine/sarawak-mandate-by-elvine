 const ids=(ev.reg||[]).map(dvIdx).filter(x=>x>=0),area=ids.length?`<p class="mu" style="margin-bottom:0">◉ ${t("aff")}: <b>${ids.map(i=>esc(DIV[i].n)).join(", ")}</b></p>${miniMap(ids)}`:"";
 o.innerHTML=`<div class="dlg wide" role="dialog" aria-modal="true"><p class="mu" style="margin:0 0 6px">▦ ${t("week")} ${Math.min(52,(g.wk||0)+1)}/52 · ${fmtDate(g.day)}</p><span class="tag" style="background:${cc[2]}">${cc[L()]}</span><h3>⚠︎ ${esc(ev.t[L()])}</h3><div class="chips mini">${stripChips()}</div>${ev.d[L()].split("||").map(x=>`<p>${esc(x)}</p>`).join("")}${area}${hint}${ev.c.map((c,i)=>{const lk=c.need&&!S.cabinet.some(m=>m.port===c.need);return `<button class="btn chb" data-ch="${i}" ${lk?"disabled":""}><span class="mu">${i+1}.</span> ${esc(c.t[L()])}${c.need?`<br><span class="mu">${lk?"▪ "+B("Needs a","Perlu menteri")+" "+PORT[c.need][L()]+" "+B("minister","")+"":"▫ "+B("Unlocked by your","Dibuka oleh menteri")+" "+PORT[c.need][L()]+" "+B("minister","")}</span>`:""}</button>`}).join("")}</div>`}
const ENX={"bario": ["Bario rice stuck at the airport", "The Bario harvest is nearly over, and more than 200 tonnes of highland rice have not reached Miri because pioneer flights were cancelled three times in two weeks due to thick fog. Farmers say air cargo now costs triple the usual rate, and stored rice is being attacked by weevils.||A local cooperative says hotels in Miri and Kuching will pay a premium, but only if supply arrives before month end. The district officer warns that the logging road to Bario is still too slippery for heavy trucks.", [["Subsidise special air cargo for Bario farmers", "Cargo planes carry the rice out in three days and the cooperative meets the hotel orders.", "The cargo bill exceeds the estimate, and finance officials warn that repeating it each season would become a fixed commitment."], ["Repair the logging road with local contractors", "Repairs start a week later and local truck drivers win small contracts.", "Progress is slow, and Bario residents say it does not help this season."], ["Build an online shop for interior produce", "Digital officers train Bario youth to photograph, pack and sell rice and crafts online, and the first orders arrive within two weeks.", "The effect is small this season because the stranded rice is still stuck, but the cooperative feels the future is opening up."]]], "sibumkt": ["Market traders squeezed by major repairs", "Sibu's central market is due to be partly closed for eight months for roof and sewerage upgrades. About 140 fish, vegetable and craft traders have been asked to move to a riverside site far from regular customers, and some say their income has already halved since last week.||The traders' association has brought a signed petition to your office. The council says the contract is signed and any delay will add costs for taxpayers.", [["Build a roofed temporary site nearby and give rent rebates", "The new site is ready in nine days with a roof and lighting, and customers begin to return.", "Spending runs above plan, and council officers complain that the temporary site needs daily supervision."], ["Proceed with the schedule unchanged", "Work starts on time and the council saves money, but traders stage a symbolic blockade and photos of empty stalls spread online.", "Some traders close for good, and the opposition calls it proof that the government cares more about contracts than ordinary people."], ["Split the works into two phases so half the market stays open", "Traders accept the two-phase plan, though building costs rise a little and completion slips.", "Contractors grumble about the harder job, but there is no major protest."]]], "bakunpower": ["Longhouses still rely on diesel generators", "A longhouse chief in Kapit has written an open letter saying 26 longhouses along the river still depend on diesel generators. Diesel prices are up and supplies arrive only twice a week by boat. Children cannot study at night, and a village clinic's vaccine fridge nearly failed.||The utility says a grid connection is too costly for the hilly river route but suggests solar micro-grids as an alternative. The district officer wants a decision before the rainy season closes the boat routes.", [["Fund solar micro-grids for all 26 longhouses", "Technical teams arrive by boat with solar panels and install the systems one by one.", "The cost is large and the treasury feels it, but the chief calls it the most meaningful decision in a decade."], ["Start with five longhouses as a pilot", "Five longhouses receive solar systems within a month and the results are praised.", "Officials say a phased rollout is easier to control, but political pressure will rise each week until everyone gets a turn."], ["Offer a temporary diesel subsidy only", "Generators run longer and residents are relieved for now.", "The chief thanks you politely but adds that they want a permanent fix, not seasonal aid."]]], "lngplant": ["Layoffs at the Bintulu plant", "A processing plant in Bintulu's industrial zone says it will halt one production line for six months and may lay off 380 contract workers. The union says many are from Bintulu and Kemena and still pay home and car loans.||Plant management says export demand is weak and they might reverse the decision if the state offers energy incentives or retraining. The opposition raises the issue on social media every day.", [["Offer energy incentives on condition that workers are retained", "The company cancels most of the layoffs and only 40 workers leave voluntarily.", "Other investors begin asking whether similar incentives will be offered to them, and finance officers worry about the precedent."], ["Fund retraining and job matching", "The Bintulu training centre takes its first 200 trainees within two weeks, and several local firms promise interviews.", "Even so, the line still shuts, and some workers feel training will not pay this month's mortgage."], ["Say it is the company's commercial decision", "The statement comes across as cold. The union holds a small rally outside your office and the layoffs go ahead on schedule.", "Investors like the firmness, but Bintulu voters remember the line, and the opposition turns it into a campaign headline."]]], "kchtransit": ["Kuching public transport route debate", "Residents of Samariang, Batu Kawah and Batu Kitang want the city bus route extended to new housing areas, because commutes now take over an hour at peak times. Downtown traders worry a new route will remove parking in front of their shops.||The operator says an extension is worthwhile only if the government covers half the cost of new vehicles. Local representatives want answers before the next sitting.", [["Extend the route and buy extra buses", "The new route opens after two months and ridership grows every week.", "Some downtown traders complain about lost parking, and maintenance costs add to the budget."], ["Build a park-and-ride first", "The edge-of-town car park is ready within a month and some drivers switch to existing buses.", "Residents of the new estates still feel forgotten and wait for a decision on their route."], ["Delay until a traffic study is done", "The study is scheduled for eight weeks and everyone is asked to be patient.", "The opposition calls the study an excuse not to decide."]]], "pepperlabour": ["Pepper farmers short of workers", "Ahead of the pepper picking season in Betong, Sarikei and Sri Aman, smallholders complain that many foreign workers did not return after their contracts ended, while village youth prefer city jobs. Ripe pepper is starting to fall in the gardens.||The growers' association asks for a bigger worker quota and a grant for picking machines. Agriculture officers say machine grants are costly and slow, and quota approval rests with the federal government.", [["Negotiate a seasonal quota with the federal government", "State officials shuttle to Putrajaya and a seasonal quota is approved at half of what was requested.", "The talks succeeded without a public quarrel, but some voices in the state say dependence on federal quotas is unhealthy."], ["Give a partial grant for picking machines", "The grant is approved and 90 farmers receive machines within two months.", "The grant costs more than first estimated, and officials say the investment pays off only after two seasons."], ["Launch a youth wage programme for pepper picking", "The programme draws 300 young people from town who want extra income during their break.", "The youth are only available on weekends, and farmers still need full-time workers."]]], "teacherhard": ["Interior teachers ask for extra allowances", "The teachers' union reports that seven interior schools in Kapit and Limbang lost their science and maths teachers this year through transfers, with no permanent replacement. One teacher says it takes a two-day boat trip to go home to his family.||Parents are worried about the year-end exams. The federal ministry manages teachers, but the state can offer extra allowances and housing.", [["Give state allowances and housing for interior teachers", "Within a month five new teachers accept offers and some existing teachers withdraw their transfer requests.", "Federal officials are a little uneasy that the state is stepping into their field, but they do not object openly."], ["Fund online tuition with community internet centres", "Students join online classes from the community hall, which now has better connectivity.", "The signal is unstable on rainy days, and parents still want teachers present in school."], ["Ask the federal government to solve it fully", "A letter goes out and a friendly reply arrives, but with no date.", "Parents write to the newspapers that the state should act on its own."]]], "bridge": ["Old bridge declared unsafe", "District engineers found cracks in the piers of an old bridge linking two villages in Sri Aman, and heavy lorries are already banned from using it. Two ferry operators are willing to carry residents across, but the fares are high.||A final-year student says she has to take a boat every morning to get to school. A contractor offers a quick fix at higher cost, or a cheaper fix that takes longer.", [["Build a temporary bridge and repair quickly", "The temporary bridge is ready in two weeks and small lorries can cross again.", "The speed is expensive, and some officials say part of the money could be used elsewhere."], ["Repair in stages at lower cost", "Work is slow and the bridge only partly reopens after a month.", "Spending stays under control and the engineers are satisfied, but nobody calls the decision clever."], ["Keep the ban and provide free boats", "Free boats run morning and evening and students arrive on time.", "The bridge is still not repaired, and the engineers warn the cracks could grow."]]], "scam": ["Wave of online scams", "In three weeks, police received more than 120 reports of phone and messaging-app scams in Kuching, Samarahan and Sibu. Many victims are elderly people and retirees who lost savings of tens of thousands of ringgit, and one pensioner lost his funeral savings.||Banks say they detect odd transactions but cannot block them without an order. Security officers suggest an awareness campaign, a 24-hour help centre, or cooperation with banks and telcos.", [["Set up a 24-hour help centre and community campaign", "The helpline receives 300 calls in its first week and some transactions are stopped before the money is lost.", "Running costs are fairly high, but the press praises it as a service that truly helps."], ["Form a special task force with banks and telcos", "The team freezes several scam accounts within a week and two suspects are arrested.", "The public awareness campaign is less visible, and some victims feel it came too late for them."], ["Issue public warnings only", "Warnings go out on social media and radio. Some people take notice, but the elderly who do not use social media are not reached.", "Scam reports keep rising and opposition representatives ask why no stronger action was taken."]]], "hornbill": ["Hornbills and a new road", "Wildlife experts found hornbill nests in the forest where a proposed road would link two longhouses near Batang Ai. Residents want the road because they now need a full day by boat to reach a clinic.||An environmental group offers a longer alternative route that would affect some farms. Tourists who come to see hornbills also bring income to the longhouses.", [["Reroute even though it is longer", "The road is redrawn and environmental experts express relief.", "Construction costs rise and the road is finished later, but residents agree once it is explained."], ["Keep the original route with protective fencing", "Work moves fast and residents are glad the road finishes early.", "Some tourists cancel bookings and the state's name appears in international reports."], ["Build an eco-tourism suspension bridge", "A small road and suspension bridge are built with light technology and the impact on hornbills is small.", "The cost is high, and the road cannot take large vehicles, so some residents still want a real road."]]], "audit": ["Audit report on unspent allocations", "An internal audit report shows nine small projects in several divisions have gone unspent even though funds were approved last year, including two community wells and a community hall. Journalists have published the list and are asking for answers.||Some department heads say the problem comes from bureaucracy and contractor delays. Opposition representatives want the full report released.", [["Release the full report and set completion dates", "The report is published and each project is given a new date.", "Some department heads feel publicly shamed, and relations inside government are tense for a while."], ["Reclaim the funds and change contractors", "Funds are withdrawn and new contractors appointed within two weeks.", "The old contractors complain and some party members feel they were punished without a hearing."], ["Treat it as an internal matter", "A short statement is issued and the issue seems to fade.", "The opposition calls it proof that the government is hiding things, and the issue will be raised again."]]], "gascyl": ["Cooking gas shortage in the interior", "Several grocery stores in Belaga, Lawas and interior Baram report that empty gas cylinders cannot be refilled because distribution lorries did not arrive after a road collapse. Families are cooking with firewood again, and cylinder prices in private shops have almost doubled.||Distributors say they lose money delivering to remote places without cost support. The district office offers boats and chartered helicopters, but the cost is high.", [["Fund special deliveries to cut-off areas", "Boats and helicopters carry cylinders to three locations within a week.", "The delivery cost is large for the volume, but district officers say its value shows in quality of life."], ["Set a price ceiling and give distributors incentives", "A price ceiling is announced and distributors receive a small incentive.", "Supply recovers somewhat in accessible areas, but remote areas are still short."], ["Encourage community biomass stoves", "Biomass stoves are installed in two community halls as a trial.", "Health experts advise good ventilation, and some families feel this is a step backwards."]]], "storm": ["Severe storm on the coast", "A violent storm with strong winds hit the Mukah and Dalat coast overnight, blowing off dozens of zinc roofs and sinking several fishing boats at the river mouth. Fishermen say they cannot go to sea for three days.||District officers estimate initial damage in the millions of ringgit. The fishermen's association asks for urgent help for boats and nets, and residents want an earlier warning system.", [["Provide a recovery package and boat insurance for fishermen", "The package is announced within three days and fishermen receive the first payment within a week.", "Finance officers note the insurance scheme needs regular funding, but fishermen say it is the first time they feel protected."], ["Build a coastal warning system and shelters", "Construction starts and warning towers go up at three sites.", "Some families who lost their roofs grumble that they are still waiting."], ["Provide temporary food aid only", "Food baskets go to 400 families and residents are grateful.", "The opposition calls the aid symbolic."]]], "english": ["Debate over the language of science and maths", "Parents' associations in several towns suggest teaching science and maths in two languages so children are better prepared for higher study and jobs. Some teachers worry that rural students will fall behind if English is emphasised too much.||Critics see the issue as a distraction. Education officers want direction on whether to begin a pilot study or wait for federal guidance.", [["Begin a pilot in ten schools", "Ten schools are chosen across urban and rural areas and teachers receive extra training.", "Some federal figures are uneasy with the move, but there is no open dispute."], ["Defer and refer to the federal government", "A letter goes out and a polite reply comes back with no commitment.", "Parents who want change feel the state is not bold enough, and advocates of education autonomy are disappointed."], ["Give extra language training to teachers only", "Language courses for 600 teachers are held during the school break.", "The effect is not immediate, but officials say it is a good foundation for any future change."]]], "bursary": ["State bursary disputed", "The list of state bursary recipients leaked online, and rural parents claim their high-achieving children were not chosen while some recipients have high-income parents. Ministry officers say the criteria are scored on grades and income.||Interior students made appeal videos that went viral. Representatives propose a recount and a rural quota.", [["Recalculate with a rural quota", "The list is updated within two weeks and 40 rural students are added.", "Some original recipients feel it is unfair and file complaints, but the number is small."], ["Defend the existing decision", "The ministry publishes a long explanation of the criteria.", "The student videos reach hundreds of thousands of views and anger in rural areas becomes plain."], ["Add bursary funds without changing the criteria", "Funds are increased and 60 more students receive bursaries.", "Finance officers say it is costly, and critics say the issue is fairness, not the amount."]]], "miriaged": ["Old oil wells and experienced workers", "Several old offshore oil wells off Miri are expected to close within three years, and a group of experienced workers in their late 50s fear they will find no other work. Eateries and rental housing near the base already feel the effect.||The company offers to cooperate on moving skills into new energy such as hydrogen. Miri traders ask the government to attract new tourists and investors.", [["Plan an energy transition with the company", "A transition plan is drawn up with the company and universities, and courses for experienced workers begin.", "Real results take years, and critics say the promise is still only on paper."], ["Promote tourism and events in Miri", "Various events are held and hotels record higher bookings.", "Oil workers feel they gain nothing directly, and the events are not a lasting fix."], ["Wait without a new plan", "Nothing happens and worry keeps spreading in the coffee shops.", "The opposition says the government has no plan for Miri's future."]]], "prices": ["Fresh food prices surge in markets", "Vegetable and fish suppliers in Sibu, Miri and Kuching report wholesale prices up almost a quarter in two weeks because of supply disruption and transport costs. Market traders say customers are buying half as much, and some single mothers told reporters they must choose between food and the electricity bill.||Consumer groups want price controls at once, while large suppliers warn that controls will empty the shelves. Ministry officers want instructions before the weekend.", [["Set a temporary price ceiling and send enforcement officers", "Enforcement officers patrol the markets and prices fall within days.", "The move is popular but cannot last without solving the supply problem."], ["Give food vouchers to low-income families", "Vouchers reach 40,000 families within two weeks.", "The vouchers cost a lot, and critics say they do not fix the cause of the price rise."], ["Let the market adjust", "Prices ease slowly after three weeks, but anger in the markets boils over.", "The opposition says the government does not feel the people's hardship."], ["Launch an open price platform and targeted subsidies", "A real-time price app is launched and subsidies go only to those who qualify.", "Finance officers are satisfied that costs stay in check, and the press praises the modern approach."]]], "illegal": ["Drone footage reveals illegal logging upriver", "Drone images sent by a group of longhouse youths in Kapit show a bulldozer opening a new logging road in an area not yet approved. The river below is already muddy and villagers say there are fewer fish.||The named company denies any wrongdoing and says the road is inside its licensed area. Forestry officers admit the old map boundaries are unclear, but the images have been shared tens of thousands of times.", [["Halt work at once and open an investigation", "The bulldozers stop and enforcement officers arrive within two days.", "The company complains about its losses, and some contract workers lose wages for now."], ["Ask the company to sort it out itself", "The company issues a statement and fences off part of the area.", "The issue keeps going viral and the government's name is mentioned in the comments."], ["Set up a community monitoring team with official drones", "A joint team of enforcement officers and youth is trained to fly drones every week.", "The cost is moderate, but community trust rises."], ["Freeze the area's licences and review the boundary maps", "Land officers check the maps and find two licences overlap.", "Investors understand the firmness, and critics lose their argument."]]], "hostel": ["Students protest hostel fees", "Several hundred students at the state university gathered on the campus field after hostel fees were raised by twenty percent. A second-year student told reporters he has to work nights at a restaurant to pay rent, and his grades have dropped.||The vice-chancellor says electricity and maintenance costs have exceeded the budget. The student union gives a week before taking a petition to the assembly.", [["Cover the cost gap from state funds", "The increase is cancelled and students cheer.", "The students publish an open thank-you letter."], ["Hold three-way talks with the university and students", "Talks run several days and the increase is cut in half.", "Commentators call it a mature solution."], ["Back the university's decision", "The gathering turns into a bigger protest and photos of students sleeping in the hall go viral.", "Some lecturers openly support the students."], ["Launch a subsidised hostel scheme and campus part-time jobs", "The scheme gives students campus part-time jobs at fair pay and reduces fees for those in need.", "The monthly cost is fixed, but the investment is seen as long term."]]], "datacentre": ["Data centre wants extra hydropower", "A tech company plans a large data centre near Samalaju and asks for a ten-year guarantee of low-priced electricity. The project promises technical jobs and tax revenue, but it would draw on the same power as existing industry.||Bintulu residents worry that household tariffs will rise, and environmental groups question whether a new dam is needed. The company gives two weeks before it picks another site.", [["Approve with household tariffs protected", "The company accepts the conditions and work begins.", "Young technical workers start returning from overseas."], ["Reject and keep supply for existing industry", "Local industry is relieved and environmental groups applaud.", "The new technical jobs do not appear."], ["Negotiate renewable energy conditions", "The company agrees to fund part of a solar farm as a condition.", "Upfront costs are higher and the company feels pressured."], ["Build an extra transmission line to serve both", "Engineers draw up a new line plan and show supply is enough for both industry and the data centre.", "Construction costs are high, but the investment opens the way for other industrial projects."]]], "parades": ["Two festival parades clash on the same day", "Two community associations applied for parade permits in the same town on the same afternoon, and their routes cross at a busy roundabout. Both say the date cannot be changed because it is tied to traditional rites.||Police estimate tens of thousands of participants and worry about safety and misunderstandings. City officers offer several route plans, but each disappoints at least one side.", [["Separate the timing and routes with a joint coordination team", "The coordination team meets both sides and sets a staggered schedule.", "The press praises the spirit of unity."], ["Approve only one and reject the other", "The rejected side protests openly and feels sidelined.", "Several community leaders write to you."], ["Organise one joint parade with a unity theme", "The two associations agree after long talks and join one big parade.", "Some members of both associations are unhappy with the compromise."], ["Deploy security forces and crowd control", "Police and volunteers manage the routes with a detailed plan.", "Some participants grumble about the heavy police presence."]]], "waterquality": ["Tap water looks cloudy in several villages", "Residents of several villages near Sri Aman and Betong report brown, smelly tap water after heavy rain. One mother says her child developed a rash after bathing, and the village clinic reports more stomach complaints.||The water company says quality is still within limits, but an independent university test shows turbidity above the standard. People demand answers and alternative drinking water.", [["Distribute clean water and investigate the treatment plant", "Water tanks arrive within a day and engineers inspect the plant.", "Water delivery costs are fairly high, but public trust recovers."], ["Trust the water company's report", "The company publishes data and insists the water is safe.", "The independent test results make headlines and the government's name is mentioned."], ["Form a water monitoring committee with residents and the university", "The committee takes weekly samples and posts the results on village notice boards.", "The university is glad to help."], ["Send health teams and launch immediate screening", "Health teams screen children and give advice.", "The plant investigation runs at the same time."]]], "fedcond": ["Federal government offers conditional projects", "Federal officials offer a large allocation for road and clinic projects in several divisions, on condition that the state aligns some land and planning policies with the centre. State officials say the money could build long-promised facilities.||State rights supporters worry the conditions will weaken the state's bargaining position later. Investors and coalition partners await your decision before setting their plans.", [["Accept the full offer", "The money arrives and projects begin.", "People in the affected areas welcome the progress."], ["Decline and proceed with its own funds", "The firm stand is welcomed by autonomy supporters.", "Relations with the centre cool for a while."], ["Negotiate lighter conditions", "Talks drag on for three weeks and the result is half the money with fewer conditions.", "Observers see the process as mature."], ["Split the offer: accept unconditional projects, defer the rest", "Officials pick projects that do not bind policy and postpone the others.", "Observers call it a smart move."]]], "influencer": ["Influencer criticises the government online", "A popular influencer from Sibu posted a video criticising the delivery of several projects, citing potholed roads and clinics without medicine. The video drew hundreds of thousands of views in a day and a mix of support and condemnation.||Your media advisers disagree: some want to reply directly, some want to ignore it, and some want to invite the influencer to see for himself.", [["Invite him to visit the projects and answer questions", "He accepts and streams the visit live.", "Some officials are embarrassed on camera."], ["Reply with an official statement and data", "The statement is accurate but comes across as defensive.", "The issue lingers for several days."], ["Ignore it until it fades", "The topic fades within a week, but some viewers think the government does not care.", "Party members grumble that the government lost the digital narrative."], ["Offer a citizens' digital programme with instant problem reporting", "A problem-reporting app is launched and the influencer becomes its first user.", "People feel more listened to."]]], "accident": ["Logging lorry crash on the main road", "A logging lorry overturned on the main road near Bintulu in heavy rain and blocked the route for six hours. Two people were seriously hurt and ambulances were stuck in the jam. Victims' families say help came late.||The safety of logging lorries and road conditions are raised again. Lorry drivers say they work long hours for low pay, while residents demand stricter speed limits.", [["Enforce speed limits and inspect logging lorries", "Surprise inspections are held and dozens of lorries are penalised.", "Minor accidents fall within a month."], ["Build an emergency lane and an ambulance post on the route", "Construction begins and ambulances are stationed closer to the risk area.", "The cost is high, but the results are felt."], ["Offer help to the victims' families only", "The families receive compensation and thanks, but residents feel the cause is not addressed.", "A similar accident happens two months later."], ["Launch a driver safety programme with mandatory rest", "Drivers are trained and rest times are enforced with incentives.", "Operators agree after talks and the union praises it."]]], "weakmp": ["Representative rarely visits the constituency", "Residents of a rural constituency wrote an open letter saying their representative is rarely seen and the service office is often closed. A pensioner says he has waited months for help repairing his house.||The representative says he has health problems but told no one. The opposition uses it as an example and names a candidate ready to take over.", [["Assign a temporary service officer and visit in person", "An officer is on duty two days a week and you visit the area.", "The representative feels embarrassed but agrees."], ["Ask him to take leave and appoint a trusted stand-in", "He takes leave and the stand-in is capable.", "The opposition still uses the issue."], ["Defend the representative publicly", "Backing a team-mate pleases party members, but residents feel unheard.", "The open letter gathers more signatures."], ["Set up a mobile service centre for remote areas", "A mobile service vehicle visits villages weekly and settles complaints on the spot.", "Operating costs are moderate but it is seen as an innovation."]]]};
EV.forEach(ev=>{const x=ENX[ev.id];if(!x)return;ev.t[0]=x[0];ev.d[0]=x[1];x[2].forEach((c,i)=>{ev.c[i].t[0]=c[0];ev.c[i].r[0]=c[1]+"||"+c[2]});ev.bm=false});
const RP={
approval:{u:[["Conversations at coffee shops and in family chat groups turn warmer, with more people saying the government is listening.","Perbualan di kopitiam dan kumpulan WhatsApp keluarga menjadi lebih hangat, dengan lebih ramai berkata kerajaan mendengar."],["Community leaders quietly tell your officers that the mood on the ground has improved.","Ketua komuniti memberitahu pegawai anda secara senyap bahawa suasana di bawah bertambah baik."]],d:[["Complaints pile up on local social media pages and your constituency offices report more angry calls.","Aduan menimbun di laman media sosial tempatan dan pejabat kawasan melaporkan lebih banyak panggilan marah."],["Even some loyal supporters admit privately that this hurt the government's image.","Malah sebahagian penyokong setia mengaku secara peribadi bahawa langkah ini menjejaskan imej kerajaan."]]},
unrest:{u:[["Small groups begin gathering in public spaces, and police ask whether they should prepare for larger crowds.","Kumpulan kecil mula berkumpul di ruang awam dan polis bertanya sama ada perlu bersedia untuk orang ramai lebih besar."],["Tempers are shorter in queues and markets, and rumours spread faster than official statements.","Emosi semakin pendek di barisan dan pasar, dan khabar angin tersebar lebih cepat daripada kenyataan rasmi."]],d:[["The street mood cools and organisers say planned gatherings are on hold for now.","Suasana jalanan menyejuk dan penganjur berkata perhimpunan yang dirancang ditangguhkan buat masa ini."],["Local officers report fewer tense incidents and more people willing to talk.","Pegawai tempatan melaporkan kurang kejadian tegang dan lebih ramai sanggup berbincang."]]},

document.addEventListener("pointerup",()=>{if(drag&&drag.moved)noClickUntil=Date.now()+80;drag=null});
/* ---------- events ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
document.addEventListener("click",e=>{
 if(Date.now()<noClickUntil)return;
 const el=e.target.closest("[data-spd],[data-act],[data-go],[data-f],[data-ch],[data-edit],[data-pe],[data-pc],[data-pd],[data-me],[data-md],[data-le],[data-ld],[data-psub],[data-prev],[data-prep],[data-sel],[data-div],[data-divgo],[data-lay],[data-lab],[data-z],[data-bg],[data-actcat],[data-diff],[data-perk],[data-hung],[data-dt],[data-dv],[data-vac],.seat,.cell,button[id]");if(!el)return;const d=el.dataset;
 if(d.divgo!==undefined){e.preventDefault();dview="cmd";dsel=+d.divgo;selDun=null;cur="dash";render();fitDiv(dsel);return}
 if(d.dt){dtab=d.dt;render();return}
 if(d.dv){dview=d.dv;render();return}
 if(d.vac){cabNew(d.vac);return}
 if(d.spd!==undefined){setSpd(d.spd);return}
 if(d.go){if(["policies","budget","election","journal"].includes(d.go)){cur="dash";dview=d.go}else{cur=d.go;if(d.go==="dash")dview="cmd"}window.__enter=true;render();return}
 if(el.id==="snd"){SND=!SND;beep("ok");render();return}
 if(el.id==="lg"){lang=lang==="en"?"ms":"en";render();return}
 if(el.id==="how"){showHow();return}
 if(d.lay!==undefined){lay=d.lay;render();return}
 if(d.lab!==undefined){labs=!labs;render();return}
 if(d.z!==undefined){if(d.z==="in")zoom(.7);else if(d.z==="out")zoom(1.4);else{dsel=null;selDun=null;render();resetView()}return}
 if(d.psub){voteModal(d.psub);return}
 if(d.prev){reviewModal(d.prev);return}
 if(d.prep){closeM();repeal(d.prep);return}
 if(d.diff!==undefined){startNew(d.diff);return}
 if(d.perk!==undefined){startTerm(window.__mand[+d.perk]);return}
 if(d.hung!==undefined){window.__hung[+d.hung][1]();closeM();render();mandateModal();return}
 if(d.actcat!==undefined){actCat=d.actcat;render();return}
 if(d.act){act(d.act);return}
 if(d.ch!==undefined){choose(+d.ch);return}
 if(d.edit!==undefined){seatModal(+d.edit);return}
 if(d.sel!==undefined){selDun=+d.sel;dsel=dv(selDun);render();fitDun(selDun);return}
 if(d.bg!==undefined){if(cur==="dash"&&(dsel!==null||selDun!==null)){dsel=null;selDun=null;render();resetView()}return}
 if(el.classList.contains("cell")){hl(null);const i=+d.i,di=+d.div;
  if(cur!=="dash"){seatModal(i);return}
  if(dsel!==di){dsel=di;selDun=null;render();fitDiv(di)}else if(selDun===i){selDun=null;render();fitDiv(di)}else{selDun=i;render();fitDun(i)}
  return}
 if(el.classList.contains("seat")){hl(null);seatModal(+d.i);return}
 if(d.f!==undefined&&(el.classList.contains("lg")||el.classList.contains("seg"))){flt=d.f&&flt!==d.f?d.f:null;render();return}
 if(d.pe)partyForm(P(d.pe));else if(d.pc){const p=P(d.pc);p.coal=p.coal==="gov"?"opp":"gov";toast(t("saved"));render()}else if(d.pd)delParty(d.pd);
 else if(d.me)cabForm(byId(S.cabinet,d.me));else if(d.md)ask(t("confirm"),()=>{S.cabinet=S.cabinet.filter(x=>x.id!==d.md)});
 else if(d.le){const q=byId(S.policies,d.le);if(String(q.status)==="0")labModal(q);else reviewModal(q.id)}else if(d.ld)ask(t("confirm"),()=>{S.policies=S.policies.filter(x=>x.id!==d.ld)});
 else if(el.id==="addP")partyForm();else if(el.id==="addM")cabForm();else if(el.id==="addL")labModal();
 else if(el.id==="resolve")showEvent();else if(el.id==="pl_save")labSave(0);else if(el.id==="pl_vote")labSave(1);else if(el.id==="pl_ai")claudePolicy();else if(el.id==="mc2")closeM();else if(el.id==="set")settingsModal();else if(el.id==="sv")saveModal();else if(el.id==="bud_open")budgetModal();else if(el.id==="bud_ok")budSave();else if(el.id==="sv_x")saveIO(0);else if(el.id==="sv_i")saveIO(1);else if(el.id==="cf_s"){cfgSet({key:$("#cf_k").value.trim(),model:$("#cf_m").value.trim()});closeM();toast(t("saved"))}else if(el.id==="cf_x"){cfgSet({key:""});$("#cf_k").value=""}else if(el.id==="nextterm")mandateModal();else if(el.id==="hungb")hungModal();else if(el.id==="endwk")endWeek();
 else if(el.id==="ok"){closeM();render();pulse=[];if(!S.game.first&&!S.game.over&&S.game.pend===null)fire(pickEv())}
 else if(el.id==="ng"||el.id==="ng2")newGame();
 else if(el.id==="sim"){const pid=$("#ep").value;if(!pid){toast(t("noP"));return}simulate(pid,+$("#es").value);toast(t("simDone"));render();pulse=[]}
 else if(el.id==="rst"){S=JSON.parse(JSON.stringify({...BASE,cabinet:S.cabinet,policies:S.policies,game:S.game,res:S.res,lv:S.lv}));flt=null;selDun=null;toast(t("restored"));render()}
});
function dunFilter(e){if(e.target.id==="q"||e.target.id==="qd"||e.target.id==="qp"){const tb=$("#tb");if(tb)tb.innerHTML=dunRows($("#q").value,$("#qd").value,$("#qp").value)}}
document.addEventListener("input",labInput);document.addEventListener("change",labInput);document.addEventListener("input",dunFilter);document.addEventListener("change",dunFilter);
document.addEventListener("keydown",e=>{
 const free=e.target===document.body&&$("#modal").hidden;
 if(["1","2","3","4"].includes(e.key)){const b=document.querySelector('[data-ch="'+(+e.key-1)+'"]');if(b&&!b.disabled&&!$("#modal").hidden){b.click();return}}
 if(e.code==="Space"&&free){e.preventDefault();endWeek();return}
 if(e.key==="Enter"||e.key===" "){const el=e.target.closest(".seat,.lg,.cell");if(el){e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}))}}});
/* ---------- hover highlight + tooltip ---------- */
const tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip);
function hl(el){
 const pid=el?el.dataset.p:null;
 document.querySelectorAll(".cell.dh").forEach(x=>x.classList.remove("dh"));
 document.querySelectorAll(".seat").forEach(c=>{const m=pid&&c.dataset.p===pid;c.style.opacity=pid?(m?1:.15):"";c.style.stroke=m?"#fff":"";c.style.strokeWidth=m?"3":""});
 if(!el){tip.style.display="none";return}
 const p=P(pid),s=S.seats[+el.dataset.i],n=cnt()[pid];
 tip.innerHTML=`<b>${esc(p?p.abbr:"?")}</b> · ${esc(p?p.name:"")}<br>${n} ${t("seats")} · ${p?t(p.coal):""}<br><span class="mu">${esc(s.name)} · ${esc(DIV[dv(+el.dataset.i)].n)} · ${s.sup}%</span>`;tip.style.display="block"}
function hr(el){const di=+el.dataset.div,ix=rng(di),g=ix.filter(i=>{const p=P(S.seats[i].party);return p&&p.coal==="gov"}).length;
 tip.innerHTML=`<b>◉ ${esc(DIV[di].n)}</b><br>${ix.length} ${t("seats")} · ${t("gov")} ${g} / ${t("opp")} ${ix.length-g}<br><span class="mu">${t("avgS")}: ${Math.round(ix.reduce((a,i)=>a+S.seats[i].sup,0)/ix.length)}%</span>`;tip.style.display="block"}
function dunTip(i){const q=S.seats[i],p=P(q.party);tip.innerHTML=`<b>${esc(q.name)}</b> (N.${q.id}) · ${esc(DIV[dv(i)].n)}<br>${p?esc(p.abbr)+" · "+esc(p.name):"?"}<br><span class="mu">${t("sup")}: ${q.sup}% · ${t("area"+q.area)}</span>`;tip.style.display="block"}
function cellHover(c){document.querySelectorAll(".cell.dh").forEach(x=>x.classList.remove("dh"));const di=+c.dataset.div;
 if(cur!=="dash"||dsel===di){dunTip(+c.dataset.i);c.classList.add("dh")}else{hr(c);document.querySelectorAll('.cell[data-div="'+di+'"]').forEach(x=>x.classList.add("dh"))}}
document.addEventListener("mouseover",e=>{const c=e.target.closest(".cell");if(c){cellHover(c);return}const el=e.target.closest(".seat");if(el)hl(el)});
document.addEventListener("mouseout",e=>{if(e.target.closest(".seat,.cell"))hl(null)});
document.addEventListener("mousemove",e=>{if(tip.style.display==="block"){tip.style.left=Math.min(e.clientX+14,innerWidth-250)+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-90)+"px"}});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest(".seat");if(el){hl(el);const r=el.getBoundingClientRect();tip.style.left=Math.min(r.right+8,innerWidth-250)+"px";tip.style.top=r.top+"px"}});
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest(".seat"))hl(null)});
const loaded=load();window.__enter=true;render();
if(loaded&&S.game.pend!==null&&!S.game.over)showEvent();else if(!loaded)showHow();
</script></body></html>
