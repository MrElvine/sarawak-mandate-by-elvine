<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarawak Pulse Dashboard</title>
  <style>
    :root{
      --bg:#f2f5fb;--ink:#1d2a3a;--muted:#64748b;--card:#ffffff;--line:#dfe7f3;--navy:#142c4d;--blue:#1e5cb8;--gold:#e6b14c;--green:#1b8d64;--red:#c73b52;--shadow:0 16px 38px rgba(18,34,59,.08);
    }
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:linear-gradient(180deg,#edf3fb,#f8fafc);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{padding:24px 18px 40px}
    .wrap{max-width:1180px;margin:0 auto}
    .top{background:linear-gradient(135deg,#10213e,#244b7d);color:#fff;border-radius:18px;padding:22px 22px 18px;box-shadow:var(--shadow)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .eyebrow{letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:800;color:#d9e5fb}
    h1{margin:8px 0 6px;font-size:clamp(28px,4vw,38px);line-height:1.1}
    .sub{margin:0;color:#d8e4f7;max-width:720px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;padding:10px 14px;border:1px solid transparent;font-weight:700;cursor:pointer;transition:.2s ease}
    .btn.primary{background:var(--gold);color:#182338;border-color:var(--gold)}
    .btn.secondary{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
    .btn:hover{transform:translateY(-1px)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
    .metric .label{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
    .metric b{display:block;margin-top:8px;font-size:2rem;line-height:1.1}
    .metric small{display:block;margin-top:5px;color:var(--muted)}
    .two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:12px}
    .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .head h2{margin:0;font-size:1.1rem}
    .pill{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line);background:#f8fafc;color:var(--muted)}
    .priority-list{display:grid;gap:10px}
    .priority{padding:12px 12px 10px;border-left:4px solid var(--blue);border-radius:10px;background:#f5f8ff}
    .priority.warn{border-left-color:var(--red);background:#fff3f5}
    .priority.good{border-left-color:var(--green);background:#eefaf5}
    .priority strong{display:block;font-size:1rem;margin-bottom:3px}
    .priority span{color:var(--muted);font-size:.92rem}
    .seatlist{display:grid;gap:10px}
    .seat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf2f9}
    .seat:last-child{border-bottom:none;padding-bottom:0}
    .seat .name{font-weight:700}
    .seat .meta{font-size:12px;color:var(--muted);margin-top:3px}
    .score{font-weight:800;color:var(--navy)}
    .bar{width:100%;height:8px;margin-top:6px;background:#edf2fa;border-radius:999px;overflow:hidden}
    .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#91b3ff)}
    .bar.red i{background:linear-gradient(90deg,#d34a62,#f7a8b7)}
    .bar.gold i{background:linear-gradient(90deg,#d79a19,#f3ca6a)}
    .taskcard{margin-top:14px}
    .taskform{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .taskform input{flex:1;min-width:220px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff}
    .tasklist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
    .task{display:flex;align-items:flex-start;gap:10px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
    .task input{margin-top:3px;accent-color:var(--blue)}
    .task span{flex:1;overflow-wrap:anywhere}
    .task.done span{text-decoration:line-through;color:var(--muted)}
    .task .x{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 2px}
    .empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fafbfd}
    .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .chip{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#eef4ff;color:#214b8d;font-size:12px;font-weight:700}
    @media (max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
    @media (max-width:480px){.grid{grid-template-columns:1fr}.taskform{flex-direction:column}.top{padding:18px 16px}.btns{display:flex;flex-direction:column;align-items:stretch}.btn{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="topbar">
        <span class="eyebrow">Sarawak Pulse</span>
        <button class="btn secondary" type="button" id="refresh">Refresh</button>
      </div>
      <h1>Campaign pulse dashboard</h1>
      <p class="sub">A quick tactical overview for your current term: public mood, budget pressure, vulnerable seats, and your next-turn checklist.</p>
      <div class="btns">
        <a class="btn primary" href="sarawak-phase2.html">Open game</a>
        <a class="btn secondary" href="strategy-planner.html">Planner</a>
      </div>
    </header>

    <section id="status" class="card" style="margin-top:18px"></section>
    <section id="metrics" class="grid" aria-live="polite"></section>

    <div class="two">
      <section class="card">
        <div class="head"><h2>Strategic priorities</h2><span class="pill" id="pill">Live</span></div>
        <div id="priorities" class="priority-list"></div>
      </section>

      <section class="card">
        <div class="head"><h2>Seat pressure</h2><span class="pill">Government-held seats</span></div>
        <div id="seats" class="seatlist"></div>
      </section>
    </div>

    <section class="card taskcard">
      <div class="head"><h2>Turn checklist</h2><span class="pill">Local-only</span></div>
      <form class="taskform" id="taskForm">
        <input id="taskInput" maxlength="120" placeholder="Add a reminder for the next week..." aria-label="Add reminder">
        <button class="btn primary" type="submit">Add</button>
      </form>
      <ul id="taskList" class="tasklist"></ul>
    </section>
  </div>

  <script>
    const SAVE_KEY = 'sps_v6';
    const TASK_KEY = 'sps_pulse_tasks_v1';
    const $ = s => document.querySelector(s);
    const safe = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function getTasks(){
      try {
        const val = JSON.parse(localStorage.getItem(TASK_KEY) || '[]');
        return Array.isArray(val) ? val.filter(x => x && typeof x.text === 'string') : [];
      } catch { return []; }
    }

    function setTasks(tasks){
      try { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); } catch {}
    }

    function metric(label, value, note) {
      return `<article class="card metric"><div class="label">${label}</div><b>${value}</b><small>${note}</small></article>`;
    }

    function renderTasks(){
      const tasks = getTasks();
      const list = $('#taskList');
      if (!tasks.length) {
        list.innerHTML = '<li class="empty">No reminders yet. Add one for next week.</li>';
        return;
      }
      list.innerHTML = tasks.map((task, idx) => `
        <li class="task ${task.done ? 'done' : ''}">
          <input type="checkbox" ${task.done ? 'checked' : ''} data-check="${idx}" aria-label="Mark task complete">
          <span>${safe(task.text)}</span>
          <button class="x" type="button" data-remove="${idx}" aria-label="Remove task">×</button>
        </li>
      `).join('');
    }

    function renderGame(){
      let save;
      try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch { save = null; }
      const state = save && save.S;
      if (!state || !Array.isArray(state.seats) || !state.lv || !state.game || !Array.isArray(state.parties)) {
        $('#status').innerHTML = '<p style="margin:0;color:var(--muted)">No game save detected. Open the simulator and play a session to enable this dashboard.</p>';
        $('#metrics').innerHTML = '<div class="card empty" style="grid-column:1/-1">No save found.</div>';
        $('#priorities').innerHTML = '<div class="empty">No game state loaded.</div>';
        $('#seats').innerHTML = '<div class="empty">No seat data.</div>';
        return;
      }

      const parties = Object.fromEntries(state.parties.map(p => [p.id, p]));
      const govSeats = state.seats.filter(s => parties[s.party] && parties[s.party].coal === 'gov');
      const majority = Math.floor(state.seats.length / 2) + 1;
      const approval = Math.max(0, Math.min(100, Number(state.lv.approval) || 0));
      const unrest = Math.max(0, Math.min(100, Number(state.lv.unrest) || 0));
      const economy = Math.max(0, Math.min(100, Number(state.lv.economy) || 0));
      const money = Number(state.lv.money) || 0;
      const term = Number(state.game.term) || 1;
      const week = Math.min(52, (Number(state.game.wk) || 0) + 1);

      $('#status').innerHTML = `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center"><div><strong>Game loaded</strong> · Term ${term} · Week ${week}/52</div><div class="chip-row" style="margin-top:0"><span class="chip">Gov seats: ${govSeats.length}/${state.seats.length}</span><span class="chip">Majority: ${majority}</span></div></div>`;

      $('#metrics').innerHTML = [
        metric('Approval', `${approval}%`, approval < 45 ? 'Public mood is fragile' : 'Stable voter confidence'),
        metric('Unrest', `${unrest}%`, unrest > 60 ? 'Tension is building' : 'A manageable level'),
        metric('Economy', `${economy}%`, economy < 40 ? 'Economic pressure is high' : 'Growth is moving well'),
        metric('State funds', `RM ${money}m`, money < 100 ? 'Budget is tight' : 'Cash buffer intact')
      ].join('');

      const priorities = [];
      if (money < 100) priorities.push(['warn','Protect cash flow','Your treasury is thin. Avoid expensive commitments unless they are clearly strategic.']);
      if (unrest >= 60) priorities.push(['warn','Lower public tension','A wave of unrest is visible. Shift toward visible service delivery and dialogue.']);
      if (approval < 45) priorities.push(['warn','Rebuild trust','Approval is weak. Focus on visible improvements and responsive governance.']);
      if (govSeats.length < majority) priorities.push(['warn','Secure a working majority','You are short of a simple majority. Watch coalition discipline and seat transfers.']);
      if (economy < 40) priorities.push(['warn','Stabilize the economy','The economy is under pressure. Prioritize job creation and practical relief.']);
      if (!priorities.length) priorities.push(['good','Momentum is healthy','No urgent warning trigger is active. Keep your budget and coalition stable.']);
      $('#priorities').innerHTML = priorities.map(([type,title,text]) => `
        <div class="priority ${type === 'warn' ? 'warn' : 'good'}">
          <strong>${safe(title)}</strong>
          <span>${safe(text)}</span>
        </div>
      `).join('');

      const atRisk = state.seats
        .filter(s => parties[s.party] && parties[s.party].coal === 'gov')
        .map(s => ({ ...s, party: parties[s.party] }))
        .sort((a,b) => (Number(a.sup) || 0) - (Number(b.sup) || 0))
        .slice(0, 6);

      $('#seats').innerHTML = atRisk.length ? atRisk.map(s => {
        const v = Math.max(0, Math.min(100, Number(s.sup) || 0));
        let barClass = 'gold'; if (v < 45) barClass = 'red'; if (v >= 58) barClass = 'green';
        return `
          <div class="seat">
            <div>
              <div class="name">${safe(s.name)}</div>
              <div class="meta">${safe(s.party.abbr || s.party.name)} · ${safe(s.area === 0 ? 'Urban' : s.area === 1 ? 'Semi-urban' : 'Rural')}</div>
              <div class="bar ${barClass}"><i style="width:${v}%"></i></div>
            </div>
            <div class="score">${v}%</div>
          </div>
        `;
      }).join('') : '<div class="empty">No vulnerable government seats available.</div>';
    }

    $('#refresh').addEventListener('click', renderGame);
    $('#taskForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = $('#taskInput');
      const text = input.value.trim();
      if (!text) return;
      const tasks = getTasks();
      tasks.push({ text, done: false });
      setTasks(tasks);
      input.value = '';
      renderTasks();
      input.focus();
    });

    $('#taskList').addEventListener('change', e => {
      if (!e.target.matches('[data-check]')) return;
      const tasks = getTasks();
      const idx = Number(e.target.dataset.check);
      if (Number.isNaN(idx) || !tasks[idx]) return;
      tasks[idx].done = e.target.checked;
      setTasks(tasks);
      renderTasks();
    });

    $('#taskList').addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      const tasks = getTasks();
      const idx = Number(btn.dataset.remove);
      if (Number.isNaN(idx) || !tasks[idx]) return;
      tasks.splice(idx, 1);
      setTasks(tasks);
      renderTasks();
    });

    renderGame();
    renderTasks();
  </script>
</body>
</html>
